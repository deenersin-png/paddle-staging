//    12:30–1:32 AM EB trip. It was last seen at 1:40 AM, right after that
//    trip finished. It has been off the feed since then."
function ghostBusTip(blk, vid) {
  const byRoute = blockPairs.get(String(blk));
  if (!byRoute) return '';
  let first = Infinity, last = 0;
  for (const p of byRoute.values()) if (p.vehicleId === vid && isPairFresh(byRoute, p)) { first = Math.min(first, p.first || p.ts); last = Math.max(last, p.ts); }
  if (!last || !isFinite(first)) return '';
  const toMin = ms => serviceNowMin() - (Date.now() - ms) / 60000;
  const clock = ms => new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  const trips = [];
  for (const t of sched.blockTrips.get(String(blk)) || []) {
    const s = timeStrToMin(t.start), e = timeStrToMin(t.end);
    if (s != null && e != null && !isPhantomTrip(blk, s) && !trips.some(x => x.s === s)) trips.push({ s, e, dir: tripDirOf(t) });
  }
  trips.sort((a, b) => a.s - b.s);
  const name = x => fmtClock(x.s) + '–' + fmtClock(x.e) + ' ' + dirShort(x.dir) + ' trip';
  const during = m => trips.find(x => m >= x.s - 1 && m <= x.e + 1);
  const before = m => trips.filter(x => x.e < m).pop();
  const fm = toMin(first), lm = toMin(last);
  const fT = during(fm);
  let txt = vid + ' first appeared on ' + blk + ' at ' + clock(first) + ' in SEPTA’s live feed' + (fT ? ', on the ' + name(fT) : '') + '.';
  if (last - first > 60000) {
    const lT = during(lm), bT = !lT && before(lm);
    txt += ' It was last seen at ' + clock(last) +
      (lT ? (lT === fT ? ', still on that trip' : ', on the ' + name(lT)) : bT ? (bT === fT ? ', right after that trip finished' : ', right after the ' + name(bT) + ' finished') : '') + '.';
  }
  const off = Math.round((Date.now() - last) / 60000);
  return txt + ' It has been off the feed since then' + (off >= 1 ? ' (' + (off >= 60 ? Math.floor(off / 60) + ' h ' + (off % 60) + ' min' : off + ' min') + ').' : '.');
}

// One floating box for the bus-number notes: hover on a computer, tap on a
// phone (the card clips anything drawn inside it).
(function setupBusTips() {
  let box = null, cur = null;
  const hide = () => { if (box) box.hidden = true; cur = null; };
  const show = el => {
    if (!box) { box = document.createElement('div'); box.className = 'bus-tip'; document.body.appendChild(box); }
    cur = el; box.textContent = el.dataset.tip; box.hidden = false;
    const r = el.getBoundingClientRect(), w = Math.min(300, window.innerWidth - 24);
    box.style.width = w + 'px';
    box.style.left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12)) + 'px';
    const h = box.offsetHeight;
    box.style.top = (r.top - h - 8 > 8 ? r.top - h - 8 : r.bottom + 8) + 'px';
  };
  document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el && el !== cur) show(el); });
  document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && el === cur && !el.contains(e.relatedTarget)) hide(); });
  document.addEventListener('click', e => { const el = e.target.closest('[data-tip]'); if (el) show(el); else hide(); });
  window.addEventListener('scroll', hide, { passive: true });
})();

// Sort the route's cards into this direction's live items.
function liveDirItems(dir) {
  const nowMin = serviceNowMin();
  const show = (state.bus || state.block) ? new Set(lastCards.map(b => String(b.BlockID || ''))) : null;
  const running = [], layover = [];
  for (const b of lastRouteCards) {
    const blk = String(b.BlockID || '');
    const isLive = !b._scheduledOnly && !b._isLayover;
    const isGhost = b._scheduledOnly && b._schedState === 'in_service_expected';
    let isLay = b._scheduledOnly && b._schedState === 'layover_expected';
    const trip = cardTrip(b);
    if (!trip) continue;
    // A live bus whose trip hasn't started yet and hasn't left the first stop
    // is waiting at the terminal.
    const waiting = isLive && trip.s > nowMin && (b.next_stop_sequence || 0) <= 1;
    // In from another route ("21-42"): its last trip there is over and the
    // next one is here → layover here.
    if (b._scheduledOnly && b._schedState === 'not_started') {
      const pt = partnerTripsOf(blk);
      isLay = pt.some(x => x.e <= nowMin) && !pt.some(x => x.e > nowMin && x.s < trip.s);
    }
    // Going to another route before its next trip here → that route's page.
    if (isLay && partnerTripsOf(blk).some(x => x.e > nowMin && x.s < trip.s)) continue;
    if (!isLive && !isGhost && !isLay) continue;
    if (trip.dir !== dir) continue;
    const it = { blk, s: trip.s, e: trip.e, dir, nth: tripNum(blk, trip.s), liveView: true,
                 left: tripsLeftFrom(blk, dir, trip.s), cur: isLive && !waiting, inService: isLive && !waiting,
                 live: isLive && !waiting ? b : null, vid: String(b.VehicleID || '').trim(),
                 pos: b.next_stop_sequence || 0, ghost: isGhost, mine: !show || show.has(blk),
                 lat: isLive ? b.lat : null, lng: isLive ? b.lng : null };
    if (isLay || waiting) { it.layover = true; layover.push(it); } else running.push(it);
  }
  // Leader / follower colours among the buses actually online.
  const online = running.filter(x => !x.ghost && x.nth).sort((a, b) => a.nth - b.nth);
  running.forEach(x => {
    if (x.ghost) { x.tagCls = 'gray'; return; }
    const i = online.indexOf(x);
    const leader = i > 0 ? online[i - 1] : null, follower = i >= 0 && i < online.length - 1 ? online[i + 1] : null;
    x.tagCls = follower && follower.pos > x.pos ? 'red' : leader && x.pos > leader.pos ? 'yellow' : 'green';
  });
  // Furthest along on top (that's the smallest number unless someone passed);
  // ghosts hold their number's slot.
  const order = running.filter(x => !x.ghost).sort((a, b) => b.pos - a.pos || a.nth - b.nth);
  running.filter(x => x.ghost).sort((a, b) => a.nth - b.nth).forEach(g => {
    const i = order.findIndex(x => x.nth > g.nth);
    order.splice(i < 0 ? order.length : i, 0, g);
  });
  layover.sort((a, b) => a.s - b.s || a.nth - b.nth);
  return order.concat(layover).filter(x => x.mine);
}

function buildLiveDirPage(dir, anim) {
  const items = liveDirItems(dir);
  const n = items.filter(x => !x.layover).length, lay = items.length - n;
  let h = '<div class="section-label' + (anim ? ' fade-in' : '') + '">' + esc(dirShort(dir)) + ' · ' + n + ' bus' + (n !== 1 ? 'es' : '') +
    (lay ? ' · ' + lay + ' on layover' : '') + '</div>';
  lastLiveItems = items;
  if (!items.length) return h + '<div class="at-empty">No ' + esc(dirShort(dir)) + ' buses right now</div>';
  return h + '<div class="at-list">' + items.map((it, i) => allTripsCardHtml(it, anim, i)).join('') + '</div>' + liveMapBoxHtml();
}

// ── LIVE MAP ─────────────────────────────────────────────────
// Under the cards on the EB / WB pages: every bus on the page as a small bus
// icon "#11-9652" (trip number - block) in its tag's colour. One map element
// for the whole visit (assets/pa-live-map.js), moved into each redraw's slot
// so zoom and position survive the refreshes. Always shown (no Hide button,
// user 2026-11-11; an old saved "hidden" is ignored).
let lastLiveItems = [];
let liveMapP = null;
function liveMapBoxHtml() {
  return '<div class="lm-box"><div class="lm-slot"></div></div>';
}
function drawLiveMap(dir) {
  const slot = document.querySelector('#content .lm-slot');
  if (!slot) return;
  if (!liveMapP) liveMapP = import('./assets/pa-live-map.js').then(m => m.createLiveMap());
  liveMapP.then(m => {
    m.attach(slot);
    const nowMin = serviceNowMin();
    m.update({ route: state.route, dir, nowMin, items: lastLiveItems.map(it => ({
      nth: it.nth, blk: it.blk, s: it.s, e: it.e, lat: it.lat, lng: it.lng,
      cls: it.layover ? 'lay' : (it.tagCls || 'green'),
      layStop: it.layover ? layoverStop(it.blk, it.s) : '',
      title: (it.vid && it.vid !== '0' ? 'Bus ' + it.vid + ' · ' : '') + 'Block ' + it.blk + (it.layover ? ' · layover, next trip ' + fmtClock(it.s) : ''),
    })) });
  }).catch(e => { liveMapP = null; console.error('[live map]', e); });
}

// ── TRIP SHEETS: DAY BUTTONS ─────────────────────────────────
// SUNDAY / WEEKDAY / SATURDAY - plus any other day a depot's pick has (an
// alternate schedule uploaded the way the Paddles page reads them: a "days"
// entry in the manifest and its CSV) - each shows that day's whole trip sheet.
// Today's day is the live sheet as before. Another day is the plain
// timetable with that day's runs: no live buses, nothing done. The Run /
// Block search goes by the day shown. The timetable (GTFS) only has Weekday /
// Saturday / Sunday: an alternate day uses the one its name says ("Saturday
// Alt" → Saturday), else Weekday.
const TS_DAY_ORDER = ['Sunday', 'Weekday', 'Saturday'];
const tsPickCache = new Map();   // day label → { byBlock, routesByDepot }
const tsTTCache = new Map();     // route → GTFS route json
let tsBackup = null;             // today's data while another day is shown
let tsDaySeq = 0;

function gtfsDayOf(label) {
  const l = String(label).toLowerCase();
  return l.includes('sat') ? 'saturday' : l.includes('sun') ? 'sunday' : 'weekday';
}
function todayDayLabel() { const d = getDayType(); return d.charAt(0).toUpperCase() + d.slice(1); }
// The selected depot's days, in the Paddles page's order; alternates after.
function tsDays() {
  const m = paddle.manifest;
  const depot = document.getElementById('depotSelect').value;
  const dist = m && (m.districts || []).find(d => (d.label || d.name) === depot);
  const days = dist && dist.days && dist.days.length ? dist.days.slice() : TS_DAY_ORDER.slice();
  const rank = d => { const i = TS_DAY_ORDER.indexOf(d); return i < 0 ? 10 : i; };
  return days.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
}
function tsDayButtonsHtml() {
  const today = todayDayLabel(), cur = view.tsDay || today;
  return PaTags.dayTags(tsDays(), cur, today, 'data-ts-day');
}
// The header's day row (Trip Sheets only), redrawn with the page.
function renderTsDayRow() {
  const row = document.getElementById('tsDayRow');
  if (!row || !ALL_TRIPS_PAGE) return;
  const html = tsDayButtonsHtml();
  if (row.innerHTML !== html) row.innerHTML = html;
  row.hidden = false;
}

// One day's pick, every depot, on a plain day clock (night liners: 11:54 PM
// report = -6; day runs' after-midnight times 24:00+).
async function loadPickDay(label) {
  if (tsPickCache.has(label)) return tsPickCache.get(label);
  const m = paddle.manifest || await fetch(PADDLE_BASE + '/manifest.json').then(r => r.json());
  const byBlock = new Map(), routesByDepot = new Map(), nightBlocks = new Map();
  const clock = t => { const v = clockToMin(String(t || '').trim()); return isFinite(v) ? v : null; };
  const morningMin = t => { const v = clock(t); return v == null ? null : v >= NIGHT_FROM_HR * 60 ? v - 1440 : v; };
  await Promise.allSettled((m.districts || []).map(async district => {
    if (!district.days || !district.days.includes(label)) return;
    const depot = district.label || district.name;
    const depotRoutes = new Set();
    routesByDepot.set(depot, depotRoutes);
    const [csv, pdfs] = await Promise.all([
      fetch(PADDLE_BASE + '/' + district.name + '/' + encodeURIComponent(label.toLowerCase()) + '.csv').then(r => r.ok ? r.text() : ''),
      fetch(PADDLE_BASE + '/' + district.name + '/pdfs.csv').then(r => r.ok ? r.text() : '')
    ]);
    const links = new Map();
    for (const row of parseCSV(pdfs)) {
      if (!row.runno || (row.day || '') !== label) continue;
      const phone = window.innerWidth <= 768;
      const link = ((phone ? row.moblink || row.pclink : row.pclink || row.moblink) || '').trim();
      if (link) links.set(String(row.runno), link);
    }
    for (const row of parseCSV(csv)) {
      const night = isNightRunStart(runStartMin(row));
      pickAddRun(byBlock, { row, pm: night ? morningMin : pickPieceMin, links, night }, depot, depotRoutes, nightBlocks);
    }
  }));
  for (const rec of byBlock.values()) { rec.runs.sort((a, b) => a.sortMin - b.sortMin); rec.outs.sort((a, b) => a.min - b.min); rec.ins.sort((a, b) => a.min - b.min); }
  const out = { byBlock, routesByDepot };
  tsPickCache.set(label, out);
  return out;
}

// Show the selected day: swap that day's pick and timetable in for today's
// (kept in tsBackup), or put today's back.
async function applyTsDay() {
  const my = ++tsDaySeq;
  if (!view.tsDay) {
    if (tsBackup) {
      paddle.byBlock = tsBackup.byBlock;
      Object.assign(sched, tsBackup.sched);
      const sameRoute = tsBackup.route === state.route;
      tsBackup = null;
      tripNumCache = { src: null, map: null };
      // The route changed while another day showed: today's timetable for it,
      // built fresh against today's pick.
      if (!sameRoute && state.route) { loadScheduleData(state.route); return; }
    }
    lastHTML = ''; view.scrollNow = true;
    if (state.route) drawView(true);
    return;
  }
  if (!state.route) { lastHTML = ''; return; }
  view.tsDayLoading = true; lastHTML = ''; drawView(false);
  const route = state.route;
  try {
    let data = tsTTCache.get(route);
    if (!data) for (const name of getAliases(route)) {
      try { const res = await fetch(GTFS_BASE + '/' + encodeURIComponent(name) + '.json'); if (res.ok) { data = await res.json(); break; } } catch (e) {}
    }
    if (data) tsTTCache.set(route, data);
    const pick = await loadPickDay(view.tsDay);
    if (my !== tsDaySeq || route !== state.route) return;
    if (!tsBackup) tsBackup = { route, byBlock: paddle.byBlock, sched: { blockTrips: sched.blockTrips, lastNightAll: sched.lastNightAll, todayAll: sched.todayAll, tomorrowAll: sched.tomorrowAll } };
    paddle.byBlock = pick.byBlock;
    const blockTrips = new Map(), order = [];
    for (const t of dayTrips(data || {}, gtfsDayOf(view.tsDay))) {
      const b = String(t.block_id);
      if (!blockTrips.has(b)) { blockTrips.set(b, []); order.push(b); }
      blockTrips.get(b).push({ ...t, route });
    }
    dropStaleCopies(blockTrips, order);
    sched.blockTrips = blockTrips;
    sched.lastNightAll = sched.todayAll = sched.tomorrowAll = null;
    tripNumCache = { src: null, map: null };
  } finally {
    if (my === tsDaySeq) view.tsDayLoading = false;
  }
  lastHTML = ''; view.scrollNow = true;
  drawView(true);
}

// A day button tapped: that day (today's = the live sheet); a search showing
// is run again for the new day.
function selectTsDay(label) {
  view.tsDay = label === todayDayLabel() ? '' : label;
  const box = document.getElementById('busSearch');
  const again = box && box.value;
  applyTsDay().then(() => { if (again) tripSheetSearch(again); });
}
// The day word for Trip Sheets messages: "today" or "on Saturday".
function tsDayWords() { return view.tsDay ? 'on ' + view.tsDay : 'today'; }

function buildAllTripsPage(anim) {
  if (!ALL_TRIPS_PAGE) return buildAllTripsList(anim);
  // A depot without the chosen day (switched depot): back to today.
  if (view.tsDay && paddle.manifest && !tsDays().includes(view.tsDay)) { view.tsDay = ''; setTimeout(applyTsDay, 0); }
  renderTsDayRow();
  if (view.tsDayLoading) return '<div class="at-empty">Loading ' + esc(view.tsDay) + '…</div>';
  return buildAllTripsList(anim);
}

function buildAllTripsList(anim) {
  let items = sched.loaded ? allTripsItems() : [];
  // "Run 558 only": every card that run drives (a relief card counts for both runs).
  const runNo = view.run ? view.run.split('|')[1] : '';
  if (view.run) items = items.filter(it => runsOnBlockDuring(it.blk, it.s, it.e).some(r => runKey(r) === view.run));
  // Trip Sheets search, 4 digits: that block's trips.
  if (view.blk) items = items.filter(it => it.blk === view.blk);
  if (view.atDir && !routeDirs().includes(view.atDir)) view.atDir = '';
  if (view.atDir && ALL_TRIPS_PAGE) items = items.filter(it => it.dir === view.atDir);
  const buses = new Set(items.map(it => it.blk)).size;
  const nTrips = items.length + (items.length === 1 ? ' trip' : ' trips');
  // Trip Sheets search found no such run / block: say so.
  if (view.tsMiss) return '<div class="section-label' + (anim ? ' fade-in' : '') + '">Trip Sheets · Search</div>' +
    '<div class="at-empty">' + view.tsMiss + '</div>';
  let h = '<div class="section-label' + (anim ? ' fade-in' : '') + '">Trip Sheets · ' +
    (ALL_TRIPS_PAGE && view.tsDay ? esc(view.tsDay) + ' · ' : '') +
    (view.atDir ? esc(dirShort(view.atDir)) + ' · ' : '') +
    (view.run ? 'Run ' + esc(runNo) + ' · ' + nTrips
     : view.blk ? 'Block ' + esc(view.blk) + ' · ' + nTrips
     : buses + (buses === 1 ? ' bus' : ' buses')) + '</div>';
  // The run / block also drives other routes: one tap to see those trips.
  const other = (view.run || view.blk) ? tsOtherRoutes() : [];
  if (other.length) h += '<div class="ts-also">Also on ' + other.map(r =>
    '<button type="button" class="ts-route" data-ts-route="' + esc(r) + '">Route ' + esc(r) + '</button>').join(' ') + '</div>';
  if (!sched.loaded) return h + '<div class="at-empty">Loading the timetable…</div>';
  if (!items.length) return h + '<div class="at-empty">No trips ' + (ALL_TRIPS_PAGE ? tsDayWords() : 'today') + (view.run ? ' for Run ' + esc(runNo) + ' on Route ' : view.blk ? ' for Block ' + esc(view.blk) + ' on Route ' : ' on Route ') + esc(state.route) +
    (view.run ? ' <button type="button" class="at-runf on" data-run-filter="">Show all runs</button>' : '') + '</div>';
  return h + '<div class="at-list">' + items.map((it, i) => allTripsCardHtml(it, anim, i)).join('') + '</div>';
}

// The Detours view: every active detour on this route, both directions in one
// list (mirrors the standalone septa-scheduler detours app).
function buildDetoursPage(anim) {
  let h = '<div class="detours-page">';
  h += '<div class="section-label' + (anim ? ' fade-in' : '') + '">⚠ Detours · ' + routeDetours.length + '</div>';
  if (!routeDetours.length) {
    h += '<div class="msg"><div class="icon">✅</div><div class="main">No active detours</div>' +
         '<div class="sub">Route ' + esc(state.route) + ' is running its regular route</div></div>';
  } else {
    h += '<div class="detour-list">';
    routeDetours.forEach(d => { h += detourCardHtml(d); });
    h += '</div>';
  }
  return h + '</div>';
}

function detourCardHtml(d) {
  let h = '<div class="detour-card">';
  h += '<div class="detour-header">';
  h += '<span class="detour-badge">Route ' + esc(d.routeId) + '</span>';
  if (d.direction) h += '<span class="detour-dir">' + esc(d.direction) + '</span>';
  h += '<span class="detour-title">' + esc(d.reason || 'Bus Route Detour') + '</span>';
  h += '</div>';
  h += '<div class="detour-body">';
  if (d.startLocation || d.endLocation) {
    h += '<div class="detour-section"><div class="detour-slabel">Location</div><div class="detour-scontent">';
    if (d.startLocation) h += 'From: ' + esc(d.startLocation) + (d.endLocation ? '<br>' : '');
    if (d.endLocation)   h += 'To: ' + esc(d.endLocation);
    h += '</div></div>';
  }
  if (d.message) {
    h += '<div class="detour-section"><div class="detour-slabel">Details</div><div class="detour-scontent">' + esc(d.message) + '</div></div>';
  }
  if (d.startDate || d.endDate) {
    h += '<div class="detour-section"><div class="detour-slabel">Timeline</div><div class="detour-scontent">';
    if (d.startDate) h += 'Start: ' + esc(d.startDate) + (d.endDate ? '<br>' : '');
    if (d.endDate)   h += 'End: ' + esc(d.endDate);
    h += '</div></div>';
  }
  return h + '</div></div>';
}

// Scheduled departure (trip start) & arrival (trip end) minutes for the trip a
// bus is on / about to run. Scheduled ghosts carry these directly; a live bus
// derives them from its live trip id (fallback: the last trip already started).
function depArrOf(bus) {
  if (bus._scheduledOnly) return { dep: bus._depMin, arr: bus._arrMin, from: bus._firstStop || '', to: bus._lastStop || '' };
  const trips = sched.blockTrips.get(String(bus.BlockID || ''));
  if (!trips || !trips.length) return { dep: null, arr: null, from: '', to: '' };
  const tid = bus.trip != null ? String(bus.trip) : null;
  let t = tid ? trips.find(x => String(x.trip_id) === tid) : null;
  if (!t) {
    const nowMin = serviceNowMin();
    const sorted = trips.map(x => ({ x, s: timeStrToMin(x.start) }))
      .filter(o => o.s != null).sort((a, b) => a.s - b.s);
    for (const o of sorted) if (o.s <= nowMin) t = o.x;
    if (!t && sorted.length) t = sorted[0].x;
  }
  return t ? { dep: timeStrToMin(t.start), arr: timeStrToMin(t.end), from: t.first || '', to: t.last || '' }
           : { dep: null, arr: null, from: '', to: '' };
}

// Two-line Dep/Arr block, kept visible for a bus both while it's waiting
// (layover / scheduled) and while it's serving:
//   [EB] Dep: H:MM  from: <origin>
//        Arr: H:MM  at:   <destination>
// showDir=true puts the direction chip on line 1 and indents line 2 to align
// (live cards); for ghosts the "SCHD EB:" badge already carries direction, so
// showDir=false and both lines sit flush-left. Each line stays single-line —
// the origin/destination text truncates (CSS ellipsis) if it's too long.
function depArrLineHtml(bus, showDir) {
  const da = depArrOf(bus);
  if (da.dep == null && da.arr == null) return '';
  const lead   = showDir ? '<span class="da-dir">' + esc(dirShort(bus.Direction)) + '</span>' : '';
  const spacer = showDir ? '<span class="da-dir-spacer"></span>' : '';
  const depTxt = da.dep != null ? 'Dep: ' + fmtClock(da.dep) : '';
  const arrTxt = da.arr != null ? 'Arr: ' + fmtClock(da.arr) : '';
  const fromLoc = da.from ? '<span class="da-loc">from: ' + esc(da.from) + '</span>' : '';
  const toLoc   = da.to   ? '<span class="da-loc">at: '   + esc(da.to)   + '</span>' : '';
  let h = '<div class="deparr">';
  h += '<div class="da-line">' + lead   + '<span class="da-t">' + depTxt + '</span>' + fromLoc + '</div>';
  h += '<div class="da-line">' + spacer + '<span class="da-t">' + arrTxt + '</span>' + toLoc   + '</div>';
  return h + '</div>';
}

function buildNode(bus, idx, anim) {
  const late = parseInt(bus.late) || 0;
  let lateClass, lateText;
  if (late === 0)         { lateClass = 'ontime'; lateText = 'On Time'; }
  else if (late < 0)      { lateClass = 'early';  lateText = Math.abs(late) + 'm early'; }
  else if (late < LATE_BAD){ lateClass = 'mild';  lateText = '+' + late + 'm late'; }
  else                    { lateClass = 'bad';    lateText = '+' + late + 'm late'; }

  const seat    = seatInfo(bus.estimated_seat_availability);
  const blk     = bus.BlockID || bus.label || '—';
  const vidRaw  = String(bus.VehicleID || bus.label || '').trim();
  const vid     = vidRaw && vidRaw !== '0' ? vidRaw : '';
  const stop    = bus.next_stop_name || '';
  const isLay   = !!bus._isLayover;
  const isSched = !!bus._scheduledOnly;
  const nodeRole = isSched ? 'scheduled' : (isLay ? 'layover' : 'other');
  // Timeline arrow points the way this direction of travel moves through the
  // list: up for west/north, down for east/south.
  const arrowDir = /west|north/i.test(bus.Direction || '') ? 'up' : 'down';
  // Overtake flag colour persists on the bus across renumbering & direction
  // changes. No-data in-service ghosts are shown in their own blue style, so
  // they don't carry an overtake border tint.
  const flagCls = (bus._posFlag && !bus._posGhost) ? ' flag-' + bus._posFlag : '';

  let h = '<div class="bus-node ' + nodeRole + ' ' + arrowDir + flagCls + (anim ? ' fade-in' : '') + '" style="animation-delay:' + (idx * 0.02) + 's">';
  h += '<div class="node-card">';

  h += '<div class="node-row1">';
  h += '<span class="block-num">' + esc(String(blk)) + '</span>';
  // Bus number comes only from the live feed; a scheduled-only block may not
  // have one yet (or its only history is from a previous service day). Show it
  // when known from today, otherwise a muted "pending" placeholder.
  // A bus keeps its logged-in number all day, both directions. Prefer the live
  // VehicleID, but fall back to the number remembered for this block (from an
  // earlier sighting on either direction) — so a momentary feed drop or a
  // just-turned-around bus doesn't blank to "—"/"pending".
  const showVid = vid || knownVehicleFor(String(blk));
  if (showVid) {
    h += '<span class="vehicle-num">' + ICONS.bus + ' ' + esc(showVid) + '</span>';
  } else if (isSched) {
    h += '<span class="vehicle-num unknown">' + ICONS.bus + ' Bus# pending</span>';
  } else {
    h += '<span class="vehicle-num">' + ICONS.bus + ' —</span>';
  }
  // Live status (on time / late / early ±min) now sits on the main line for
  // in-service buses; layover & scheduled cards carry their own status rows.
  if (!isLay && !isSched) {
    if (bus._notTracking) h += '<span class="not-tracking-tag">NOT TRACKING</span>';
    else h += '<span class="late-tag ' + lateClass + '">' + lateText + '</span>';
  }
  // Fixed sequence number, far right. Normal buses: colour-coded by overtake
  // state. No-data in-service ghost: blue number with a red "!" before it.
  if (bus._posNum != null) {
    if (bus._posGhost) {
      h += '<span class="seq-num ghost"><span class="seq-alert">!</span>' + bus._posNum + '</span>';
    } else {
      h += '<span class="seq-num' + (bus._posFlag ? ' flag-' + bus._posFlag : '') + '">' + bus._posNum + '</span>';
    }
  }
  h += '</div>';

  // Scheduled-only placeholder: no live data at all, drawn straight from the
  // GTFS schedule. Show its scheduled status and destination, then stop —
  // the live-data rows below don't apply.
  if (isSched) {
    // Badge shows the block's next DIRECTION (from GTFS), not "at terminal";
    // detail shows the scheduled status; the from/to line shows where it
    // actually is (its pull-out point) and where it's headed — clearer for an
    // operator than a terminal-specific "→ final stop".
    const dirAbbr = dirShort(bus.Direction);
    // "served" = already ran a trip today and is now between trips at the
    // terminal → yellow label + a live layover timer. A block still waiting
    // for its FIRST trip stays blue with no timer.
    const served = bus._schedState === 'layover_expected';
    let badgeCls = 'sched-only-badge';
    if (bus._schedState === 'in_service_expected') badgeCls += ' expected';
    if (served) badgeCls += ' served';
    // Badge row: "SCHD EB:" + any overdue flag + layover timer. The Dep/Arr
    // times and from/at terminals live in the two-line block below (the badge
    // already carries the direction, so no chip there).
    h += '<div class="sched-only-row"><span class="' + badgeCls + '">SCHD ' + esc(dirAbbr) + ':</span>';
    if (bus._overdueMin > 0) h += '<span class="sched-only-detail overdue">OVERDUE ' + bus._overdueMin + 'm</span>';
    if (served && bus._layoverSince) {
      h += '<span class="term-timer" data-layover-since="' + bus._layoverSince + '">' +
           fmtDuration(Date.now() - bus._layoverSince) + '</span>';
    }
    h += '</div>';
    h += depArrLineHtml(bus, false);
    h += passInfoHtml(bus);
    h += paddleRowHtml(blk);
    h += leaderTimelineHtml(bus);
    return h + '</div></div>';
  }

  // Status & crowding no longer live here: status is on the main line above,
  // crowding moved down into the expandable "Leaders" line (see below).

  // Dep/Arr of the trip this bus is serving — kept visible after departure.
  h += depArrLineHtml(bus, true);

  if (isLay) {
    const dur = fmtDuration(Date.now() - (bus._layoverSince || Date.now()));
    h += '<div class="layover-row"><span class="terminal-badge">AT TERMINAL</span>';
    h += '<span>Layover:</span>';
    h += '<span class="layover-timer" data-layover-since="' + (bus._layoverSince || 0) + '">' + dur + '</span>';
    if (bus._dueOutMin != null) {
      if (bus._overdueMin > 0) {
        h += '<span class="due-out overdue">OVERDUE ' + bus._overdueMin + 'm</span>';
      } else {
        h += '<span class="due-out">Due out ' + fmtClock(bus._dueOutMin) + '</span>';
      }
    } else if (bus._doneForDay) {
      h += '<span class="due-out">DONE FOR DAY</span>';
    }
    h += '</div>';
  }

  // My follower has overtaken me (red) — shown on the leader's card.
  if (bus._overtake) {
    h += '<div class="flag-row"><span class="flag-badge flag-follower">FOLLOWER ' +
         esc(bus._overtake.followerBlk) + ' &nbsp;Bus#: ' + esc(bus._overtake.followerBus) +
         ' &nbsp;~' + bus._overtake.overtakeMin + 'm AHEAD</span></div>';
  }
  // I have overtaken my leader (yellow) — shown on the follower's card.
  if (bus._passedLeader) {
    h += '<div class="flag-row"><span class="flag-badge flag-leader">LEADER ' +
         esc(bus._passedLeader.leaderBlk) + ' &nbsp;Bus#: ' + esc(bus._passedLeader.leaderBus) +
         ' &nbsp;~' + bus._passedLeader.overtakeMin + 'm BEHIND</span></div>';
  }

  // Only surface the SCHED LEADER row when something is actually notable — a
  // bus quietly following its scheduled leader in order needs no row. Notable
  // = it passed its leader (out of order), the leader has no live data / isn't
  // in service, or both this bus and its leader are sitting at the terminal.
  if (bus._schedLeaderBlk) {
    const sBlk   = bus._schedLeaderBlk;
    const sState = bus._schedLeaderState; // 'ahead' | 'not_due_yet' | 'done_for_day' | 'missing' | 'no_data' | 'behind'
    const leaderLay    = !!(bus._schedLeaderBus && bus._schedLeaderBus._isLayover);
    const bothTerminal = isLay && leaderLay;
    // 'behind' (you passed your leader) is now shown as the yellow LEADER
    // …BEHIND flag above (with minutes), so it's not a "notable" row here.
    const notable = sState === 'no_data' || sState === 'missing' || bothTerminal;
    if (notable) {
      // Real live vehicle number only — no block-number fallback (that showed a
      // misleading "Bus# <blocknum>" for leaders with no live data).
      const lvRaw = bus._schedLeaderBus ? String(bus._schedLeaderBus.VehicleID || '').trim() : '';
      const sVid  = lvRaw && lvRaw !== '0' ? lvRaw : null;
      h += '<div class="sched-leader-row">';
      h += '<span class="sched-leader-label">Scheduled leader</span>';
      h += '<span class="sched-leader-blk">' + esc(sBlk) + '</span>';
      if (sState === 'no_data' || sState === 'missing') {
        // Special case — no bus in service for the leader. Compact one-liner:
        // "Scheduled leader · <block> · Bus# n/a".
        h += '<span class="sched-leader-bus">Bus# n/a</span>';
      } else if (bothTerminal) {
        h += '<span class="sched-leader-bus">Bus# ' + (sVid ? esc(sVid) : '—') + '</span>';
        h += '<span class="sched-leader-notdue">BOTH AT TERMINAL</span>';
      }
      h += '</div>';
    }
  }

  h += passInfoHtml(bus);

  if (stop && !isLay) {
    h += '<div class="node-bottom"><span class="stop-name">→ ' + esc(stop) + '</span></div>';
  }

  h += paddleRowHtml(blk);
  h += leaderTimelineHtml(bus);
  return h + '</div></div>';
}

// Renders the past/current/next leader timeline for a card. Collapsed behind
// a tappable "Leaders ▾" toggle so it doesn't bloat every card by default.
function leaderTimelineHtml(bus) {
  const tl = bus._leaderTimeline;
  const isLive = !bus._scheduledOnly && !bus._isLayover;
  const hasTL  = !!(tl && (tl.past.length || tl.current || tl.next.length));
  const blk    = bus.BlockID || bus.label || '';

  // Left side of the Leaders line: run-number chips first, then crowding.
  const runChips = runChipsHtml(blk);
  const seat = seatInfo(bus.estimated_seat_availability);
  const seatHtml = (isLive && seat.show)
    ? '<span class="seat-tag ' + seat.c + '">' + ICONS.seat + ' ' + seat.t + '</span>' : '';

  // Nothing to show at all → render nothing.
  if (!hasTL && !seatHtml && !runChips) return '';

  const row = r =>
    '<div class="tl-row">' +
      '<span class="tl-dir">' + esc(r.dir) + '</span>' +
      '<span class="tl-time">' + fmtClock(r.start) + '</span>' +
      '<span class="tl-blk">Blk ' + esc(r.blk) + '</span>' +
      '<span class="tl-bus">Bus ' + esc(r.bus) + '</span>' +
      '<span class="tl-status">' + esc(r.status) + '</span>' +
    '</div>';
  let inner = '';
  if (hasTL) {
    if (tl.past.length)  inner += '<div class="tl-head">Past leaders</div>'    + tl.past.map(row).join('');
    if (tl.current)      inner += '<div class="tl-head">Current leader</div>'  + row(tl.current);
    if (tl.next.length)  inner += '<div class="tl-head">Next leaders</div>'    + tl.next.map(row).join('');
  } else {
    inner = '<div class="tl-head">No leader info</div>';
  }
  // Row: run chips + crowding on the left, "Leaders ▸" control on the right.
  // Only the control toggles the panel (see the delegated click handler).
  const isOpen = openLeaders.has(String(blk));
  return '<div class="leader-tl' + (isOpen ? ' open' : '') + '" data-lead-blk="' + esc(String(blk)) + '">' +
           '<div class="leader-sum">' + runChips + seatHtml +
             '<span class="lead-toggle" data-lead-toggle>Leaders <span class="arrow">▸</span></span>' +
           '</div>' +
           '<div class="leader-body' + (isOpen ? '' : ' hidden') + '">' + inner + '</div>' +
         '</div>';
}

// ── ALERTS / DETOURS ─────────────────────────────────────────
function renderAlerts(alerts) {
  const panel = document.getElementById('alertsPanel');
  const body  = document.getElementById('alertsBody');
  const msgs  = alerts
    .map(a => (a.customer_message || a.advisory_message || '').trim())
    .filter(Boolean);
  if (!msgs.length) { panel.classList.add('hidden'); return; }
  body.innerHTML = msgs.map(m => '<p>' + esc(m) + '</p>').join('');
  panel.classList.remove('hidden');
}

function renderDetours(detours) {
  const panel = document.getElementById('detoursPanel');
  const body  = document.getElementById('detoursBody');
  const msgs  = detours
    .map(d => (d.current_message || d.AdvisoryMessage || d.reason || '').trim())
    .filter(Boolean);
  if (!msgs.length) { panel.classList.add('hidden'); return; }
  body.innerHTML = msgs.map(m => '<p>' + esc(m) + '</p>').join('');
  panel.classList.remove('hidden');
}

function togglePanel(id) {
  document.getElementById(id).classList.toggle('open');
}

// ── TIMERS ───────────────────────────────────────────────────
let refreshTimer = null;
let countdownTimer = null;
let layoverInterval = null;
let refreshSec = 30;

// Refresh button (bottom bar, right of Detours): update buses, detours and
// the block↔bus pairing now, and restart the 30 s countdown from here.
async function refreshNow() {
  if (!state.route || ticking) return;
  refreshing = true; renderBottomBar();
  pairsFetchedAt = 0; // also re-read the all-routes feed
  loadDetours(state.route);
  startTimers();
  await tick();
  refreshing = false; renderBottomBar();
}

function startTimers() {
  clearInterval(refreshTimer);
  clearInterval(countdownTimer);
  refreshSec = 30;
  refreshTimer   = setInterval(tick, REFRESH_MS);
  countdownTimer = setInterval(() => {
    refreshSec = Math.max(0, refreshSec - 1);
    const el = document.getElementById('refreshTag');
    if (el) el.textContent = '↻ ' + refreshSec + 's';
  }, 1000);
}

function manageLayoverTimers() {
  const has = !!document.querySelector('[data-layover-since],[data-due-ms]');
  if (has && !layoverInterval) {
    layoverInterval = setInterval(() => {
      document.querySelectorAll('[data-layover-since]').forEach(el => {
        el.textContent = fmtDuration(Date.now() - parseInt(el.dataset.layoverSince));
      });
      document.querySelectorAll('[data-due-ms]').forEach(el => {
        const ms = parseInt(el.dataset.dueMs);
        el.textContent = dueText(ms);
        el.classList.toggle('late', ms <= Date.now());
      });
    }, 1000);
  } else if (!has && layoverInterval) {
    clearInterval(layoverInterval);
    layoverInterval = null;
  }
}

// ── SWIPE & TAPS ─────────────────────────────────────────────
// A horizontal swipe on the content steps through the views in bottom-bar
// order (dir 1, dir 2, All Trips, Detours). Event delegation on the stable
// #content wrapper, so it survives every re-render.
(function setupSwipe() {
  const content = document.getElementById('content');
  let startX = null, startY = null, dragging = false;

  content.addEventListener('touchstart', e => {
    // The live map's own drags and pinches never switch pages.
    if (e.touches.length > 1 || e.target.closest('.lm-box')) { dragging = false; return; }
    if (!e.target.closest('.view-wrap')) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dragging = true;
  }, { passive: true });

  content.addEventListener('touchend', e => {
    if (!dragging) return;
    dragging = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    // Require a mostly-horizontal swipe so vertical scrolling isn't hijacked.
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) swipeView(dx < 0 ? 1 : -1);
  }, { passive: true });

  content.addEventListener('click', e => {
    // Run N only: that run's trip sheet / back to the list before.
    const rf = e.target.closest('[data-run-filter]');
    if (rf) {
      const key = rf.dataset.runFilter || '';
      const box = document.getElementById('busSearch');
      if (key) {
        if (ALL_TRIPS_PAGE) { box.value = key.split('|')[1]; view.blk = ''; view.tsMiss = ''; }
        view.liveScroll = window.scrollY; view.run = key; view.scrollNow = true; lastHTML = ''; drawView(true); if (!view.scrollNow) return; window.scrollTo(0, 0); return;
      }
      // Back to live / Show all runs: where the list was before.
      if (ALL_TRIPS_PAGE && box.value) { box.value = ''; tripSheetClear(); window.scrollTo(0, view.liveScroll || 0); view.liveScroll = 0; return; }
      view.run = ''; lastHTML = ''; drawView(true); window.scrollTo(0, view.liveScroll || 0); view.liveScroll = 0;
      return;
    }
    // Trip Sheets search: "Also on Route 42" opens that route's trips.
    const tr = e.target.closest('[data-ts-route]');
    if (tr) { tsOpenRoute(tr.dataset.tsRoute); window.scrollTo(0, 0); return; }
    // Leaders expand/collapse — only the right-side "Leaders" control toggles
    // the panel; run chips (also on this line) fall through to open their PDF.
    const toggle = e.target.closest('[data-lead-toggle]');
    if (toggle) {
      const tl  = toggle.closest('.leader-tl');
      const blk = tl && tl.dataset.leadBlk;
      const body = tl && tl.querySelector('.leader-body');
      if (tl && body) {
        const nowOpen = body.classList.toggle('hidden') === false;
        tl.classList.toggle('open', nowOpen);
        if (blk) { if (nowOpen) openLeaders.add(blk); else openLeaders.delete(blk); }
      }
    }
  });

  document.getElementById('bottomBar').addEventListener('click', e => {
    if (e.target.closest('[data-refresh]')) { refreshNow(); return; }
    // All Trips: EB/SB only · Both · WB/NB only.
    const df = e.target.closest('[data-at-dir]');
    if (df) { if (!df.disabled) { view.atDir = df.dataset.atDir || ''; view.scrollNow = true; lastHTML = ''; drawView(true); } return; }
    const b = e.target.closest('[data-view]');
    if (b && !b.disabled) selectView(b.dataset.view, b.dataset.dir || '');
  });
})();

// ── TICK ─────────────────────────────────────────────────────
let ticking = false;

async function tick() {
  if (ticking || !state.route) return;
  ticking = true;
  refreshScrollY = window.scrollY;   // see setContent: a refresh stays put
  setStatus('syncing');
  try {
    const [live] = await Promise.all([fetchTV(state.route), refreshPairs()]);
    if (state.bus) {
      // Following a searched bus: if the all-routes feed just saw it on
      // another route (its block moved on, e.g. 21 → 65), go there.
      const kb = knownBlockFor(state.bus);
      if (kb && Date.now() - kb.ts < 3 * 60000) {
        state.busBlock = kb.block;
        if (state.find && state.find.bus) state.find.bus = { route: kb.route, block: kb.block };
        if (!isSameRoute(kb.route, state.route)) { state.block = ''; ticking = false; loadRoute(kb.route); return; }
      }
    }
    updateCache(live, state.route);
    renderMain(annotateOvertake(annotateLayovers(mergeScheduledBlocks(mergeServerRecovery(mergeLiveAndCache(live, state.route)), live))), state.route);
    state.lastUpdate = new Date();
    refreshSec = 30;
    setStatus('live');
  } catch {
    if (state.lastUpdate) {
      setStatus('stale');
      showBanner('warn', '⚠', 'Network error — last update ' + state.lastUpdate.toLocaleTimeString());
    } else {
      setStatus('error');
      setContent('<div class="msg"><div class="icon">⚠️</div><div class="main">Could not reach SEPTA API</div><div class="sub">Check your connection and try again</div><button class="retry-btn" onclick="loadRoute(state.route)">Retry</button></div>');
    }
  }
  refreshScrollY = null;
  ticking = false;
}

// Route picked from the dropdown: leaves bus-search mode (clears the field).
async function onRouteChange() {
  const route = document.getElementById('routeSelect').value;
  if (!route) return;
  endSearch();
  try { localStorage.setItem('bt_route', route); } catch(e) {}
  return loadRoute(route);
}

// ── TRIP SHEETS SEARCH ───────────────────────────────────────
// On Trip Sheets the box finds a RUN (1-3 digits, in the selected depot) or a
// BLOCK (4 digits) and shows its trip sheet straight away, digit by digit:
// "1" → Run 1, "12" → Run 12, "123" → Run 123, "9157" → Block 9157. If it
// drives another route, that route opens; emptying the box (✕) goes back to
// the list and route from before the search. Live keeps its bus search.
let tsTimer = 0, tsSeq = 0;

// Every pick run (today's day), once each.
function allPickRuns() {
  const seen = new Set(), out = [];
  for (const rec of paddle.byBlock.values()) for (const seg of rec.segs || []) {
    const k = runKey(seg.run);
    if (!seen.has(k)) { seen.add(k); out.push(seg.run); }
  }
  return out;
}
// Routes a run / block drives, in paddle order (pick names, e.g. "21-42" → 21, 42).
function routesOfPieces(pieces) {
  const out = [];
  pieces.slice().sort((a, b) => (a.s ?? 0) - (b.s ?? 0))
    .forEach(p => pickRoutes(p.rt ? [p.rt] : []).forEach(r => { if (!out.some(x => isSameRoute(x, r))) out.push(r); }));
  return out;
}
function tsSubjectRoutes() {
  if (view.run) {
    const run = allPickRuns().find(r => runKey(r) === view.run);
    return run ? routesOfPieces(run.pieces) : [];
  }
  if (view.blk) {
    const rec = paddle.byBlock.get(view.blk);
    return rec ? routesOfPieces(rec.segs || []) : [];
  }
  return [];
}
function tsOtherRoutes() { return tsSubjectRoutes().filter(r => !isSameRoute(r, state.route)); }

// Open `route` (unless it is the one showing) without leaving the search.
function tsOpenRoute(route) {
  if (!route || isSameRoute(route, state.route)) return;
  if (view.tsPrevRoute == null) view.tsPrevRoute = state.route || '';
  const keep = { run: view.run, blk: view.blk };
  const sel = document.getElementById('routeSelect');
  fillRoutes(document.getElementById('depotSelect').value, route);
  if (!sel.value) { sel.insertAdjacentHTML('beforeend', '<option value="' + esc(route) + '">Route ' + esc(route) + '</option>'); sel.value = route; }
  loadRoute(sel.value);          // clears view.run; put the search back
  view.run = keep.run; view.blk = keep.blk; view.scrollNow = true;
  renderTypeRow();
}

async function tripSheetSearch(digits) {
  const my = ++tsSeq;
  if (paddleReady) { try { await paddleReady; } catch (_) {} }
  if (my !== tsSeq) return;      // another digit came in meanwhile
  const depot = document.getElementById('depotSelect').value;
  view.tsMiss = ''; view.run = ''; view.blk = ''; view.scrollNow = true; view.tsSearch = digits;
  if (digits.length === 4) {
    const rec = paddle.byBlock.get(digits);
    const onRoute = sched.loaded && sched.blockTrips && sched.blockTrips.has(digits);
    if (!rec && !onRoute) view.tsMiss = 'No Block ' + esc(digits) + ' ' + tsDayWords();
    else {
      view.blk = digits;
      const routes = rec ? routesOfPieces(rec.segs || []) : [];
      // Not on the showing route's timetable (or the pick puts it elsewhere):
      // open the next route it drives ("21-42" block 9101 → Route 42).
      const hereByPick = !routes.length || routes.some(r => isSameRoute(r, state.route));
      if (!(onRoute || (!sched.loaded && hereByPick))) {
        const next = routes.find(r => !isSameRoute(r, state.route));
        if (next) { tsOpenRoute(next); return; }
      }
    }
  } else {
    const n = Number(digits);
    const runs = allPickRuns().filter(r => Number(r.runno) === n);
    const run = runs.find(r => r.depot === depot) || (!depot ? runs[0] : null);
    if (!run) view.tsMiss = 'No Run ' + esc(digits) + (depot ? ' at ' + esc(depot) : '') + ' ' + tsDayWords();
    else {
      view.run = runKey(run);
      const routes = routesOfPieces(run.pieces);
      // Open a route the run really drives: the pick says "21-42", but the
      // showing route's timetable may not have any of its blocks (run 101,
      // block 9101: Route 42 only) - then the next of its routes.
      const hereByPick = routes.some(r => isSameRoute(r, state.route));
      const hereByTT = !sched.loaded || !sched.blockTrips || run.pieces.some(p => sched.blockTrips.has(String(p.blk)));
      if (routes.length && !(hereByPick && hereByTT)) {
        const next = routes.find(r => !isSameRoute(r, state.route));
        if (next) { tsOpenRoute(next); return; }
      }
    }
  }
  lastHTML = '';
  drawView(true);
  renderTypeRow();
  if (view.tsMiss) window.scrollTo(0, 0);
}

// The box emptied: the full list again, on the route from before the search.
function tripSheetClear() {
  ++tsSeq; clearTimeout(tsTimer);
  const prev = view.tsPrevRoute;
  view.run = ''; view.blk = ''; view.tsMiss = ''; view.tsPrevRoute = null; view.scrollNow = true; view.tsSearch = '';
  renderTypeRow();
  if (prev && !isSameRoute(prev, state.route)) {
    fillRoutes(document.getElementById('depotSelect').value, prev);
    loadRoute(document.getElementById('routeSelect').value || prev);
    return;
  }
  lastHTML = '';
  if (state.route) drawView(true);
}

function endSearch() {
  state.bus = ''; state.busBlock = ''; state.block = ''; state.find = null;
  view.follow = false; view.run = ''; view.blk = ''; view.tsMiss = ''; view.tsPrevRoute = null; view.tsSearch = '';
  document.getElementById('busSearch').value = '';
  renderTypeRow();
  document.querySelector('.input-row').classList.remove('searching');
}

// ── DEPOT / ROUTE DROPDOWNS ──────────────────────────────────
// Depots are the pick's districts; a depot's routes are the ones its runs
// drive today. Both choices are remembered (bt_depot, bt_route). A depot is
// kept by its label ("Frontier"), which stays the same from pick to pick.
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch(e) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
const routeRank = r => { const n = parseInt(r, 10); return isNaN(n) ? [1, r] : [0, n, r]; };
function sortRoutes(list) {
  return list.slice().sort((a, b) => {
    const x = routeRank(a), y = routeRank(b);
    return x[0] - y[0] || (x[0] ? String(x[1]).localeCompare(String(y[1])) : x[1] - y[1] || String(x[2]).localeCompare(String(y[2])));
  });
}
function depotRoutes(depot) { return sortRoutes([...(paddle.routesByDepot.get(depot) || [])]); }

// The depot to show: the saved one; else the one running the saved route;
// else the Paddle App's own depot for its current pick; else the first.
function initialDepot() {
  const saved = lsGet('bt_depot');
  if (paddle.depots.includes(saved)) return saved;
  const route = lsGet('bt_route');
  const withRoute = route && paddle.depots.find(d => depotRoutes(d).some(r => isSameRoute(r, route)));
  if (withRoute) return withRoute;
  const season = lsGet('paddleSeason');
  const slug = (season && lsGet('paddleDepot_' + season)) || lsGet('paddleDepot');
  const fromApp = slug && paddle.depots.find(d => slug.toLowerCase().replace(/[^a-z]/g, '').startsWith(d.toLowerCase().replace(/[^a-z]/g, '').slice(0, 5)));
  return fromApp || paddle.depots[0] || '';
}

function fillRoutes(depot, selected) {
  const sel = document.getElementById('routeSelect');
  const routes = depotRoutes(depot);
  sel.innerHTML = '<option value="">Route</option>' + routes.map(r => '<option value="' + esc(r) + '">Route ' + esc(r) + '</option>').join('');
  const hit = routes.find(r => r === selected) || routes.find(r => isSameRoute(r, selected));
  sel.value = hit || '';
  return sel.value;
}

// Called once the pick is loaded.
function fillDepots() {
  const dsel = document.getElementById('depotSelect');
  const depot = initialDepot();
  dsel.innerHTML = '<option value="">Depot</option>' + paddle.depots.map(d => '<option value="' + esc(d) + '">' + esc(d) + '</option>').join('');
  dsel.value = depot;
  const route = fillRoutes(depot, lsGet('bt_route'));
  if (state.find) { document.getElementById('routeSelect').value = ''; return; } // a search is showing; leave it
  if (view.tsPrevRoute != null) { document.getElementById('routeSelect').value = state.route; return; } // Trip Sheets search moved the route; leave it
  if (route && route !== state.route) { lsSet('bt_route', route); loadRoute(route); }
  // The depot was changed elsewhere (Paddles page) and the route shown from
  // the last visit belongs to another depot: ask for one of this depot's routes.
  else if (!route && state.route && paddle.depots.some(d => d !== depot && depotRoutes(d).some(r => isSameRoute(r, state.route)))) showIdle();
}

// The depot is app-wide (bt_depot, also written by the Paddles page): when
// another open tab changes it, follow along here.
function followSharedDepot() {
  if (!paddle.loaded || state.find) return;
  const want = lsGet('bt_depot');
  const dsel = document.getElementById('depotSelect');
  if (!paddle.depots.includes(want) || dsel.value === want) return;
  dsel.value = want;
  onDepotChange();
}
window.addEventListener('storage', e => { if (e.key === 'bt_depot') followSharedDepot(); });
// Back button / app brought back: the page may come from memory, unreloaded.
window.addEventListener('pageshow', e => { if (e.persisted) followSharedDepot(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') followSharedDepot(); });

function onDepotChange() {
  const depot = document.getElementById('depotSelect').value;
  if (!depot) return;
  lsSet('bt_depot', depot);
  const pid = paddle.depotIds && paddle.depotIds.get(depot);
  if (pid && lsGet('paddleDepot_' + CURRENT_PICK_ID) !== pid) lsSet('paddleDepot_' + CURRENT_PICK_ID, pid);
  // Keep the route when this depot runs it too; else wait for a pick.
  const route = fillRoutes(depot, state.find ? lsGet('bt_route') : state.route || lsGet('bt_route'));
  if (route) { if (state.find || route !== state.route) onRouteChange(); return; }
  endSearch();
  showIdle();
}

function showIdle() {
  state.route = '';
  clearInterval(refreshTimer); clearInterval(countdownTimer);
  document.getElementById('alertArea').innerHTML = '';
  document.getElementById('alertsPanel').classList.add('hidden');
  document.getElementById('detoursPanel').classList.add('hidden');
  setStatus('idle');
  document.getElementById('routeBar').classList.add('hidden');
  renderBottomBar();
  lastHTML = '';
  setContent(IDLE_HTML);
}

// Search cleared: back to the saved depot and route.
function restoreSaved() {
  endSearch();
  const dsel = document.getElementById('depotSelect');
  const depot = paddle.loaded ? (paddle.depots.includes(lsGet('bt_depot')) ? lsGet('bt_depot') : initialDepot()) : '';
  if (depot) dsel.value = depot;
  const route = paddle.loaded ? fillRoutes(depot, lsGet('bt_route')) : lsGet('bt_route');
  if (!paddle.loaded && route) document.getElementById('routeSelect').value = route;
  if (route) loadRoute(route); else showIdle();
}

// Bus or block number entered (both are 4 digits, and many numbers are both,
// so it is tried as each). As a bus: which route/block it is on (any route,
// any district) — SEPTA's live all-routes feed first; for a bus that isn't
// live, its block today from the day's pairing (plus the poller's
// state.json), skipping any block it has since been swapped off; failing
// that, where it was last seen. As a block: the route it is live on, else
// the route it is on now per the timetable — only a block running now (out
// on a trip or between trips) counts; failing that, where it was last seen.
// Sightings older than SEEN_DAYS don't count — 14, as the poller can miss a
// bus or block for days (weekends, short trippers). Resets the dropdown to
// "Select Route" and loads the route showing only those cards: both when they
// share a route, else the bus's, with a button over to the block's.
const SEEN_DAYS = 14;
async function onBusSearch(arg) {
  // From a run search: that run's block, as a block only ({ run, block }).
  const runFind = arg && arg.run ? arg : null;
  const num = runFind ? runFind.block : document.getElementById('busSearch').value.trim();
  if (!num) return;
  // A search covers every depot and route; the dropdowns are set aside
  // (dimmed, route cleared) and come back when the field is cleared.
  document.getElementById('routeSelect').value = '';
  document.querySelector('.input-row').classList.add('searching');
  view.mode = 'dir'; saveMode('dir'); view.follow = true; view.run = ''; // show the found bus, in its own direction
  const f = { num, bus: null, block: null, busSeen: null, blockSeen: null, run: runFind ? runFind.run : '', runOnly: !!runFind, runMatch: !!runFind };
  state.find = f; state.bus = ''; state.busBlock = ''; state.block = '';
  const superseded = () => state.find !== f; // a route was picked (or another number searched) meanwhile
  document.getElementById('alertArea').innerHTML = '';
  setStatus('loading');
  setContent('<div class="msg"><div class="icon" style="animation:pulse 1s infinite">🔍</div><div class="main">Finding ' + esc(num) + '…</div><div class="sub">Bus or block number</div></div>');

  try {
    const live = await fetchAllLive();
    const v = !runFind && live.find(x => x.vehicleId === num);
    if (v) f.bus = { route: v.route, block: v.block };
    const b = live.find(x => x.block === num);
    if (b) f.block = { route: b.route };
  } catch(e) {}
  if (superseded()) return;
  if (!f.bus || !f.block) try {
    if (paddleReady) await paddleReady;
    const st = await fetchWithTimeout(GTFS_OBSERVED_BASE + '/state.json?t=' + Date.now());
    const rows = Object.values(st.blocks || {});
    rows.forEach(r => notePair(r.blockId, r.vehicleId, r.lastSeenAtMs || r.endedAtMs || 0, r.routeId));
    if (!f.bus && !runFind) {
      // Not live: its block today from the pairing (newest sighting, not
      // swapped off since), then the route that block is on now or runs next
      // — a block can change route (9119: route 21 → 65) while it's quiet.
      const kb = knownBlockFor(num);
      if (kb) {
        const routes = [...new Set(rows.filter(r => String(r.blockId) === kb.block).map(r => String(r.routeId)))];
        f.bus = { block: kb.block, route: await routeForBlockNow(kb.block, kb.route, routes) };
      } else {
        // Not out today (or swapped off its block): where it was last seen.
        const seen = newestSighting(num, rows, 'bus');
        if (seen) f.busSeen = lastSeenParts(seen, 'bus');
      }
    }
    if (!f.block) {
      f.block = await blockToday(num, rows);
      // Not running now: its last bus (5108 last stamped Friday, 2012 a week
      // back); with none, what today's pick says about it.
      const seen = !f.block && newestSighting(num, rows, 'block');
      if (seen && blockRanTodayUnseen(num, seen)) f.blockSeen = blockUnrecordedParts(num, seen);
      else if (seen) f.blockSeen = lastSeenParts(seen, 'block');
      else if (!f.block) f.blockPick = blockPickParts(num);
      // Finished / still to go out today: say when (at 2 AM: last night's
      // run back at 1:44 AM, today's out at 3:20 PM).
      if (f.blockSeen) f.blockSeen = withNextOut(num, finishedParts(num).concat(f.blockSeen));
    }
  } catch(e) {
    if (superseded()) return;
    if (!f.bus && !f.block) {
      state.find = null;
      setStatus('error');
      setContent('<div class="msg"><div class="icon">⚠️</div><div class="main">Could not look up ' + esc(num) + '</div><div class="sub">Check your connection and try again</div><button class="retry-btn" onclick="onBusSearch()">Retry</button></div>');
      return;
    }
  }
  if (superseded()) return;

  showFindType(f);
}

// ── SEARCH RESULT TYPES: Run / Block / Bus ──────────────────
// One number can be a run (1-3 digits), or a block and/or a bus (4 digits).
// The buttons above the results (typeRow) show which of them matched; one
// with no match is gray and can't be tapped. The selected one's result shows
// below - Bus first when the number is both a bus and a block.
function findTypes(f) {
  if (f.runOnly) return [{ type: 'run', match: !!f.runMatch }, { type: 'block', match: false }, { type: 'bus', match: false }];
  return [{ type: 'run', match: false },
          { type: 'block', match: !!(f.block || f.blockSeen || f.blockPick) },
          { type: 'bus', match: !!(f.bus || f.busSeen) }];
}
// The selected type's result: its live card on its route, else where it
// was last seen / when it runs next.
function showFindType(f) {
  f.sel = PaTags.pickType(findTypes(f), f.sel);
  renderTypeRow();
  const num = f.num;
  // A run that is out shows its block's card.
  const as = f.runOnly ? 'block' : f.sel;
  state.bus = ''; state.busBlock = ''; state.block = '';
  if (as === 'bus' && f.bus) { state.bus = num; state.busBlock = f.bus.block; return loadRoute(f.bus.route); }
  if (as === 'block' && f.block) { state.block = num; return loadRoute(f.block.route); }
  const blkName = (f.run ? 'Run ' + f.run + ' · ' : '') + 'Block ' + num;
  let h;
  if (as === 'bus' && f.busSeen) h = findSecHtml('bus', 'Bus ' + num + ' is currently offline', f.busSeen);
  else if (as === 'block' && f.blockSeen) h = findSecHtml('block', blkName + ' isn’t in service now', f.blockSeen);
  else if (as === 'block' && f.blockPick) h = findSecHtml('block', blkName + ' isn’t in service now', withNextOut(num, finishedParts(num).concat(f.blockPick)));
  else h = findSecHtml('bus', num + ' not found', 'No bus or block with this number<br>seen in the last ' + SEEN_DAYS + ' days');
  showFindMessage(h);
}
// The type buttons under the search box, for the search on show (none: hidden).
function renderTypeRow() {
  const row = document.getElementById('typeRow');
  if (!row) return;
  let types = null, sel = '';
  if (ALL_TRIPS_PAGE) {
    if (view.tsSearch) {
      types = [{ type: 'run', match: !!view.run }, { type: 'block', match: !!view.blk }];
      sel = view.run ? 'run' : view.blk ? 'block' : '';
    }
  } else if (state.find && state.find.sel !== undefined) {
    types = findTypes(state.find); sel = state.find.sel;
  }
  if (!types) { row.hidden = true; row.innerHTML = ''; return; }
  const html = PaTags.typeBar(types, sel);
  if (row.innerHTML !== html) row.innerHTML = html;
  row.hidden = false;
}

// A searched number's newest sighting within SEEN_DAYS, as a state.json row —
// as a block (`as` 'block') or as a bus ('bus'): the poller's rows plus this
// browser's pairing (live feed seen here).
function newestSighting(num, rows, as) {
  const at = r => r.lastSeenAtMs || r.endedAtMs || 0;
  const key = as === 'block' ? 'blockId' : 'vehicleId';
  const cands = rows.filter(r => String(r[key]) === num);
  for (const [blk, byRoute] of blockPairs)
    for (const [routeId, p] of byRoute)
      if ((as === 'block' ? blk : p.vehicleId) === num)
        cands.push({ blockId: blk, routeId, vehicleId: p.vehicleId, lastSeenAtMs: p.ts });
  return cands.filter(r => at(r) > Date.now() - SEEN_DAYS * 86400000)
    .sort((a, c) => at(c) - at(a))[0] || null;
}

// Did this block go out today (per today's pick) with its newest sighting from
// an earlier day? The poller misses whole days of a block (it runs a few
// times a day, not every 10 min), so that sighting's bus is not today's.
function blockRanTodayUnseen(num, seen) {
  if ((seen.lastSeenAtMs || seen.endedAtMs || 0) >= serviceMidnightMs()) return false;
  const rec = paddle.byBlock.get(num);
  if (!rec || !rec.poTime) return false;
  const po = rec.poMin != null ? rec.poMin : clockToMin(rec.poTime);
  return blockPulledIn(num) || (po != null && serviceNowMin() >= po);
}

// Its lines then: that it ran today, that today's bus wasn't recorded, the
// last bus that was (with when), and today's runs.
function blockUnrecordedParts(num, seen) {
  const rec = paddle.byBlock.get(num);
  const last = lastSeenParts(seen, 'block');
  const parts = ['Ran today' + (rec.poTime ? ': out ' + rec.poTime + (rec.piTime ? ' – in ' + rec.piTime : '') : ''),
    'Today\'s bus wasn\'t recorded',
    { html: esc(last[0].replace('Last seen', 'Last recorded')) + ': ' + last[1].html.replace(/^on /, '') }];
  if (rec.runs.length) parts.push({ runs: rec.runs });
  return parts;
}

// A block in today's pick that no bus has been seen on lately: what the
// pick says about it (routes, pull-out / pull-in, runs). null if not in it.
function blockPickParts(num) {
  const rec = paddle.byBlock.get(num);
  if (!rec) return null;
  const parts = ['No bus seen on it lately'];
  if (rec.routes.length) parts.push('Today: Route ' + rec.routes.join(', '));
  if (rec.poTime || rec.piTime) parts.push('Out ' + (rec.poTime || '?') + ' – in ' + (rec.piTime || '?'));
  if (rec.runs.length) parts.push({ runs: rec.runs });
  return parts;
}

// A searched block number's route, or null unless that block is running now
// (mid-trip, or between trips once out): from today's pick (which routes it
// runs) and the poller's sightings, the route it is on.
// Is the block in the depot right now: its last pull-in that has happened
// came after its last pull-out (last night's Run 144 back on 9153 at 1:44 AM,
// today's not out until 3:20 PM)? Only for a search, after the live feed
// had no bus on it.
function blockInDepotNow(blk) {
  const rec = paddle.byBlock.get(String(blk));
  if (!rec) return false;
  const now = serviceNowMin();
  const lastIn = (rec.ins || []).filter(i => i.min <= now).pop();
  if (!lastIn) return false;
  return !(rec.outs || []).some(o => o.min > lastIn.min && o.min <= now);
}

async function blockToday(num, rows) {
  const rec = paddle.byBlock.get(num);
  if (paddle.loaded && !rec) return null; // not in today's pick
  if (blockPulledIn(num) || blockInDepotNow(num)) return null;
  const at = r => r.lastSeenAtMs || r.endedAtMs || 0;
  const seen = rows.filter(r => String(r.blockId) === num).sort((a, c) => at(c) - at(a));
  const routes = [...new Set([...seen.map(r => String(r.routeId)), ...pickRoutes(rec ? rec.routes : [])])];
  if (!routes.length) return null;
  const hit = await blockRouteNow(num, routes[0], routes);
  return hit.running ? { route: hit.route } : null;
}

// The pick names routes its own way: owl lines by line name and a block
// shared by two routes as "21-42". To this page's route ids; names with no
// match (WR3-4, AFL, …) are dropped.
const PICK_ROUTE_IDS = { 'B1 OWL': 'BSO', 'L1 OWL': 'MFO' };
function pickRoutes(names) {
  const known = r => ROUTES.some(x => isSameRoute(x, r));
  return names.flatMap(n => {
    if (PICK_ROUTE_IDS[n]) return [PICK_ROUTE_IDS[n]];
    if (known(n)) return [n];
    const parts = n.split('-');
    return parts.length > 1 && parts.every(known) ? parts : [];
  });
}

// ["Last seen", "yesterday at 10:42 PM", "on Route 44 Block 9663", "Run 209"]
// from a state.json row — one line each in the not-found message. For a
// searched block (`as` 'block') the third line names the bus instead:
// "on Route 44 Bus 3038". The day word and the run both go by SERVICE day:
// a sighting between midnight and 4 AM belongs to the evening before, so
// 3404 seen at 1:14 AM reads "last night", not "today" (its runs today
// hadn't started yet). Older owl sightings read "Monday night" / "Nov 2
// night". The run is shown only when that service day ran today's pick.
function lastSeenParts(row, as) {
  const ms = row.lastSeenAtMs || row.endedAtMs;
  const owl = inOwlWindow(new Date(ms));
  const day = new Date(ms);
  if (owl) day.setDate(day.getDate() - 1);
  day.setHours(0, 0, 0, 0);
  const ago = Math.round((owlServiceMidnightMs() - day.getTime()) / 86400000);
  const night = owl ? ' night' : '';
  // A recent sighting has no day word at all (user, 2026-11-11): around
  // midnight "today" / "yesterday" / "last night" read wrong - 9663 seen
  // before midnight said "today" at 3 AM. Older ones keep it ("Monday", "Nov 2").
  const when = ago <= 1 ? ''
    : ago < 7 ? day.toLocaleDateString([], { weekday: 'long' }) + night
    : day.toLocaleDateString([], { month: 'short', day: 'numeric' }) + night;
  // No time of day: the poller's last stamp can be hours before the bus
  // actually finished (9663 stamped 8:29 PM, ran until ~11 PM).
  const parts = ['Last seen' + (when ? ' ' + when : ''),
    { html: onTagsHtml(row.routeId, row.blockId, as === 'block' ? row.vehicleId : '') }];
  const rec = paddle.byBlock.get(String(row.blockId));
  if (rec && rec.runs.length && dayTypeOfDate(day) === getDayType()) {
    // The run out at that moment: the last to have pulled out by then. A
    // relief run has no pull-out time, so with one of those, list them all.
    const m = msToServiceMin(ms, day.getTime());
    const out = rec.runs.every(r => r.sortMin !== Infinity) && rec.runs.filter(r => r.sortMin <= m).pop();
    parts.push({ runs: out ? [out] : rec.runs });
  }
  return parts;
}

// Search-result icons: the Paddle App bus for a bus, wooden blocks for a block.
const FIND_ICON = {
  bus:   '<img class="find-icon" src="assets/icon-192.png" alt="" width="56" height="56">',
  block: '<img class="find-icon blocks" src="assets/icon-blocks.png" alt="" width="124" height="40">',
};

// The not-found message's lines: text, or { runs } — each run a button that
// opens its paddle (plain text when the pick has no paddle link for it).
// Every run is the app's run tag ("RUN#: 308 WEEKDAY"); { html } lines carry
// block / bus tags already.
function findPartsHtml(parts) {
  const day = dayLabelOf(getDayType());
  return parts.map(p => typeof p === 'string' ? esc(p) : p.html != null ? p.html
    : '<span class="find-runs">' + p.runs.map(r => PaTags.runTag(r.runno, day, r.link, { big: true })).join('') + '</span>'
  ).join('<br>');
}
// "on [21/9605] [bus 3655]" - where a sighting was, in tags.
function onTagsHtml(route, blk, bus) {
  return 'on <span class="pa-tagrow">' + (blk ? PaTags.blockTag(route, blk) : 'Route ' + esc(route)) + (bus ? PaTags.busTag(bus) : '') + '</span>';
}

async function loadRoute(route) {
  state.route = route;
  if (!state.route) return;

  busCache.clear();
  resetPositionState(); // different route → fresh position numbers & pass flags
  openLeaders.clear();  // don't carry expanded Leaders panels onto a new route
  loadScheduleData(state.route);
  loadDetours(state.route);  // detours page for the new route
  isFirstRender = true;
  lastHTML = '';
  view.dir = '';  // this route's own saved direction (see currentDir)
  view.run = '';
  lastCards = []; lastRouteCards = []; lastEmptyHtml = '';
  sched.dirNames = {}; // the old route's; this route's come with its schedule
  renderBottomBar();

  document.getElementById('alertsPanel').classList.add('hidden');
  document.getElementById('detoursPanel').classList.add('hidden');
  document.getElementById('alertArea').innerHTML = '';
  setStatus('loading');
  setContent('<div class="msg"><div class="icon" style="animation:pulse 1s infinite">🔍</div><div class="main">Loading Route ' + esc(state.route) + '…</div></div>');
  startTimers();

  ticking = true;
  try {
    const [tvRes, alertsRes, detoursRes] = await Promise.allSettled([
      fetchTV(state.route),
      safeGetWithAliases(API.alerts,  state.route),
      safeGetWithAliases(API.detours, state.route),
      refreshPairs(), // so scheduled cards show today's bus from the first render
    ]);

    if (state.route !== route) { ticking = false; return; } // left this route meanwhile
    if (tvRes.status === 'rejected') throw tvRes.reason;

    const live = tvRes.value;
    updateCache(live, state.route);
    renderMain(annotateOvertake(annotateLayovers(mergeScheduledBlocks(mergeServerRecovery(mergeLiveAndCache(live, state.route)), live))), state.route);
    state.lastUpdate = new Date();
    refreshSec = 30;
    setStatus('live');

    if (alertsRes.status  === 'fulfilled') renderAlerts(alertsRes.value);
    if (detoursRes.status === 'fulfilled') renderDetours(detoursRes.value);
  } catch {
    setStatus('error');
    setContent('<div class="msg"><div class="icon">⚠️</div><div class="main">Could not reach SEPTA API</div><div class="sub">Check your connection and try again</div><button class="retry-btn" onclick="loadRoute(state.route)">Retry</button></div>');
  }
  ticking = false;
}

// ── HELPERS ──────────────────────────────────────────────────
function showBanner(type, icon, msg) {
  document.getElementById('alertArea').innerHTML =
    '<div class="alert-banner ' + type + '"><span class="alert-icon">' + icon + '</span>' + esc(msg) + '</div>';
}

function setStatus(s) {
  state.status = s;
  document.getElementById('statusDot').className  = 'live-dot ' + s;
  const t = { idle:'IDLE', loading:'LOADING', syncing:'SYNCING', offline:'OFFLINE', error:'ERROR',
    live:   state.lastUpdate ? 'LIVE · ' + state.lastUpdate.toLocaleTimeString() : 'LIVE',
    stale:  state.lastUpdate ? 'STALE · ' + state.lastUpdate.toLocaleTimeString() : 'STALE',
  };
  document.getElementById('statusText').textContent = t[s] || s.toUpperCase();
}

function fmtDuration(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  if (h > 0) return h + 'h ' + (m % 60) + 'm';
  if (m > 0) return m + 'm ' + (s % 60) + 's';
  return s + 's';
}

function fmtClock(min) {
  min = ((min % 1440) + 1440) % 1440;
  let h = Math.floor(min / 60), m = min % 60;
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
}

function dirShort(d) {
  if (!d) return '—';
  const l = d.toLowerCase();
  if (l.includes('east'))  return 'EB';
  if (l.includes('west'))  return 'WB';
  if (l.includes('north')) return 'NB';
  if (l.includes('south')) return 'SB';
  return d.slice(0, 2).toUpperCase();
}

function seatInfo(v) {
  return ({
    MANY_SEATS_AVAILABLE:       { t:'Many Seats',   c:'many',     show:true  },
    FEW_SEATS_AVAILABLE:        { t:'Few Seats',    c:'few',      show:true  },
    STANDING_ROOM_ONLY:         { t:'Standing',     c:'standing', show:true  },
    CRUSHED_STANDING_ROOM_ONLY: { t:'Very Crowded', c:'full',     show:true  },
    FULL:                       { t:'Full',         c:'full',     show:true  },
  })[v] || { t:'—', c:'na', show:false };
}
 
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const ICONS = {
  // The app's own bus (the picture next to the menu button), everywhere.
  bus:  '<img class="bus-ico" src="assets/icon-192.png" alt="" width="14" height="14">',
  seat: '<svg viewBox="0 0 24 24"><path d="M4 18v3h3v-3h10v3h3v-3h1v-1c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v1h1zm15-8h-2V7c0-1.1-.9-2-2-2H9c-1.1 0-2 .9-2 2v3H5c-1.1 0-2 .9-2 2v1h18v-1c0-1.1-.9-2-2-2zM9 7h6v3H9V7z"/></svg>',
};

// ── INIT ─────────────────────────────────────────────────────
const IDLE_HTML = document.getElementById('content').innerHTML;

(function init() {
  const routeSel = document.getElementById('routeSelect');

  // Until the pick loads (it fills both dropdowns, see fillDepots), show
  // the saved route alone so it can load straight away.
  const sr = lsGet('bt_route');
  if (sr) {
    routeSel.insertAdjacentHTML('beforeend', '<option value="' + esc(sr) + '">Route ' + esc(sr) + '</option>');
    routeSel.value = sr;
  }
  const sd = lsGet('bt_depot');
  if (sd) {
    const dsel = document.getElementById('depotSelect');
    dsel.insertAdjacentHTML('beforeend', '<option value="' + esc(sd) + '">' + esc(sd) + '</option>');
    dsel.value = sd;
  }

  if (ALL_TRIPS_PAGE) {
    // Day buttons under the search field.
    const row = document.getElementById('tsDayRow');
    row.addEventListener('click', e => {
      const dd = e.target.closest('[data-ts-day]');
      if (dd) { selectTsDay(dd.dataset.tsDay); window.scrollTo(0, 0); }
    });
    renderTsDayRow();
    const box = document.getElementById('busSearch');
    box.placeholder = 'Run / Block #';
    box.setAttribute('aria-label', 'Find a run (up to 3 digits) or a block (4 digits)');
  } else {
    const box = document.getElementById('busSearch');
    box.placeholder = 'Run / Block / Bus #';
    box.setAttribute('aria-label', 'Find a bus or block (4 digits) or a run (up to 3 digits)');
  }

  // Result type buttons: show that type's result (Live; on Trip Sheets a
  // number is only ever a run or a block, so there is nothing to switch).
  document.getElementById('typeRow').addEventListener('click', e => {
    const b = e.target.closest('[data-pa-type]');
    const f = state.find;
    if (!b || b.disabled || ALL_TRIPS_PAGE || !f || f.runOnly || f.sel === b.dataset.paType) return;
    f.sel = b.dataset.paType;
    showFindType(f);
  });

  state.route = routeSel.value;
  loadPairs(); // today's block↔bus pairs seen earlier in this browser

  routeSel.addEventListener('change', onRouteChange);
  document.getElementById('depotSelect').addEventListener('change', onDepotChange);
  // The search box - same rule as the Paddles page. Type freely; the number
  // is final after 800 ms with no new digit, the keyboard's check mark /
  // search key, tapping elsewhere, or a 4th digit. Then it is searched
  // EXACTLY and the keyboard closes:
  //   Live:        1-3 digits = that run; 4 = that bus or block.
  //   Trip Sheets: 1-3 digits = that run; 4 = that block.
  // ("3" at Midvale = Run 3, not something starting with 3.) Trip Sheets also
  // closes at once when the run typed exists and no other run or block starts
  // with it. Box emptied (✕ or backspace) after a search → back to normal.
  const box = document.getElementById('busSearch');
  let boxTimer = 0, boxDone = '';   // boxDone: the number already searched
  const boxDigits = () => box.value.replace(/\D/g, '').slice(0, 4);
  function settleBox() {
    clearTimeout(boxTimer); boxTimer = 0;
    const digits = boxDigits();
    if (!digits || digits === boxDone) { if (document.activeElement === box) box.blur(); return; }
    boxDone = digits;                                 // before blur: blur calls settleBox again
    if (document.activeElement === box) box.blur();   // closes the phone keyboard
    if (ALL_TRIPS_PAGE) { clearTimeout(tsTimer); tripSheetSearch(digits); return; }
    clearTimeout(runTimer);
    if (digits.length === 4) onBusSearch(); else onRunSearch(digits);
  }
  // Trip Sheets: run q exists here and nothing longer can follow it.
  function tsOnlyRun(q) {
    if (q.length > 3) return false;
    const depot = document.getElementById('depotSelect').value;
    let run = false;
    for (const r of allPickRuns()) {
      if (depot && r.depot !== depot) continue;
      const n = String(Number(r.runno));
      if (n === q) run = true; else if (n.startsWith(q)) return false;
    }
    for (const b of paddle.byBlock.keys()) if (String(b).startsWith(q)) return false;
    return run;
  }
  document.getElementById('busForm').addEventListener('submit', e => {
    e.preventDefault();
    settleBox();
  });
  box.addEventListener('blur', settleBox);
  box.addEventListener('input', () => {
    const digits = boxDigits();
    if (digits !== box.value) box.value = digits;
    clearTimeout(boxTimer); boxTimer = 0;
    boxDone = '';
    if (!digits) {
      if (ALL_TRIPS_PAGE) { tripSheetClear(); return; }
      clearTimeout(runTimer);
      if (state.find) restoreSaved();
      return;
    }
    if (digits.length === 4 || (ALL_TRIPS_PAGE && paddle.loaded && tsOnlyRun(digits))) { settleBox(); return; }
    boxTimer = setTimeout(settleBox, 800);
  });

  window.addEventListener('online',  () => { if (state.route) loadRoute(state.route); });
  window.addEventListener('offline', () => setStatus('offline'));

  // Load holiday overrides first so getDayType() is correct before any
  // schedule/paddle fetch reads it.
  // 11 PM and 4 AM change which runs are tonight's / today's (the night-liner
  // rule, see isNightRunStart): a page left open rebuilds the pick and the
  // timetable then.
  setInterval(() => {
    if (view.tsDay || !paddle.loaded || paddle.loading || paddle.loadKey === paddleLoadKey()) return;
    paddle.loaded = false;
    paddleReady = loadPaddleData().then(() => { if (state.route) loadScheduleData(state.route); });
  }, 60000);

  paddleReady = loadCalendarOverrides().then(() => {
    const p = loadPaddleData();
    if (state.route) onRouteChange();
    return p;
  });
})();
</script>
