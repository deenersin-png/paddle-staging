    .filter(x => x.s != null && x.e != null)
    .sort((a, b) => a.s - b.s);
  if (!trips.length) return null;
  const first = trips[0], last = trips[trips.length - 1];
  if (nowMin < first.s) return { state: 'not_started', dueOutMin: first.s, trip: first };
  if (nowMin > last.e)  return { state: 'done', trip: last };
  for (let i = 0; i < trips.length; i++) {
    if (nowMin >= trips[i].s && nowMin <= trips[i].e) return { state: 'in_service_expected', trip: trips[i] };
    if (i < trips.length - 1 && nowMin > trips[i].e && nowMin < trips[i + 1].s)
      // Last night's run done, today's not out yet (3:26 AM, route 40 block
      // 9327: in after 2 AM, out at 2:44 PM) - in the depot, not on layover.
      // Same between today's run and tonight's night liner.
      return trips[i].part !== trips[i + 1].part
        ? { state: 'not_started', dueOutMin: trips[i + 1].s, trip: trips[i + 1] }
        : { state: 'layover_expected', dueOutMin: trips[i + 1].s, trip: trips[i + 1] };
  }
  return { state: 'done', trip: last };
}

// True once this block's operator pull-in (from the pick/paddle data) has
// passed — i.e. it's finished for the day. SEPTA's GTFS can carry PHANTOM late
// / owl trips for a block that actually pulled in hours earlier (seen live:
// route 44 block 9655 pulls in 10:27 AM per the pick, yet GTFS gave it a
// 10:18 PM trip, so a finished run kept showing at 10 PM — while genuine late
// blocks like 9664 have a matching 12:18 AM pull-in). The operator pick is the
// truth, so a passed pull-in overrides a phantom GTFS trip. Pull-in is a
// wall-clock AM/PM time; an early-AM one is an owl pull-in, so shift it into
// 24:00+ notation to compare against serviceNowMin.
// Service-day minute of a pick pull-in time. An early-AM pull-in is an owl
// pull-in at the end of this service day, so shift it into 24:00+ notation.
function pullInKey(t) {
  let m = clockToMin(t);
  if (m == null || !isFinite(m)) return null;
  if (m < SERVICE_DAY_START_HR * 60) m += 1440;
  return m;
}

// This block's final pull-in (service-day minutes), or null if the pick has none.
// From 11 PM a night liner's block (out after midnight, e.g. 12:05 AM, in
// during the morning) is tonight's run, already counted 24 h on by
// loadPaddleData (rec.piMin), like its trips (serviceDayTrips).
function blockPullInMin(blk) {
  const rec = paddle.byBlock.get(String(blk));
  if (!rec || !rec.piTime) return null;
  return rec.piMin != null ? rec.piMin : pullInKey(rec.piTime);
}

function blockPulledIn(blk) {
  const pi = blockPullInMin(blk);
  return pi != null && pi <= serviceNowMin();
}

// A GTFS trip is phantom if it starts at or after its block's pick pull-in:
// the bus is already back at the depot, so that trip never actually runs.
// Leader/follower selection must skip these — otherwise a finished block (e.g.
// route 44 block 9120, pull-in 11:05 AM, phantom 9:18 PM trip) shows up as
// another bus's scheduled leader. Earlier trips of the same block are real and
// still count, so it can be a legitimate past leader from the morning.
function isPhantomTrip(blk, startMin) {
  if (startMin == null) return false;
  const pi = blockPullInMin(blk);
  return pi != null && startMin >= pi;
}

// Inject a placeholder card for every scheduled block on this route that has
// no live/layover/recovery representation yet — so the operator sees at
// least "Block #### is scheduled" (plus bus number if we've ever seen it)
// even with no SEPTA live data. Blocks already covered by real data are
// skipped, so the moment a bus goes live its real card replaces this one.
function mergeScheduledBlocks(merged, liveBuses) {
  const nowMin = serviceNowMin();
  const known = new Set(merged.map(b => String(b.BlockID || '')));
  const dirMap = buildGtfsDirMap(liveBuses);

  for (const blk of sched.blockTrips.keys()) {
    if (known.has(blk)) continue;
    if (blockPulledIn(blk)) continue; // operator pick says it's already pulled in → done
    let st = scheduledBlockStatus(blk, nowMin);
    if (!st || st.state === 'done') continue;
    // Between two trips but the pick has it back in the depot (one run pulled
    // in, the next not out yet - block 1221 at 1 AM): not out yet, not layover.
    if (st.state === 'layover_expected' && blockInDepotNow(blk)) st = { ...st, state: 'not_started' };
    if (st.state === 'not_started' && (st.dueOutMin - nowMin) > SCHED_LOOKAHEAD_MIN) continue;

    // Terminal-arrival time for the layover timer: the poller's real ended-at
    // if it's RECENT, else the scheduled end of the last completed trip. The
    // recency gate is essential — a weekly block's state.json entry can be days
    // old (last week's run), which without this showed a bogus "137h at
    // terminal". Stale → fall back to today's schedule.
    let arrivedMs = null;
    if (st.state === 'layover_expected') {
      const rb = sched.recoveryBlocks.get(blk);
      if (rb && rb.endedAtMs && (Date.now() - rb.endedAtMs) <= LAYOVER_TIMEOUT_MS) arrivedMs = rb.endedAtMs;
      if (!arrivedMs) {
        const ends = (sched.blockTrips.get(blk) || []).map(t => timeStrToMin(t.end)).filter(x => x != null).sort((a, b) => a - b);
        let lastEnd = null; ends.forEach(e => { if (e <= nowMin) lastEnd = e; });
        if (lastEnd != null) arrivedMs = serviceMinToMs(lastEnd);
      }
    }

    // Direction name straight from GTFS (directions.txt) first — always
    // available, so scheduled blocks get a real "Eastbound"/"Westbound" even
    // when no live bus is out that way. Fall back to the live-learned map,
    // then a last-resort label.
    const dirStr = (sched.dirNames && sched.dirNames[st.trip.dir]) ||
                   dirMap.get(st.trip.dir) ||
                   (st.trip.dir != null ? 'Direction ' + st.trip.dir : 'Scheduled');
    merged.push({
      BlockID: blk,
      VehicleID: knownVehicleFor(blk),
      Direction: canonDir(dirStr),
      next_stop_sequence: 0,
      destination: st.trip.headsign || '',
      Offset: '0', late: '0',
      next_stop_name: null, estimated_seat_availability: '',
      _scheduledOnly: true,
      _schedState: st.state,
      _dueOutMin: st.dueOutMin != null ? st.dueOutMin : null,
      _overdueMin: st.dueOutMin != null ? Math.max(0, nowMin - st.dueOutMin) : 0,
      _firstStop: st.trip.first || '',
      _lastStop: st.trip.last || '',
      // Scheduled departure/arrival of the relevant trip, shown as "Dep/Arr".
      _depMin: st.trip.s,
      _arrMin: st.trip.e,
      // Scheduled start of the trip this block should be running now — lets a
      // no-data in_service_expected ghost be numbered at its real scheduled
      // slot (see startOf/annotatePositions).
      _curTripStartMin: st.state === 'in_service_expected' ? st.trip.s : null,
      // When this block already ran and is between trips, its terminal-arrival
      // time drives the layover timer on the yellow card.
      _layoverSince: arrivedMs,
    });
  }
  return merged;
}

// A bus that finished a trip and went out of service (layover ghost / server
// recovery) is really "about to run its NEXT trip". So reposition it onto the
// direction of that next trip and render it as a scheduled/next-trip card —
// it disappears from the direction it just finished and shows on the one it's
// about to run, starting from that terminal. Blocks with no next trip today
// are dropped (done for the day). Live buses pass through untouched.
function annotateLayovers(merged) {
  const nowMin = serviceNowMin();
  const out = [];
  for (const bus of merged) {
    if (!bus._isLayover) { out.push(bus); continue; }
    const blk = String(bus.BlockID || '');

    // A bus that dropped off the live feed isn't necessarily parked — check the
    // schedule. If its CURRENT trip should still be running right now, it lost
    // signal MID-TRIP: keep it as an "in service, no data" ghost so it stays
    // numbered and woven into the running sequence at its real position (its
    // live-seen bus number is preserved), instead of being demoted to an
    // unnumbered next-departure terminal card.
    const st = scheduledBlockStatus(blk, nowMin);
    if (st && st.state === 'in_service_expected') {
      bus._isLayover       = false;
      bus._scheduledOnly   = true;
      bus._schedState      = 'in_service_expected';
      bus._dueOutMin       = null;
      bus._overdueMin      = 0;
      bus._firstStop       = st.trip.first || '';
      bus._lastStop        = st.trip.last  || '';
      bus._depMin          = st.trip.s;
      bus._arrMin          = st.trip.e;
      bus._curTripStartMin = st.trip.s;   // its scheduled slot, for numbering
      bus.next_stop_sequence = 0;
      const dName = (sched.dirNames && sched.dirNames[st.trip.dir]) ||
                    (st.trip.dir != null ? 'Direction ' + st.trip.dir : bus.Direction);
      bus.Direction = canonDir(dName);
      out.push(bus);
      continue;
    }

    // Back in the depot, not on layover: its run pulled in (the pick says so)
    // or the next trip belongs to another run of the block (scheduledBlockStatus
    // 'not_started'). Block 9413 at 12:42 AM: last night's Run 708 in at
    // 12:18 AM, today's Route 38 trips from 5:33 PM - it showed LAYOVER with a
    // 16-hour countdown. Shown like any block not out yet (only once it is
    // due within SCHED_LOOKAHEAD_MIN), else not at all.
    if ((st && st.state === 'not_started') || blockInDepotNow(blk)) {
      if (!st || st.state !== 'not_started' || st.dueOutMin - nowMin > SCHED_LOOKAHEAD_MIN) continue;
      bus._isLayover     = false;
      bus._scheduledOnly = true;
      bus._schedState    = 'not_started';
      bus._dueOutMin     = st.dueOutMin;
      bus._overdueMin    = 0;
      bus._firstStop     = st.trip.first || '';
      bus._lastStop      = st.trip.last  || '';
      bus._depMin        = st.trip.s;
      bus._arrMin        = st.trip.e;
      bus._layoverSince  = null;
      bus.next_stop_sequence = 0;
      const nName = (sched.dirNames && sched.dirNames[st.trip.dir]) ||
                    (st.trip.dir != null ? 'Direction ' + st.trip.dir : bus.Direction);
      bus.Direction = canonDir(nName);
      out.push(bus);
      continue;
    }

    // Otherwise it's genuinely between trips → next-departure terminal card.
    const due = getNextDeparture(blk, nowMin);
    if (!due) continue; // finished for the day → remove entirely

    bus._isLayover     = false;
    bus._scheduledOnly = true;
    bus._schedState    = 'layover_expected';
    bus._dueOutMin     = due.dueOutMin;
    bus._overdueMin    = Math.max(0, nowMin - due.dueOutMin);
    bus._firstStop     = due.first || '';
    bus._lastStop      = due.last  || '';
    bus._depMin        = due.scheduledMin != null ? due.scheduledMin : due.dueOutMin;
    bus._arrMin        = due.arrMin;
    bus.next_stop_sequence = 0; // it's at the START of its next trip — anchor it there in the ordering
    const dirName = (sched.dirNames && sched.dirNames[due.direction]) ||
                    (due.direction != null ? 'Direction ' + due.direction : bus.Direction);
    bus.Direction = canonDir(dirName);
    out.push(bus);
  }
  return out;
}

// The scheduled start time relevant to this bus's current state: its next
// due-out trip if it's parked at a terminal, or the trip presently underway
// if it's active. This is what lets two different blocks' "lateness" be
// compared against a real, current scheduled gap instead of a fixed number.
function relevantTripStart(bus, block, nowMin) {
  if (bus._isLayover) {
    const due = getNextDeparture(block, nowMin);
    return due ? due.dueOutMin : null;
  }
  const trips = sched.blockTrips.get(String(block));
  if (!trips || !trips.length) return null;

  // Prefer the bus's own live-reported trip id (TransitView's `trip` field,
  // matches GTFS trip_id exactly) — an exact match, no guessing. Guessing
  // "which trip is this by wall-clock time" is exactly what broke: a bus
  // running badly early/late (the whole point of this feature) can have
  // already-passed a later trip's scheduled start time while it's actually
  // still running an earlier one, especially if it and its
  // leader/follower have run different numbers of trips so far today.
  const tripId = bus.trip != null ? String(bus.trip) : null;
  if (tripId) {
    const exact = trips.find(t => String(t.trip_id) === tripId);
    if (exact) {
      const s = timeStrToMin(exact.start);
      if (s != null) return s;
    }
  }

  // Fallback (no trip id on the live bus, or it's not in today's GTFS):
  // last trip whose scheduled start has passed.
  const starts = trips.map(t => timeStrToMin(t.start)).filter(s => s != null).sort((a, b) => a - b);
  if (!starts.length) return null;
  let idx = -1;
  starts.forEach((s, i) => { if (s <= nowMin) idx = i; });
  return idx >= 0 ? starts[idx] : starts[0];
}

// Precise leader/follower overtake: how many minutes has the scheduled
// follower gained on this block, using each side's own live lateness
// (SEPTA's `late` field) against the scheduled gap between the trip each of
// them is currently running.
//   overtake = leaderLateMin - scheduledHeadwayMin - followerLateMin
//
// Only computed when BOTH are currently active (actually out on the road).
// If the leader is parked at a terminal, "the trip it's currently on" isn't
// a thing yet — relevantTripStart() would have to use its *next* (future)
// trip, while an active follower's relevantTripStart is whatever trip it's
// *already* running now. Those are two different points in time, and
// subtracting them can be off by a whole trip cycle (seen live: showed a
// leader "50-60m behind" a follower that had simply pulled out normally).
// For a parked leader, `_flag` (below, from departedAt) already answers the
// only question that's actually answerable — did the follower leave yet —
// without needing any of this time-math.
function annotateOvertake(merged) {
  const nowMin = serviceNowMin();
  const byBlock = new Map();
  for (const b of merged) { byBlock.set(String(b.BlockID || ''), b); b._overtake = null; b._passedLeader = null; }

  for (const bus of merged) {
    if (bus._isLayover || bus._scheduledOnly) continue;
    const blk = String(bus.BlockID || '');
    const followerBlk = getCurrentSchedFollower(blk, nowMin);
    if (!followerBlk) continue;
    const followerBus = byBlock.get(followerBlk);
    if (!followerBus || followerBus._isLayover || followerBus._scheduledOnly) continue;
    // A block alternates direction every trip all day — "adjacent in
    // pull-out order" doesn't mean they're currently going the same way.
    // Comparing "who's ahead" between two buses headed opposite directions
    // is meaningless (seen live: produced a negative "headway" and a bogus
    // overtake number for two buses running Eastbound vs. Westbound).
    if (bus.Direction !== followerBus.Direction) continue;

    const leaderStart   = relevantTripStart(bus, blk, nowMin);
    const followerStart = relevantTripStart(followerBus, followerBlk, nowMin);
    if (leaderStart == null || followerStart == null) continue;

    const headwayMin = followerStart - leaderStart;
    // The leader/follower pairing is fixed once from each block's very
    // first pull-out of the day — over a long service day, two blocks'
    // relative timing can drift and even invert. If the follower's current
    // trip doesn't actually start after the leader's, "the follower should
    // be behind" isn't true right now, and there's nothing meaningful to
    // compare (seen live: a -38m "headway" from two trips that had crossed
    // over by evening, producing a bogus ~28m overtake).
    if (headwayMin <= 0) continue;

    const leaderLate   = parseInt(bus.late) || 0;
    const followerLate = parseInt(followerBus.late) || 0;
    const overtakeMin  = leaderLate - headwayMin - followerLate;

    if (overtakeMin > 0) {
      const fVid = String(followerBus.VehicleID || '').trim();
      const lVid = String(bus.VehicleID || '').trim();
      const fBus = (fVid && fVid !== '0') ? fVid : (knownVehicleFor(followerBlk) || 'n/a');
      const lBus = (lVid && lVid !== '0') ? lVid : (knownVehicleFor(blk) || 'n/a');
      // On the leader's card: its follower is X min ahead (red).
      bus._overtake = { followerBlk, followerBus: fBus, overtakeMin, headwayMin };
      // Mirror on the follower's card: its leader is X min behind (yellow) —
      // same event, opposite perspective.
      followerBus._passedLeader = { leaderBlk: blk, leaderBus: lBus, overtakeMin };
    }
  }
  return merged;
}

// ── API ──────────────────────────────────────────────────────
async function fetchWithTimeout(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function parseTVData(raw) {
  const buses = [];
  if (Array.isArray(raw)) {
    for (const item of raw) {
      if (!item || typeof item !== 'object') continue;
      if (item.lat || item.BlockID || item.label) { buses.push(item); continue; }
      for (const v of Object.values(item)) {
        if (Array.isArray(v)) v.forEach(b => b && typeof b === 'object' && buses.push(b));
      }
    }
  } else if (raw && typeof raw === 'object') {
    for (const v of Object.values(raw)) {
      if (Array.isArray(v)) v.forEach(b => b && typeof b === 'object' && buses.push(b));
    }
  }
  return buses.map(b => {
    const offNum = parseFloat(String(b.Offset || ''));
    if (!isNaN(offNum) && Math.abs(offNum) >= 500) b._notTracking = true;
    return b;
  }).filter(b => {
    const ts  = parseInt(b.timestamp) || 0;
    const off = String(b.Offset || '');
    if (b._notTracking && !parseInt(b.next_stop_sequence)) return false;
    return ts > 1000000 || (off && off !== '999');
  });
}

// TransitView requires JSONP — SEPTA does not send CORS headers for this endpoint
const TV_ENDPOINTS = [
  r => `https://www3.septa.org/api/TransitView/index.php?route=${encodeURIComponent(r)}&callback=`,
  r => `https://www3.septa.org/hackathon/TransitView/?route=${encodeURIComponent(r)}&callback=`,
  r => `https://www3.septa.org/beta/TransitView/?route=${encodeURIComponent(r)}&callback=`,
];

function fetchTVOnce(route) {
  return new Promise((resolve, reject) => {
    tryJSONP(route, TV_ENDPOINTS, 0, resolve, reject);
  });
}

async function fetchTV(route) {
  const aliases = getAliases(route);
  let lastErr = null;
  for (const name of aliases) {
    try {
      const buses = await fetchTVOnce(name);
      if (buses && buses.length > 0) return buses;
    } catch (e) { lastErr = e; }
  }
  if (lastErr) throw lastErr;
  return [];
}

function tryJSONP(route, endpoints, idx, resolve, reject, parse = parseTVData) {
  if (idx >= endpoints.length) { reject(new Error('All endpoints failed')); return; }

  const cb   = 'septa_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  const el   = document.createElement('script');
  let done   = false;

  function cleanup() {
    if (done) return; done = true;
    try { delete window[cb]; } catch(e) {}
    if (el.parentNode) el.parentNode.removeChild(el);
  }

  const timer = setTimeout(() => {
    if (!done) { cleanup(); tryJSONP(route, endpoints, idx + 1, resolve, reject, parse); }
  }, FETCH_TIMEOUT_MS);

  window[cb] = function(data) {
    clearTimeout(timer);
    if (done) return;
    cleanup();
    resolve(parse(data));
  };

  el.src = endpoints[idx](route) + cb;
  el.onerror = function() {
    clearTimeout(timer);
    if (!done) { cleanup(); tryJSONP(route, endpoints, idx + 1, resolve, reject, parse); }
  };
  document.head.appendChild(el);
}

async function safeGet(url) {
  try { const d = await fetchWithTimeout(url); return Array.isArray(d) ? d : []; }
  catch { return []; }
}

async function safeGetWithAliases(urlBuilder, route) {
  for (const name of getAliases(route)) {
    const data = await safeGet(urlBuilder(name));
    if (data.length > 0) return data;
  }
  return [];
}

// ── SCHED LEADER (every bus gets its own, no search box needed) ──
// Attaches each bus's own scheduled-leader block/bus/state directly onto
// the bus object, the same way annotateOvertake()/annotateLayovers() do —
// so every card in the list shows its own status, not just one you'd have
// had to type a block number in to see.
// The last-stop name of the trip a live bus is currently running (by its live
// GTFS trip id). Two buses' raw stop-sequence numbers are only comparable
// when they're on the same trip variation (same endpoint).
function liveTripLast(bus) {
  const trips = sched.blockTrips.get(String(bus.BlockID || ''));
  if (!trips || bus.trip == null) return null;
  const t = trips.find(x => String(x.trip_id) === String(bus.trip));
  return t ? (t.last || null) : null;
}

// ── DYNAMIC POSITION TRACKER ─────────────────────────────────
// Numbers each in-service bus by its current sequence within its direction
// (position 1 = leader / furthest along). When two buses swap order mid-route
// (an overtake), the passer is flagged yellow and the passed one red. Those
// flags PERSIST on each bus — through renumbering AND through a change of
// direction (a passer that reaches the terminal, flips to the opposite
// direction and keeps running stays yellow; its passed leader stays red).
// Each flagged bus also carries a one-line status of where its pass-partner
// is right now (direction + live position).
const posPrevSeq = new Map();   // direction -> Map(blockId -> last next_stop_sequence)
const posFlag    = new Map();   // blockId -> { flag:'yellow'|'red', role, partner }
const posFixed   = new Map();   // direction -> Map(blockId -> FIXED position number, never changes)
const openLeaders = new Set();  // block ids whose Leaders panel is expanded (persists across re-renders)

function resetPositionState() { posPrevSeq.clear(); posFlag.clear(); posFixed.clear(); }

function annotatePositions(merged) {
  const byBlock = new Map();
  for (const b of merged) {
    b._posNum = null; b._posFlag = null; b._passInfo = null;
    byBlock.set(String(b.BlockID || ''), b);
  }

  // Group the buses to be NUMBERED by direction: live in-service buses PLUS
  // "should be in service" no-data ghosts (in_service_expected — no bus number
  // / location, driver likely not logged in, but the schedule says it's
  // mid-service). Ghosts hold a numbered slot as if running (marked _numGhost
  // → blue "!" rendering). Layover / not-started / done blocks aren't numbered.
  const nowMin = serviceNowMin();
  const byDir = {};
  for (const b of merged) {
    const isGhost = b._scheduledOnly && b._schedState === 'in_service_expected';
    const isLive  = !b._scheduledOnly && !b._isLayover;
    if (!isLive && !isGhost) continue;
    b._numGhost = isGhost;
    (byDir[b.Direction] = byDir[b.Direction] || []).push(b);
  }

  // Scheduled start time of a bus's CURRENT trip — the basis for its fixed
  // number (earlier start = further along = leader = lower number). This is
  // what RESERVES a slot for a scheduled bus whether or not it's transmitting,
  // so a no-data ghost lands at its real position (e.g. #4 ahead of #5) instead
  // of being appended last. A ghost carries it as _curTripStartMin; a live bus
  // derives it from its live trip id. Falls back to live stop-sequence order
  // only when no schedule start is known (e.g. GTFS not loaded).
  const startOf = b => b._numGhost
    ? (b._curTripStartMin != null ? b._curTripStartMin : null)
    : relevantTripStart(b, String(b.BlockID || ''), nowMin);

  const nextPrev = new Map();
  for (const dir of Object.keys(byDir)) {
    const group = byDir[dir];
    const live  = group.filter(b => !b._numGhost);

    // FIXED NUMBERING — assign each block, the first time it's seen in this
    // direction, a number by SCHEDULED order (leader first) and never renumber
    // it again. When buses later run out of order it's the COLOUR (posFlag)
    // that changes, not the number — so #2 can sit physically ahead of #1.
    const ordered = group.slice().sort((a, b) => {
      const sa = startOf(a), sb = startOf(b);
      if (sa != null && sb != null && sa !== sb) return sa - sb;
      return (b.next_stop_sequence || 0) - (a.next_stop_sequence || 0);
    });
    let dirFixed = posFixed.get(dir);
    if (!dirFixed) { dirFixed = new Map(); posFixed.set(dir, dirFixed); }
    let maxNum = 0; for (const n of dirFixed.values()) if (n > maxNum) maxNum = n;
    ordered.forEach(b => {
      const blk = String(b.BlockID || '');
      if (!dirFixed.has(blk)) dirFixed.set(blk, ++maxNum);
    });
    ordered.forEach(b => {
      b._posNum = dirFixed.get(String(b.BlockID || ''));
      if (b._numGhost) b._posGhost = true;
    });

    // OVERTAKE DETECTION — live buses only, by current physical stop-sequence.
    // X currently ahead of Y but was behind last frame → X passed Y. Flag X
    // (passer) yellow, Y (passed) red; remember each other as the pass-partner.
    const bySeq = live.slice().sort((a, b) =>
      (b.next_stop_sequence || 0) - (a.next_stop_sequence || 0));
    const prev = posPrevSeq.get(dir) || new Map();
    for (let i = 0; i < bySeq.length; i++) {
      for (let j = i + 1; j < bySeq.length; j++) {
        const X = bySeq[i], Y = bySeq[j];
        const bx = String(X.BlockID || ''), by = String(Y.BlockID || '');
        const px = prev.get(bx), py = prev.get(by);
        if (px == null || py == null) continue;
        const xSeq = X.next_stop_sequence || 0, ySeq = Y.next_stop_sequence || 0;
        if (xSeq > ySeq && py > px) {
          posFlag.set(bx, { flag: 'yellow', role: 'passer', partner: by });
          posFlag.set(by, { flag: 'red',    role: 'passed', partner: bx });
        }
      }
    }

    const cur = new Map();
    bySeq.forEach(b => cur.set(String(b.BlockID || ''), b.next_stop_sequence || 0));
    nextPrev.set(dir, cur);
  }
  posPrevSeq.clear();
  for (const [k, v] of nextPrev) posPrevSeq.set(k, v);

  // Apply persistent flags to every card the bus appears on (live OR at
  // terminal), regardless of direction — the flag follows the bus. Attach a
  // status line pointing at where the pass-partner is right now.
  for (const b of merged) {
    const f = posFlag.get(String(b.BlockID || ''));
    if (!f) continue;
    b._posFlag = f.flag;
    const partner = byBlock.get(f.partner);
    b._passInfo = {
      role: f.role,                                            // 'passer' | 'passed'
      partnerBlk: f.partner,
      partnerDir: partner ? dirShort(partner.Direction) : null,
      partnerPos: partner ? partner._posNum : null,            // null if partner at terminal
      partnerTerminal: partner ? !!(partner._scheduledOnly || partner._isLayover) : false,
      partnerGone: !partner,                                   // finished / not on the board
    };
  }
  return merged;
}

// One-line leader/follower status shown above the location tag on a flagged
// card. Passer → "Leader behind"; passed → "Follower ahead"; both append the
// partner's current direction + live position (or terminal / off-service).
function passInfoHtml(bus) {
  const pi = bus._passInfo;
  if (!pi) return '';
  const who = pi.role === 'passer' ? 'Leader behind' : 'Follower ahead';
  let where;
  if (pi.partnerGone)            where = 'partner off service';
  else if (pi.partnerPos != null) where = 'serving ' + esc(pi.partnerDir) + ' · #' + pi.partnerPos;
  else if (pi.partnerTerminal)   where = 'at ' + esc(pi.partnerDir || '') + ' terminal';
  else                           where = 'serving ' + esc(pi.partnerDir || '');
  return '<div class="pass-info ' + (pi.role === 'passer' ? 'yellow' : 'red') + '">' +
         who + ' · ' + where + '</div>';
}

function annotateSchedLeader(merged) {
  const nowMin = serviceNowMin();
  const byBlock = new Map();
  for (const b of merged) byBlock.set(String(b.BlockID || ''), b);

  for (const bus of merged) {
    bus._schedLeaderBlk = null;
    bus._schedLeaderBus = null;
    bus._schedLeaderState = null;
    bus._schedLeaderDueMin = null;

    // Scheduled-only placeholder cards carry their own "SCHEDULED" status
    // already and have no live position, so don't compute a leader row for
    // them (its own row would just repeat the schedule info).
    if (bus._scheduledOnly) continue;

    const blk = String(bus.BlockID || '');
    // Dynamic "who's actually one headway ahead right now" leader, not the
    // fixed morning pull-out order — so a morning leader that's since
    // finished for the day no longer shows up as this bus's leader.
    const schedLeaderBlk = getCurrentSchedLeader(blk, nowMin);
    if (!schedLeaderBlk) continue;
    bus._schedLeaderBlk = schedLeaderBlk;
    const schedLeaderBus = byBlock.get(schedLeaderBlk) || null;
    bus._schedLeaderBus = schedLeaderBus;

    if (schedLeaderBus && schedLeaderBus._scheduledOnly) {
      // Leader is in the schedule but has no live data — reflect WHY, rather
      // than pretending everything's fine. The 'no_data' case (a trip that
      // should be running now with nothing on the feed) is the important
      // one: the leader's driver may not have shown up / logged in.
      if (schedLeaderBus._schedState === 'in_service_expected') {
        bus._schedLeaderState = 'no_data';
      } else { // not_started / layover_expected — has a known next pull-out
        bus._schedLeaderState = 'not_due_yet';
        bus._schedLeaderDueMin = schedLeaderBus._dueOutMin;
      }
    } else if (!schedLeaderBus) {
      // Not found live or as a layover ghost. That only means "missing" if
      // it's actually overdue — a block that simply hasn't pulled out for
      // its first trip yet (and so was never seen live, so can never be
      // ghosted either) looks identical from here unless we check the
      // schedule: it's not a problem, it's just not due out yet.
      const due = getNextDeparture(schedLeaderBlk, nowMin);
      if (due && due.dueOutMin > nowMin) {
        bus._schedLeaderState = 'not_due_yet';
        bus._schedLeaderDueMin = due.dueOutMin;
      } else if (!due) {
        // No next departure at all — it's finished all its scheduled trips
        // for the day, not "missing." (getNextDeparture returns null once
        // there's no trip left after the last one that's already ended.)
        bus._schedLeaderState = 'done_for_day';
      } else {
        bus._schedLeaderState = 'missing';
      }
    } else if (bus.Direction !== schedLeaderBus.Direction) {
      // Different direction right now (a block flips direction every trip
      // all day) — comparing stop-sequence position across directions is
      // meaningless, same class of bug fixed in annotateOvertake(). Default
      // to the no-tag "ahead" state rather than risk a false "PASSED" alarm.
      bus._schedLeaderState = 'ahead';
    } else {
      // Both live, same direction. Raw next_stop_sequence is only comparable
      // when they're on the SAME trip variation (same endpoint). A leader on
      // a shorter variation — about to complete its block and go out of
      // service — would otherwise look "passed" just because the follower's
      // longer trip has more stops. Different endpoints → stay neutral.
      const myLast = liveTripLast(bus), lLast = liveTripLast(schedLeaderBus);
      if (myLast && lLast && myLast !== lLast) {
        bus._schedLeaderState = 'ahead';
      } else {
        const mySeq = parseInt(bus.next_stop_sequence) || 0;
        const lSeq  = parseInt(schedLeaderBus.next_stop_sequence) || 0;
        bus._schedLeaderState = lSeq >= mySeq ? 'ahead' : 'behind';
      }
    }
  }
  return merged;
}

// For one same-direction trip (dir, startMin) of `block`, the block running
// the trip that starts just before it (its leader for that leg) + that trip.
function leaderForTrip(block, dir, startMin) {
  let bestBlk = null, bestStart = -Infinity, bestTrip = null;
  for (const [blk, trips] of sched.blockTrips) {
    if (blk === String(block)) continue;
    for (const t of trips) {
      if (t.direction !== dir) continue;
      const s = timeStrToMin(t.start);
      if (isPhantomTrip(blk, s)) continue; // trip after its block pulled in → never ran
      if (s != null && s < startMin && s > bestStart) { bestStart = s; bestBlk = blk; bestTrip = t; }
    }
  }
  return bestBlk ? { block: bestBlk, startMin: bestStart, trip: bestTrip } : null;
}

// Full leader history for a bus across its day: past / current / next leaders,
// one row per trip, deduped per section. Attached as bus._leaderTimeline.
function annotateLeaderTimeline(merged) {
  const nowMin = serviceNowMin();
  const byBlock = new Map();
  for (const b of merged) byBlock.set(String(b.BlockID || ''), b);

  const busNoOf = (blk) => {
    const live = byBlock.get(blk);
    if (live && !live._scheduledOnly) {
      const v = String(live.VehicleID || '').trim();
      if (v && v !== '0') return v;
    }
    return knownVehicleFor(blk) || 'n/a';
  };
  const liveStatusOf = (blk) => {
    const live = byBlock.get(blk);
    if (!live || live._scheduledOnly) return 'Scheduled';
    const late = parseInt(live.late) || 0;
    if (late === 0) return 'On time';
    if (late < 0)   return Math.abs(late) + 'm early';
    return '+' + late + 'm late';
  };

  for (const bus of merged) {
    bus._leaderTimeline = null;
    const block = String(bus.BlockID || '');
    const trips = (sched.blockTrips.get(block) || [])
      .map(t => ({ ...t, s: timeStrToMin(t.start), e: timeStrToMin(t.end) }))
      .filter(t => t.s != null && t.e != null)
      .sort((a, b) => a.s - b.s);
    if (!trips.length) continue;

    // Current trip = the one in progress; for a scheduled/out-of-service bus
    // there's none in progress, so it's the NEXT upcoming trip — i.e. the trip
    // it's about to run — which makes its "current leader" the leader of that
    // next trip, as requested.
    let curIdx = trips.findIndex(t => nowMin >= t.s && nowMin <= t.e);
    if (curIdx < 0) curIdx = trips.findIndex(t => t.s > nowMin);
    if (curIdx < 0) curIdx = trips.length - 1;

    const past = [], next = []; let current = null;
    trips.forEach((t, i) => {
      const ldr = leaderForTrip(block, t.direction, t.s);
      if (!ldr) return;
      const row = {
        blk: ldr.block,
        dir: dirShort((sched.dirNames && sched.dirNames[t.direction]) || String(t.direction)),
        start: ldr.startMin,
        bus: busNoOf(ldr.block),
        status: i < curIdx ? 'Past' : i > curIdx ? 'Scheduled' : liveStatusOf(ldr.block),
      };
      if (i < curIdx) past.push(row);
      else if (i === curIdx) current = row;
      else next.push(row);
    });
    const dedupe = arr => { const seen = new Set(); return arr.filter(r => !seen.has(r.blk) && seen.add(r.blk)); };
    bus._leaderTimeline = { past: dedupe(past), current, next: dedupe(next) };
  }
  return merged;
}

// ── RENDER ───────────────────────────────────────────────────
let lastHTML = '';
let isFirstRender = true;

// A refresh (the 30-s timer or ↻) keeps the page where it is. Swapping the
// content in makes the page shorter for a moment (the live map is put back
// a beat later), and Safari - no scroll anchoring - then pulled the page up,
// so the map you had scrolled down to was gone. During a refresh the content
// keeps its height until the new cards and map are in, and the scroll
// position is put back. Changing view (EB / WB, Run only, a search) still
// goes to the top as before.
let refreshScrollY = null;   // set by tick() for the time of a refresh
function setContent(html) {
  if (html === lastHTML) return;
  lastHTML = html;
  const el = document.getElementById('content');
  const keepY = refreshScrollY;
  if (keepY == null || view.scrollNow || keepY <= 0) { el.innerHTML = html; return; }
  el.style.minHeight = el.offsetHeight + 'px';
  el.innerHTML = html;
  if (Math.abs(window.scrollY - keepY) > 1) window.scrollTo(0, keepY);
  // After the map is back in (drawLiveMap attaches it right after this),
  // let the height go and stay at the same spot.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.minHeight = '';
    if (window.scrollY < keepY - 1) window.scrollTo(0, Math.min(keepY, document.documentElement.scrollHeight - window.innerHeight));
  }));
}

function renderMain(merged, route) {
  document.getElementById('routeBar').classList.remove('hidden');
  document.getElementById('routeNum').textContent = route;

  if (state.bus || state.block) { renderBusMain(merged, route); return; }

  const live      = merged.filter(b => !b._isLayover && !b._scheduledOnly).length;
  const atTerm    = merged.filter(b => b._isLayover).length;
  const schedOnly = merged.filter(b => b._scheduledOnly).length;

  document.getElementById('alertArea').innerHTML = '';
  if (live === 0 && atTerm === 0 && schedOnly === 0) {
    document.getElementById('busCount').textContent = 'No active buses';
    lastCards = []; lastRouteCards = [];
    lastEmptyHtml = '<div class="msg"><div class="icon"><img class="bus-ico big" src="assets/icon-192.png" alt="" width="48" height="48"></div><div class="main">No buses on Route ' + esc(route) + '</div><div class="sub">Route may not be running right now<br>Trip Sheets (menu) lists the whole day</div></div>';
    drawView(false);
    return;
  }

  const parts = [live + ' active'];
  if (atTerm > 0) parts.push(atTerm + ' at terminal');
  if (schedOnly > 0) parts.push(schedOnly + ' scheduled');
  document.getElementById('busCount').textContent = parts.join(' · ');

  const anim = isFirstRender;
  isFirstRender = false;

  annotateSchedLeader(merged);
  annotateLeaderTimeline(merged);
  annotatePositions(merged);
  lastRouteCards = merged;
  lastCards = merged;
  lastEmptyHtml = '';
  drawView(anim);
}

// Bus-number search: the whole route is merged and annotated exactly as usual
// (so positions and leaders stay right), then only the searched bus's card is
// drawn. A live card for that bus number wins; otherwise its block's card —
// layover, at-terminal or scheduled — from the normal pipeline.
function busCardsFor(merged) {
  const byBus = merged.filter(b => String(b.VehicleID || '').trim() === state.bus);
  const live  = byBus.filter(b => !b._isLayover && !b._scheduledOnly);
  if (live.length) return live;
  const byBlock = state.busBlock ? merged.filter(b => String(b.BlockID || '') === state.busBlock) : [];
  return byBlock.length ? byBlock : byBus;
}

// The searched bus's cards plus the searched block's (when the number is
// both and they're on this route), without doubles.
function findCardsFor(merged) {
  const out = state.bus ? busCardsFor(merged) : [];
  if (state.block)
    for (const b of merged) if (String(b.BlockID || '') === state.block && !out.includes(b)) out.push(b);
  return out;
}

// Banners above a search's cards: where the searched bus or block was last
// seen when that one isn't out, and a button over to the other match when the number is a
// bus on one route and a block on another.
function findBannersHtml() {
  // The Run / Block / Bus buttons (typeRow) switch between a number's
  // matches now; each shows only its own result, so no banners for the other.
  return '';
}

// Swap between the two matches of a number that is a bus on one route and a
// block on another.
function switchFindView() {
  const f = state.find;
  if (!f || !f.bus || !f.block) return;
  if (state.bus) { state.bus = ''; state.busBlock = ''; state.block = f.num; loadRoute(f.block.route); }
  else { state.bus = f.num; state.busBlock = f.bus.block; state.block = ''; loadRoute(f.bus.route); }
}

/// Why a searched bus has no card, from the scheduled times only, as the
// search result's lines: ["Pulled in at 1:44 AM", "Last trip ended at
// 11:58 PM", "Last served on Route 44 Block 9664", { runs }, "Goes out again
// at 3:20 PM", { run }]. Parts with no data are left out. Times are today's
// (midnight to midnight); between midnight and 4 AM a run from last night
// that just finished is part of today, and the block's next run is too.
function doneParts(route) {
  const blk = state.busBlock;
  const rec = blk ? paddle.byBlock.get(blk) : null;
  const nowMin = serviceNowMin();
  // The pull-in that has happened (last night's run after midnight), else the one due.
  const ins = (rec && rec.ins) || [];
  const done = ins.filter(i => i.min <= nowMin).pop();
  const due = ins.find(i => i.min > nowMin);
  // The last trip that really ran: trips at or after the pull-in are phantom.
  const ends = (sched.blockTrips.get(blk) || [])
    .filter(t => !isPhantomTrip(blk, timeStrToMin(t.start)))
    .map(t => timeStrToMin(t.end)).filter(e => e != null && e <= nowMin);
  const lastEnd = ends.length ? fmtClock(Math.max(...ends)) : '';
  const parts = [];
  if (done) parts.push('Finished ' + dayWhen(done.min));
  else if (due) parts.push('Due to pull in at ' + fmtClock(due.min));
  if (lastEnd) parts.push('Last trip ended at ' + lastEnd);
  parts.push({ html: 'Last served ' + onTagsHtml(route, blk, '') });
  const next = blk && nextOut(blk);
  if (rec && rec.runs.length && !next) parts.push({ runs: rec.runs });
  if (next) parts.push('Block ' + blk + (next.min >= 1440 ? ' goes out again ' : '’s next run goes out ') + dayWhen(next.min), { runs: [next.run] });
  return parts;
}

// A block that isn't out but has a run still to come today: when it goes out,
// and which run. Empty when nothing is left today.
function nextOutParts(blk) {
  const next = blk && nextOut(blk);
  return next ? [(next.min >= 1440 ? 'Goes out ' : 'Today’s run goes out ') + dayWhen(next.min).replace(/^today /, ''), { runs: [next.run] }] : [];
}
// The headline for a searched bus / block with no card: a block with a run
// still to come today isn't out YET (at 2 AM: last night's run ended at 1:44,
// today's goes out at 3:20 PM), else it is done for now.
function doneHeadline(what, blk) {
  return blk && nextOut(blk) ? what + ' isn’t out yet' : what + ' is done for now';
}

// A searched block with nothing left now: when it finished, its route, today's
// bus if known, and its runs - or when it goes out next today.
function blockDoneParts(route) {
  const blk = state.block;
  const rec = paddle.byBlock.get(blk);
  const fin = finishedParts(blk);
  const next = nextOutParts(blk);
  const parts = fin.concat(next.length ? next : ['Nothing left today on Route ' + route]);
  const bus = knownVehicleFor(blk);
  if (bus) parts.push({ html: 'Served by ' + PaTags.busTag(bus) });
  if (rec && rec.runs.length && !next.length) parts.push({ runs: rec.runs });
  return parts;
}

// A block's lines plus when it goes out next today; that run's button shows
// once (at the end), not also among the lines above.
function withNextOut(blk, parts) {
  const next = nextOutParts(blk);
  if (!next.length) return parts;
  const no = next[1].runs[0].runno;
  return parts.filter(p => typeof p === 'string' || !p.runs || !(p.runs.length === 1 && p.runs[0].runno === no)).concat(next);
}

// A time on today's clock in words, for search results: last night before
// midnight is "yesterday at 11:08 PM", after midnight "today at 1:44 AM
// (after midnight)", tonight's after-midnight "tonight at 12:23 AM".
function dayWhen(min) {
  if (min < 0) return 'yesterday at ' + fmtClock(min);
  if (min >= 1440) return 'tonight at ' + fmtClock(min);
  return 'today at ' + fmtClock(min) + (min < SERVICE_DAY_START_HR * 60 && inOwlWindow(new Date()) ? ' (after midnight)' : '');
}
// "Finished today at 1:44 AM (after midnight)": the block's last pull-in that
// has happened, when it is the newest thing that happened on the block.
function finishedParts(blk) {
  const rec = blk && paddle.byBlock.get(String(blk));
  if (!rec) return [];
  const now = serviceNowMin();
  const done = (rec.ins || []).filter(i => i.min <= now).pop();
  const out = (rec.outs || []).filter(o => o.min <= now).pop();
  return done && (!out || out.min <= done.min) ? ['Finished ' + dayWhen(done.min)] : [];
}

// ── LIVE: RUN SEARCH ─────────────────────────────────────────
// 1-3 digits on the Live page = a run of the selected depot (4 digits stay a
// bus or block). Out now: its block's live card, as a block search, labelled
// with the run. Not out: when it finished (yesterday PM / today after
// midnight / today) and when today's run reports and goes out, on which block.
let runTimer = 0;

// Every instance of run `no` (selected depot) on today's clock - after
// midnight last night's leftover and today's - in time order.
function runInstances(no, depot) {
  const seen = new Set(), out = [];
  for (const rec of paddle.byBlock.values()) for (const seg of rec.segs || []) {
    const r = seg.run;
    if (seen.has(r) || Number(r.runno) !== Number(no) || (depot && r.depot !== depot)) continue;
    seen.add(r);
    const ps = r.pieces.filter(x => x.s != null && x.e != null).sort((a, b) => a.s - b.s);
    if (ps.length) out.push({ run: r, pieces: ps, s: ps[0].s, e: Math.max(...ps.map(x => x.e)) });
  }
  // No depot picked: one depot's run only (the first found).
  const d = out.length ? out[0].run.depot : '';
  return out.filter(i => i.run.depot === d).sort((a, b) => a.s - b.s);
}

// "Last night's run finished at 2:29 AM, after midnight" / "... yesterday at
// 11:08 PM" / "Finished today at 2:15 PM".
function finishedLine(i) {
  if (!i.run.lastNight) return 'Finished ' + dayWhen(i.e);
  return 'Last night’s run finished ' + (i.e < 0 ? 'yesterday at ' + fmtClock(i.e) : 'at ' + fmtClock(i.e) + ', after midnight');
}

function showFindMessage(h) {
  document.getElementById('busCount').textContent = '';
  state.route = '';
  clearInterval(refreshTimer); clearInterval(countdownTimer);
  setStatus('idle');
  document.getElementById('routeBar').classList.add('hidden');
  renderBottomBar();
  setContent('<div class="msg find-msg">' + h + '</div>');
}

async function onRunSearch(no) {
  document.getElementById('routeSelect').value = '';
  document.querySelector('.input-row').classList.add('searching');
  view.mode = 'dir'; saveMode('dir'); view.follow = true; view.run = '';
  const f = { num: no, run: no, bus: null, block: null };
  state.find = f; state.bus = ''; state.busBlock = ''; state.block = '';
  document.getElementById('alertArea').innerHTML = '';
  setStatus('loading');
  setContent('<div class="msg"><div class="icon" style="animation:pulse 1s infinite">🔍</div><div class="main">Finding Run ' + esc(no) + '…</div><div class="sub">Run number</div></div>');
  if (paddleReady) { try { await paddleReady; } catch (_) {} }
  if (state.find !== f) return;
  const depot = document.getElementById('depotSelect').value;
  const inst = runInstances(no, depot);
  f.runOnly = true; f.runMatch = inst.length > 0; f.sel = inst.length ? 'run' : '';
  renderTypeRow();
  if (!inst.length) {
    showFindMessage(findSecHtml('bus', 'Run ' + no + ' not found', 'No Run ' + esc(no) + (depot ? ' at ' + esc(depot) : '') + ' today'));
    return;
  }
  const now = serviceNowMin();
  const cur = inst.find(i => i.s <= now && now < i.e);
  const piece = cur && cur.pieces.find(x => x.s <= now && now < x.e);
  // Out now: its block, live.
  if (piece) return onBusSearch({ run: no, block: piece.blk });

  const lines = [];
  // "on [21/9605]": the block tag, its route the one the block runs then.
  const where = x => '<span class="pa-tagrow">' + PaTags.blockTag(null, x.blk, { label: x.rt, day: getDayType(), at: x.s, s: x.s, e: x.e }) + '</span>';
  const finished = inst.filter(i => i.e <= now).pop();
  const next = inst.find(i => i.s > now);
  let head;
  if (cur) {
    // Between pieces: on a break.
    const back = cur.pieces.find(x => x.s > now);
    head = 'Run ' + no + ' is on a break';
    if (back) lines.push({ html: esc('Back out ' + dayWhen(back.s)) + ' on ' + where(back) });
  } else if (next) {
    head = 'Run ' + no + ' isn’t out yet';
    if (finished) lines.push(finishedLine(finished));
    const rep = next.run.reportMin;
    const when = m => m >= 1440 ? dayWhen(m) : 'at ' + fmtClock(m);
    const lead = finished ? 'Today’s run ' : '';
    lines.push({ html: esc(rep != null && rep < next.s
      ? (lead ? lead + 'reports ' : 'Reports ') + when(rep) + ', goes out ' + when(next.s)
      : (lead ? lead + 'goes out ' : 'Goes out ') + when(next.s)) + ' on ' + where(next.pieces[0]) });
  } else {
    head = 'Run ' + no + ' is done for today';
    if (finished) lines.push(finishedLine(finished));
  }
  const show = (cur || next || finished).run;
  lines.push({ runs: [{ runno: show.runno, link: show.link }] });
  showFindMessage(findSecHtml('bus', head, lines));
  PaTags.resolveBlockTags(document.getElementById('content'));
}

// One search-result section: icon ('bus' / 'block'), headline, lines.
function findSecHtml(icon, main, parts) {
  return '<div class="find-sec">' + FIND_ICON[icon] + '<div class="main">' + esc(main) + '</div><div class="sub">' +
    (typeof parts === 'string' ? parts : findPartsHtml(parts)) + '</div></div>';
}

function renderBusMain(merged, route) {
  const area = document.getElementById('alertArea');
  const banners = findBannersHtml();
  if (area.innerHTML !== banners) area.innerHTML = banners;
  annotateSchedLeader(merged);
  annotateLeaderTimeline(merged);
  annotatePositions(merged);
  lastRouteCards = merged;
  const mine = findCardsFor(merged);
  const what = [];
  if (state.bus) what.push('Bus ' + state.bus + (state.busBlock ? ' · Block ' + state.busBlock : ''));
  if (state.block) what.push((state.find && state.find.run ? 'Run ' + state.find.run + ' · ' : '') + 'Block ' + state.block);

  if (!mine.length) {
    document.getElementById('busCount').textContent = what.join(' & ');
    lastCards = [];
    lastEmptyHtml = '<div class="msg find-msg">' + (state.bus
      ? findSecHtml('bus', 'Bus ' + state.bus + ' is done for now', doneParts(route))
      : findSecHtml('block', doneHeadline('Block ' + state.block, state.block), blockDoneParts(route))) + '</div>';
    drawView(false);
    return;
  }

  const isLive = mine.some(b => !b._isLayover && !b._scheduledOnly);
  document.getElementById('busCount').textContent = what.join(' & ') + (isLive ? '' : ' · not live');
  const anim = isFirstRender;
  isFirstRender = false;
  lastCards = mine;
  lastEmptyHtml = '';
  drawView(anim);
}

// Insert each no-data in-service ghost into the live active list at its fixed
// position number — e.g. #4 lands just ahead of #3 (between #5 and #3) — so a
// bus that should be running but isn't transmitting still holds its slot in
// the sequence. `active` is ordered start→destination (≈ position number
// descending), so we drop each ghost before the first lower-numbered bus.
function weaveGhosts(active, ghosts) {
  if (!ghosts.length) return active;
  const out = active.slice();
  for (const g of ghosts.slice().sort((a, b) => (b._posNum || 0) - (a._posNum || 0))) {
    const gp = g._posNum || 0;
    let idx = out.findIndex(b => (b._posNum || 0) < gp);
    if (idx < 0) idx = out.length;
    out.splice(idx, 0, g);
  }
  return out;
}

// ── VIEWS ────────────────────────────────────────────────────
// One view at a time: a direction ('dir', view.dir), All Trips ('all') or
// Detours ('detours'). The direction is kept by NAME, not page position, so a
// refresh that finds the directions in a different order (or one direction
// briefly empty) can't move the view; it is saved per route (bt_dir_<route>).
// The mode survives refreshes and route changes for this visit.
// The mode (a direction, All Trips or Detours) is also kept across page
// reloads (bt_view), so a refresh doesn't jump back to the directions.
// All Trips is its own page in the left menu (block-tracker.html?view=all);
// the live page's bottom bar is the two directions and Detours.
const ALL_TRIPS_PAGE = /[?&]view=all(&|$)/.test(location.search);
// Opening it jumps to now, not to where the browser last left the page.
if (ALL_TRIPS_PAGE && 'scrollRestoration' in history) history.scrollRestoration = 'manual';
const VIEW_MODES = ['dir', 'detours'];
function savedMode() { if (ALL_TRIPS_PAGE) return 'all'; try { const m = localStorage.getItem('bt_view'); return VIEW_MODES.includes(m) ? m : 'dir'; } catch(e) { return 'dir'; } }
function saveMode(m) { if (ALL_TRIPS_PAGE) return; try { localStorage.setItem('bt_view', m); } catch(e) {} }
const view = { mode: savedMode(), dir: '', follow: false, run: '', blk: '', tsMiss: '', tsPrevRoute: null, tsDay: '', tsDayLoading: false, atDir: '', scrollNow: ALL_TRIPS_PAGE };  // blk / tsMiss / tsPrevRoute: Trip Sheets search (see tripSheetSearch)  // run: All Trips shows only this run (depot|runno); atDir: All Trips shows only this direction ('' = Both)
let lastCards = [];     // annotated cards of the last render (the route's, or a search's)
let lastEmptyHtml = ''; // message for a direction view when there are no cards
let refreshing = false; // refresh spinner state, kept across bar redraws

const DIR_ORDER = ['Northbound', 'Southbound', 'Eastbound', 'Westbound'];
const dirKey = route => 'bt_dir_' + route;
function savedDir(route) { try { return localStorage.getItem(dirKey(route)) || ''; } catch(e) { return ''; } }

// The route's two directions, NB before SB and EB before WB: GTFS's direction
// names first, else whatever the cards say.
function routeDirs() {
  const s = new Set();
  Object.values(sched.dirNames || {}).forEach(d => d && s.add(canonDir(d)));
  if (s.size < 2) lastCards.forEach(b => b.Direction && s.add(canonDir(b.Direction)));
  const rank = d => { const i = DIR_ORDER.indexOf(d); return i < 0 ? 99 : i; };
  return [...s].sort((a, b) => rank(a) - rank(b) || a.localeCompare(b)).slice(0, 2);
}

// The direction shown: while a search follows its bus, the bus's own
// direction; else the one picked (or saved for this route); else the first.
function currentDir() {
  const dirs = routeDirs();
  if (view.follow && lastCards.length) return canonDir(lastCards[0].Direction);
  if (dirs.includes(view.dir)) return view.dir;
  const saved = savedDir(state.route);
  if (dirs.includes(saved)) return saved;
  return dirs[0] || (lastCards[0] ? canonDir(lastCards[0].Direction) : '');
}

// A bottom-bar tap (or a swipe): switch view; a direction pick is remembered.
function selectView(mode, dir) {
  view.mode = mode; saveMode(mode);
  view.run = '';  // a bottom-bar tap also leaves a run's trip sheet
  if (mode === 'dir' && dir) {
    view.dir = dir; view.follow = false;
    try { localStorage.setItem(dirKey(state.route), dir); } catch(e) {}
  }
  lastHTML = '';
  drawView(false);
  window.scrollTo(0, 0);
}

function viewOrder() {
  return routeDirs().map(d => ({ mode: 'dir', dir: d })).concat([{ mode: 'detours' }]);
}
function swipeView(step) {
  if (ALL_TRIPS_PAGE) return;
  const order = viewOrder();
  const cur = view.mode === 'dir' ? currentDir() : '';
  const i = order.findIndex(v => v.mode === view.mode && (v.mode !== 'dir' || v.dir === cur));
  const next = order[Math.max(0, Math.min(order.length - 1, (i < 0 ? 0 : i) + step))];
  if (next && (next.mode !== view.mode || next.dir !== cur)) selectView(next.mode, next.dir);
}

function drawView(anim) {
  renderBottomBar();
  let html;
  if (view.mode === 'all') html = '<div class="view-wrap">' + buildAllTripsPage(anim) + '</div>';
  else if (view.mode === 'detours') html = '<div class="view-wrap">' + buildDetoursPage(anim) + '</div>';
  // "Run 452 only" on a live page: that run's trip sheet until "Back to live".
  else if (view.run) html = '<div class="view-wrap">' + buildAllTripsPage(anim) + '</div>';
  else if (!lastCards.length && lastEmptyHtml) html = '<div class="view-wrap">' + lastEmptyHtml + '</div>';
  else {
    const dir = currentDir();
    html = '<div class="view-wrap">' + buildLiveDirPage(dir, anim) + '</div>';
  }
  setContent(html);
  if (view.mode === 'dir' && !view.run && document.querySelector('#content .lm-slot')) drawLiveMap(currentDir());
  manageLayoverTimers();
  // All Trips opens at the first trip not finished yet (on entry and on a
  // direction pick, not on every refresh).
  if ((view.mode === 'all' || view.run) && view.scrollNow && sched.loaded) {
    view.scrollNow = false;
    const el = document.querySelector('.at-list .prc:not(.at-done)');
    // Below the sticky top bar + header.
    const hdr = document.querySelector('.header');
    const covered = hdr ? hdr.getBoundingClientRect().bottom : 0;
    if (el) window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - covered - 12));
  }
}

function renderBottomBar() {
  const bar = document.getElementById('bottomBar');
  const on = !!state.route;
  bar.classList.toggle('hidden', !on);
  document.body.classList.toggle('has-bar', on);
  if (!on) return;
  const dirs = routeDirs();
  const cur = view.mode === 'dir' ? currentDir() : '';
  let h = '';
  if (ALL_TRIPS_PAGE) {
    // All Trips: [EB/SB] [Both] [WB/NB], this route's own directions; Both is the default.
    const es = dirs.find(d => /east|south/i.test(d)) || dirs[0];
    const wn = dirs.find(d => d !== es) || null;
    const btn = (d, label) => '<button type="button" class="page-dot' + (d != null && view.atDir === d ? ' active' : '') +
      '" data-at-dir="' + esc(d || '') + '"' + (d == null ? ' disabled' : '') + '>' + esc(label) + '</button>';
    h += (es ? btn(es, dirShort(es)) : btn(null, '—')) + btn('', 'Both') + (wn ? btn(wn, dirShort(wn)) : btn(null, '—'));
    h += '<button type="button" class="refresh-btn' + (refreshing ? ' spinning' : '') + '" data-refresh aria-label="Refresh now">&#8635;</button>';
    if (bar.innerHTML !== h) bar.innerHTML = h;
    return;
  }
  for (let i = 0; i < 2; i++) {
    const d = dirs[i];
    h += d ? '<button type="button" class="page-dot' + (d === cur ? ' active' : '') + '" data-view="dir" data-dir="' + esc(d) + '">' + esc(dirShort(d)) + '</button>'
           : '<button type="button" class="page-dot" disabled>—</button>';
  }
  const n = routeDetours.length;
  h += '<button type="button" class="page-dot detour-dot' + (view.mode === 'detours' ? ' active' : '') + '" data-view="detours">Detours' +
       (n ? ' <span class="dot-count">' + n + '</span>' : '') + '</button>';
  h += '<button type="button" class="refresh-btn' + (refreshing ? ' spinning' : '') + '" data-refresh aria-label="Refresh now">&#8635;</button>';
  if (bar.innerHTML !== h) bar.innerHTML = h;
}

// One direction's buses, ordered the way they travel through the list.
function buildDirPage(dir, list, anim) {
  let idx = 0, h = '';
  // Consistent visual geography across a route's two direction views, so the
  // same physical point keeps its vertical spot when you switch. Buses travel
  // through the list in their direction of motion:
  //   Eastbound/Southbound → START at TOP, destination at BOTTOM (buses move
  //                          DOWN as they progress).
  //   Westbound/Northbound → START at BOTTOM, destination at TOP (buses move
  //                          UP as they progress).
  // next_stop_sequence grows toward the destination. Scheduled (not-yet-
  // started) buses sit at the START end, ordered by scheduled departure so
  // the soonest-to-leave is nearest the last-started (lowest-sequence) bus.
  const westNorth = /west|north/i.test(dir);
  // No-data "should be in service" ghosts are woven into the live sequence
  // (numbered as if in service), not parked in the scheduled section below.
  const inServiceGhosts = list.filter(b => b._scheduledOnly && b._schedState === 'in_service_expected');
  const liveActive = list.filter(b => !b._scheduledOnly)
    .sort((a, b) => (a.next_stop_sequence || 0) - (b.next_stop_sequence || 0)); // start → destination
  const active = weaveGhosts(liveActive, inServiceGhosts);

  const dueSort = (a, b) => (a._dueOutMin != null ? a._dueOutMin : -Infinity) -
                            (b._dueOutMin != null ? b._dueOutMin : -Infinity);  // soonest → latest
  const schedAll = list.filter(b => b._scheduledOnly && b._schedState !== 'in_service_expected').sort(dueSort);

  // Scheduled buses still waiting for their FIRST trip (blue tag, no bus
  // number) are collapsed: show only the NEXT (soonest) one inline, tuck the
  // rest behind a tappable "N more scheduled" section. Already-served
  // scheduled buses stay visible normally.
  const notStarted = schedAll.filter(b => b._schedState === 'not_started');
  const otherSched = schedAll.filter(b => b._schedState !== 'not_started');
  const schedVisible = otherSched.concat(notStarted.slice(0, 1)).sort(dueSort);
  const schedHidden  = notStarted.slice(1);

  const totalCount = list.length;
  h += '<div class="timeline-wrap"><div class="timeline">';
  h += '<div class="section-label' + (anim ? ' fade-in' : '') + '">' + esc(dirShort(dir)) + ' · ' + totalCount + ' bus' + (totalCount !== 1 ? 'es' : '') + '</div>';

  // Collapsed extras sit at the far START end (furthest from active buses),
  // matching the scheduled-bus geography.
  const hiddenHtml = schedHidden.length
    ? '<details class="more-sched"><summary>' + schedHidden.length +
      ' more scheduled</summary>' + schedHidden.map(b => buildNode(b, idx++, anim)).join('') +
      '</details>'
    : '';

  if (westNorth) {
    // WB/NB: active (destination→start) on top, then scheduled soonest→latest,
    // then the collapsed extras at the bottom (start end).
    active.slice().reverse().forEach(bus => { h += buildNode(bus, idx++, anim); });
    schedVisible.forEach(bus => { h += buildNode(bus, idx++, anim); });
    h += hiddenHtml;
  } else {
    // EB/SB: collapsed extras on top (start end), then scheduled latest→soonest,
    // then active start→destination.
    h += hiddenHtml;
    schedVisible.slice().reverse().forEach(bus => { h += buildNode(bus, idx++, anim); });
    active.forEach(bus => { h += buildNode(bus, idx++, anim); });
  }
  if (!totalCount) h += '<div class="at-empty">No ' + esc(dirShort(dir)) + ' buses right now</div>';
  return h + '</div></div>';
}

// ── ALL TRIPS ────────────────────────────────────────────────
// Every bus still to run on this route today, both directions in one list,
// by time: one card per one-way trip, at that trip's start, showing how many
// trips in that direction the block still has on this route from there
// (2 EB, then 2 WB, 1 EB, 1 WB). A block in from another route for one round
// trip shows up the same way (1 EB, then 1 WB). Built from the timetable, so
// blocks not out yet are all there; live data only marks which trip a live
// bus is on (a late bus stays until it finishes), its location, and its bus
// number.
const tripDirOf = t => canonDir((sched.dirNames && sched.dirNames[t.direction]) || 'Direction ' + t.direction);

// Each trip's place in its direction for the whole service day on this route
// ("98"), counted over every block and every trip — done ones too, and
// whatever a search shows — so a number never changes during the day and the
// trip ahead / behind is always N-1 / N+1. Keyed block|start minute; built
// once per timetable load.
let tripNumCache = { src: null, map: null };
function tripNumbers() {
  if (tripNumCache.src === sched.blockTrips && tripNumCache.map) return tripNumCache.map;
  // Today's trips count from #1; last night's leftovers (midnight-4 AM) keep
  // the numbers they had last night, counted over last night's whole list.
  const number = (list, skipPhantom) => {
    const all = new Map();
    for (const t of list) {
      const blk = String(t.block_id);
      const s = timeStrToMin(t.start), e = timeStrToMin(t.end);
      if (s == null || e == null || (skipPhantom && isPhantomTrip(blk, s))) continue;
      const k = blk + '|' + s;
      if (!all.has(k)) all.set(k, { k, blk, s, e, dir: tripDirOf(t) });
    }
    const out = new Map(), count = new Map();
    [...all.values()].sort((a, b) => a.s - b.s || a.e - b.e || a.blk.localeCompare(b.blk)).forEach(x => {
      const n = (count.get(x.dir) || 0) + 1;
      count.set(x.dir, n);
      out.set(x.k, n);
    });
    return out;
  };
  const today = [], left = [], tonight = [];
  for (const [blk, raw] of sched.blockTrips) for (const t of raw) (t.lastNight ? left : t.tonight ? tonight : today).push({ ...t, block_id: blk });
  const map = number(sched.todayAll || today, true);
  const borrow = (list, all) => {
    if (!list.length || !all) return;
    const m = number(all, false);
    list.forEach(t => { const k = String(t.block_id) + '|' + timeStrToMin(t.start); if (m.has(k)) map.set(k, m.get(k)); });
  };
  borrow(left, sched.lastNightAll);   // last night's leftovers keep last night's numbers
  borrow(tonight, sched.tomorrowAll); // tonight's night liners: tomorrow's numbers
  tripNumCache = { src: sched.blockTrips, map };
  return map;
}
const tripNum = (blk, s) => (s == null ? 0 : tripNumbers().get(String(blk) + '|' + s) || 0);

function allTripsItems() {
  const nowMin = serviceNowMin();
  // Trip Sheets on another day (day buttons): the plain timetable.
  const dayMode = ALL_TRIPS_PAGE && !!view.tsDay;
  const byBlock = new Map();
  if (!dayMode) lastCards.forEach(b => byBlock.set(String(b.BlockID || ''), b));
  // A search shows its own block(s) only.
  const only = !dayMode && (state.bus || state.block) ? new Set(lastCards.map(b => String(b.BlockID || ''))) : null;
  const dirOf = tripDirOf;
  const items = [];
  for (const [blk, raw] of sched.blockTrips) {
    if (only && !only.has(blk)) continue;
    // The feed can list one trip twice under two trip ids (route 38 block
    // 9260: 963851 and 5630, both 10:53-11:50 EB); count it once, matching
    // a live bus on either id. Also two versions of one trip: route 40
    // block 9331 lists every EB trip twice, "2nd-Lombard" 5:39-6:50 PM and
    // "2nd-Lombard via Pine St" 5:39-6:51 PM - one bus, one trip (keyed by
    // start and direction; the later end kept so it never ends too early).
    const byKey = new Map();
    for (const t of raw) {
      const s = timeStrToMin(t.start), e = timeStrToMin(t.end);
      if (s == null || e == null || isPhantomTrip(blk, s)) continue;
      const k = s + '|' + t.direction;
      const had = byKey.get(k);
      if (had) { had.ids.add(String(t.trip_id)); if (e > had.e) { had.e = e; had.t = t; } }
      else byKey.set(k, { t, s, e, ids: new Set([String(t.trip_id)]) });
    }
    const trips = [...byKey.values()].sort((a, b) => a.s - b.s || a.e - b.e);
    if (!trips.length) continue;
    const card = byBlock.get(blk);
    const live = card && !card._scheduledOnly && !card._isLayover ? card : null;
    const pulledIn = !dayMode && !live && blockPulledIn(blk);
    // A live bus's own trip (by its live trip id) and everything after it are
    // still to do, even if the timetable says that trip has ended (running
    // late). Otherwise: a trip that hasn't ended yet. A pulled-in block is done.
    const liveIdx = live && live.trip != null ? trips.findIndex(x => x.ids.has(String(live.trip))) : -1;
    const pending = (x, i) => dayMode ? true : pulledIn ? false : liveIdx >= 0 ? i >= liveIdx : x.e > nowMin;

    let first = true;
    trips.forEach((x, i) => {
      const dir = dirOf(x.t);
      const nth = tripNum(blk, x.s);
      // Finished trips stay on the list, grayed out.
      if (!pending(x, i)) { items.push({ blk, s: x.s, e: x.e, dir, left: 0, done: true, inService: false, live: null, cur: false, nth }); return; }
      // This trip and the ones after it in the same direction - of the same
      // run of the block: last night's leftover trips count only last
      // night's (Run 572's 1:49 AM WB is its last: "1 WB", not 5 with
      // today's evening trips on block 9331), today's only today's.
      const part = t => t.lastNight ? 'last' : t.tonight ? 'tonight' : 'today';
      let left = 0;
      for (let j = i; j < trips.length; j++) if (pending(trips[j], j) && dirOf(trips[j].t) === dir && part(trips[j].t) === part(x.t)) left++;
      const inService = !dayMode && (liveIdx >= 0 ? liveIdx === i : nowMin >= x.s && nowMin <= x.e);
      // The way a live bus is heading right now (green on its card).
      const cur = first && live && (inService || (liveIdx < 0 && canonDir(live.Direction) === dir));
      items.push({ blk, s: x.s, e: x.e, dir, left, inService, live: first ? live : null, cur, nth });
      first = false;
    });
  }
  // Strictly by start time, whatever the direction; trips leaving at the
  // same minute list WB/NB before EB/SB.
  const rank = d => /^(WB|NB)$/.test(dirShort(d)) ? 0 : /^(EB|SB)$/.test(dirShort(d)) ? 1 : 2;
  return items.sort((a, b) => a.s - b.s || rank(a.dir) - rank(b.dir) || a.e - b.e || a.blk.localeCompare(b.blk));
}

// The pick run on `blk` at service minute `min`: the piece covering it, else
// the last one to start before it, else the first.
function runOnBlockAt(blk, min) {
  const rec = paddle.byBlock.get(String(blk));
  const segs = rec && rec.segs ? rec.segs.filter(x => x.s != null) : [];
  if (!segs.length) return null;
  const cover = segs.find(x => x.s <= min && x.e != null && min < x.e);
  if (cover) return cover.run;
  const before = segs.filter(x => x.s <= min).sort((a, b) => b.s - a.s)[0];
  return (before || segs.slice().sort((a, b) => a.s - b.s)[0]).run;
}

// Every run on `blk` during [s, e): the one on it at the start, then any
// relief that takes over before the trip ends ("203 → 424").
function runsOnBlockDuring(blk, s, e) {
  const first = runOnBlockAt(blk, s);
  if (!first) return [];
  const rec = paddle.byBlock.get(String(blk));
  const later = (rec.segs || []).filter(x => x.s != null && x.s > s && x.s < e).sort((a, b) => a.s - b.s).map(x => x.run);
  return [first, ...later].filter((r, i, a) => a.indexOf(r) === i);
}

function dayLabelOf(day) { return day === 'saturday' ? 'Saturday' : day === 'sunday' ? 'Sunday' : 'Weekday'; }

// One All Trips scorecard: the Paddle App's card head (run number, day,
// PADDLE; this trip's times on the left and the run's routes on the
// right), the bus's location while it is live, then the trips still to do by
// that direction and the bus number.
const runKey = r => r.depot + '|' + r.runno;

function allTripsCardHtml(it, anim, idx) {
  const shown = ALL_TRIPS_PAGE && view.tsDay;
  const day = shown ? dayLabelOf(gtfsDayOf(view.tsDay)) : dayLabelOf(getDayType());
  const dayTxt = shown ? view.tsDay : day;
  // A relief during this trip shows both runs, in order: "203 → 424",
  // each number and its own PADDLE button opening that run's paddle.
  const runs = runsOnBlockDuring(it.blk, it.s, it.e);
  const two = runs.length > 1;
  // Each run's routes in paddle order, a two-route piece ("21-42") named by
  // the route it actually drives.
  const rtList = runs.length ? [...new Set(runs.flatMap(r => r.pieces.flatMap(pieceRoutes)))] : [];
  // All the run's routes stay listed; the one this trip runs (the route on
  // show) is marked - green when a live bus is on it, yellow by the schedule.
  const routes = PaTags.routeList(rtList.length ? rtList : [state.route], state.route, !!it.live && !it.done, sameRouteName);
  // Run number + day as ONE button opening that run's paddle ("452 WEEKDAY");
  // a relief shows "203" → "424 WEEKDAY", each opening its own paddle.
  const runBtn = (r, withDay) => {
    const inner = '<span class="prc-num">' + esc(r ? r.runno : '—') + '</span>' + (withDay ? '<span class="prc-day">' + esc(dayTxt) + '</span>' : '');
    return r && r.link ? '<a class="at-runbtn" href="' + esc(r.link) + '" target="_blank" rel="noopener">' + inner + '</a>'
                       : '<span class="at-runbtn nolink">' + inner + '</span>';
  };
  const nums = runs.length ? runs.map((r, i) => runBtn(r, i === runs.length - 1)).join('<span class="at-relief at-ico">➜</span>') : runBtn(null, true);
  // Where PADDLE was: this run's trips only, and the way back.
  let runf = '';
  if (view.run) runf = '<button type="button" class="at-runf on" data-run-filter="">' + (ALL_TRIPS_PAGE ? 'Show all runs' : 'Back to live') + '</button>';
  else if (runs.length) runf = '<button type="button" class="at-runf" data-run-filter="' + esc(runKey(runs[0])) + '">Run ' + esc(runs[0].runno) + ' only</button>';
  // The trip's number in its direction for the day ("#98"), before the run
  // number; on the live pages coloured by how the bus sits between its leader
  // and follower (it.tagCls). A bus on layover shows LAYOVER here instead.
  // "#39"; with the direction ("#39-EB") where both directions share the
  // list: Trip Sheets' Both view and a "Run 452 only" sheet.
  const withDir = view.run || (ALL_TRIPS_PAGE && !view.atDir);
  const numTag = (n, cls) => '<span class="at-nth' + (cls ? ' ' + cls : '') + '">#' + (n || '?') + (withDir ? '-' + esc(dirShort(it.dir)) : '') + '</span>';
  const nth = it.layover ? '<span class="at-nth lay">LAYOVER</span>' : (it.nth || it.liveView) ? numTag(it.nth, it.tagCls) : '';
  const tag = it.inService ? '<span class="at-tag now">IN SERVICE</span>' : '';
  let h = '<div class="prc day-' + day + (it.inService ? ' at-now' : '') + (it.done ? ' at-done' : '') + (anim ? ' fade-in' : '') + '" style="animation-delay:' + (idx * 0.015) + 's">';
  h += '<div class="prc-head"><div class="prc-head-top">' + nth + nums + '<div class="prc-actions">' + runf + '</div></div>';
  h += '<div class="prc-head-bottom"><span class="at-time">' + tag + fmtClock(it.s) + ' – ' + fmtClock(it.e) + '</span>' +
       '<div class="prc-routes">' + routes + '</div></div></div>';
  // Third line: where the bus is now — only while it is live.
  const lv = it.live;
  if (lv && lv.next_stop_name) {
    const late = parseInt(lv.late) || 0;
    const lt = late === 0 ? ['ontime', 'On Time'] : late < 0 ? ['early', Math.abs(late) + 'm early'] : [late < LATE_BAD ? 'mild' : 'bad', '+' + late + 'm late'];
    h += '<div class="at-loc"><span class="at-loc-txt"><span class="at-ico">➜</span> ' + esc(lv.next_stop_name) + '</span>' +
         (lv._notTracking ? '<span class="not-tracking-tag">NOT TRACKING</span>' : '<span class="late-tag ' + lt[0] + '">' + lt[1] + '</span>') + '</div>';
  }
  // On layover: where it is parked (anchor, not an arrow — it isn't moving),
  // and the countdown to its next scheduled departure → that trip's number.
  if (it.layover) {
    const at = layoverStop(it.blk, it.s);
    h += '<div class="at-loc lay"><span class="at-loc-txt">⚓ ' + esc(at || 'At terminal') + '</span>' +
         '<span class="at-next"><span class="at-due" data-due-ms="' + serviceMinToMs(it.s) + '">' + dueText(serviceMinToMs(it.s)) +
         '</span><span class="at-arrow at-ico">➜</span>' + numTag(it.nth, 'next') + '</span></div>';
  }
  // Trips still to do in this card's direction from here, then the bus.
  h += '<div class="at-trips">';
  h += it.done ? '<span class="at-dir done">DONE</span>'
               : '<span class="at-dir' + (it.cur ? ' cur' : '') + '">' + it.left + ' ' + esc(dirShort(it.dir)) + '</span>';
  const vRaw = it.vid != null ? String(it.vid) : lv ? String(lv.VehicleID || '').trim() : '';
  const vid = (vRaw && vRaw !== '0' ? vRaw : '') || knownVehicleFor(it.blk);
  const tip = it.ghost && vid ? ghostBusTip(it.blk, vid) : '';
  h += vid ? '<span class="at-bus' + (tip ? ' has-tip" tabindex="0" data-tip="' + esc(tip) : '') + '">' + ICONS.bus + ' ' + esc(vid) + '</span>'
           : '<span class="at-bus unknown">' + ICONS.bus + ' Bus# pending</span>';
  // Block tag: this trip's route / the block ("21/9605").
  h += PaTags.blockTag(state.route, it.blk);
  // Passenger load, far right — only while the bus is live.
  if (lv && !it.done) h += loadTagHtml(lv.estimated_seat_availability);
  return h + '</div></div>';
}

// Passenger load from the live feed (estimated_seat_availability), as a
// colour-coded tag for the card's bottom-right corner. No data → nothing.
const LOAD_INFO = {
  EMPTY:                      { t: 'Empty',      c: 'empty' },
  MANY_SEATS_AVAILABLE:       { t: 'Many', x: ' Seats', c: 'many' },
  FEW_SEATS_AVAILABLE:        { t: 'Few',  x: ' Seats', c: 'few' },
  STANDING_ROOM_ONLY:         { t: 'Standing',   c: 'standing' },
  CRUSHED_STANDING_ROOM_ONLY: { t: 'Crowded',    c: 'full' },
  FULL:                       { t: 'Full',       c: 'full' }
};
function loadTagHtml(v) {
  const s = LOAD_INFO[v];
  return s ? '<span class="at-load ' + s.c + '" title="Passenger load">' + ICONS.seat + ' ' + s.t + (s.x ? '<span class="ld-x">' + s.x + '</span>' : '') + '</span>' : '';
}


// Layover countdown to the next SCHEDULED departure: "12:05", "1:02:05",
// then "DUE +2:13" once the time has passed.
function dueText(dueMs) {
  const d = Math.round((dueMs - Date.now()) / 1000);
  const f = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
  return d > 0 ? f(d) : 'DUE +' + f(-d);
}

// ── LIVE DIRECTION PAGES ─────────────────────────────────────
// The two direction buttons show All Trips scorecards for the buses that
// matter right now in that direction:
//   • live buses on a trip, and ghosts (a trip that should be running but the
//     bus isn't online — gray tag);
//   • under them, buses on layover whose NEXT trip is this direction
//     (purple LAYOVER, countdown → next trip's number). A bus whose next trip
//     is on another route shows on that route's page instead.
// Smallest trip number on top; cards only swap when one bus actually passes
// another (stop position). Tag colour: green = between its leader and
// follower, red = its follower passed it, yellow = it passed its leader.
let lastRouteCards = [];  // every annotated card of the route, also during a search

// This block's trips on the partner routes ("21-42" pieces), as minutes.
// Where a bus on layover is parked: the last stop of the trip it finished
// before `nextS` (this route's, or a partner route's when it came over from
// there), else the first stop of its next trip.
function layoverStop(blk, nextS) {
  let best = null, first = '';
  const look = t => {
    const s = timeStrToMin(t.start), e = timeStrToMin(t.end);
    if (s === nextS && t.first) first = t.first;
    if (e != null && e <= nextS && t.last && (!best || e > best.e)) best = { e, last: t.last };
  };
  (sched.blockTrips.get(String(blk)) || []).forEach(look);
  for (const byBlk of (sched.partnerTT || new Map()).values()) (byBlk.get(String(blk)) || []).forEach(look);
  return best ? best.last : first;
}

function partnerTripsOf(blk) {
  const out = [];
  for (const byBlk of (sched.partnerTT || new Map()).values())
    for (const t of byBlk.get(String(blk)) || []) {
      const s = timeStrToMin(t.start), e = timeStrToMin(t.end);
      if (s != null && e != null) out.push({ s, e });
    }
  return out;
}

// The scheduled trip of this route a card is on (live/ghost) or due to run
// next (layover): { s, e, dir }.
function cardTrip(b) {
  const da = depArrOf(b);
  if (da.dep == null) return null;
  return { s: da.dep, e: da.arr, dir: canonDir(b.Direction) };
}

// Trips of `blk` on this route in `dir` from start minute `s` on.
function tripsLeftFrom(blk, dir, s) {
  const seen = new Set();
  const list = sched.blockTrips.get(String(blk)) || [];
  // Only the trips of the same run of the block: last night's leftovers
  // (midnight-4 AM) apart from today's, tonight's night liner apart too.
  const part = t => t.lastNight ? 'last' : t.tonight ? 'tonight' : 'today';
  const own = list.find(t => timeStrToMin(t.start) === s);
  for (const t of list) {
    const ts = timeStrToMin(t.start);
    if (ts == null || ts < s || isPhantomTrip(blk, ts) || tripDirOf(t) !== dir) continue;
    if (own && part(t) !== part(own)) continue;
    seen.add(ts);
  }
  return seen.size || 1;
}

// For a ghost that still has a bus number: when that bus was seen on the
// block tonight, from the live-feed sightings —
//   "3644 first appeared on 9902 at 12:53 AM in SEPTA's live feed, on the
