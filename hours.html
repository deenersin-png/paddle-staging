<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --ink:#0a0b0d; --ink2:#13151a; --ink3:#1d2028;
  --line:rgba(255,255,255,0.07); --line2:rgba(255,255,255,0.13); --line3:rgba(255,255,255,0.22);
  --dim:#4a4f5e; --mid:#8a909f; --text:#c8cdd8; --bright:#e8ecf4;
  --amber:#f5a623; --amber-dim:rgba(245,166,35,0.12);
  --green:#3dd68c; --blue:#4d9fff; --red:#ff6b6b; --violet:#a78bfa;
  --sans:'IBM Plex Sans Condensed',sans-serif; --mono:'IBM Plex Mono',monospace;
}
html{font-size:16px}
body{background:var(--ink);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:1000}

header{background:var(--ink2);border-bottom:1px solid var(--line2);padding:12px 16px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:200;justify-content:space-between}
.hd-left{display:flex;align-items:center;gap:12px;min-width:0}
.hd-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);opacity:.7;animation:pulse 2.5s ease-in-out infinite;flex:0 0 8px}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.3}}
.hd-title{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--bright)}
.hd-sub{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-sub a{color:var(--dim);text-decoration:none}.hd-sub a:hover{color:var(--amber)}

.wrap{max-width:860px;margin:0 auto;padding:16px}
.gate{border:1px solid var(--line);border-radius:4px;background:var(--ink2);padding:22px 18px;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--mid);line-height:1.7}
.gate a{color:var(--amber)}
[hidden]{display:none!important}

.wk-btn{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;background:none;border:1px solid var(--line2);border-radius:4px;color:var(--mid);padding:8px 14px;cursor:pointer;line-height:1}
.wk-btn:hover{color:var(--amber);border-color:var(--line3)}

.hint{font-family:var(--sans);font-size:12px;color:var(--dim);line-height:1.5;margin-top:10px}
.lookup{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:5px;line-height:1.5;min-height:16px}
.lookup.ok{color:var(--green)}.lookup.warn{color:var(--amber)}
.check{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--mid);margin:12px 0;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--amber)}
.form-row{display:flex;gap:8px;flex-wrap:wrap}
.form-row > *{flex:1 1 100px}
.pay{font-family:var(--mono);font-size:12px;color:var(--mid);margin:10px 0}
.pay b{color:var(--amber)}
.extra-row{display:grid;grid-template-columns:auto 84px auto 1fr auto;gap:8px;align-items:center}
.extra-k{font-family:var(--mono);font-size:11px;color:var(--text);white-space:nowrap}
.extra-u{font-family:var(--mono);font-size:10px;color:var(--dim)}
.extra-in{padding:8px 9px}.extra-note{padding:8px 9px;font-size:13px}

@media (max-width:560px){
  .extra-row{grid-template-columns:auto 70px auto auto;grid-template-areas:"k in u rm" "note note note note"}
  .extra-note{grid-area:note}
}
</style>
<link rel="stylesheet" href="assets/pa-theme.css">
<link rel="stylesheet" href="assets/pa-menu.css">
<script src="assets/pa-menu.js" defer></script>
</head>
<body>

<header>
  <div class="hd-left">
    <div class="hd-dot"></div>
    <div>
      <div class="hd-title">WEEKLY HOURS</div>
      <span id="hd-ctx" hidden></span>
    </div>
  </div>
  <div id="pa-slot"></div>
</header>

<div class="wrap">
  <div class="pa-sync" id="sync-line" hidden></div>
  <div class="gate" id="gate-out">Sign in to see your weekly hours.<br>They follow you to every device.</div>
  <div class="gate" id="gate-setup" hidden>Finish setting up your account on <a href="home.html">My run</a> — depot, runs and vacation.</div>
  <div class="gate" id="gate-retry" hidden>
    <span id="gate-retry-text">Can't reach the server to load your account.</span><br>
    Check your signal, then try again.
    <br><button class="wk-btn" id="gate-retry-btn" type="button" style="margin-top:12px">TRY AGAIN</button>
  </div>

  <section id="view" hidden></section>
</div>

<script>
// If this page's modules fail to link - an update landed and the browser
// mixed old and new files - reload once to fetch a consistent set, and if
// that doesn't fix it, say so instead of leaving a blank screen.
window.addEventListener('error', function (e) {
  var m = String((e && (e.message || (e.error && e.error.message))) || '');
  if (!/does not provide an export|doesn't provide an export|Importing binding name|Importing a module script failed|dynamically imported module/i.test(m)) return;
  var again = false;
  try { again = !!sessionStorage.getItem('pa_update_reload'); sessionStorage.setItem('pa_update_reload', '1'); } catch (_) {}
  if (!again) { location.reload(); return; }
  var w = document.querySelector('.wrap');
  if (w) w.innerHTML = '<div class="gate">The app was just updated and this page could not finish loading.<br>Close this tab and open the app again.</div>';
}, true);
</script>
<script type="module" src="assets/pa-account-ui.js"></script>
<script type="module">
import * as S from './assets/pa-schedule.js';
import * as A from './assets/pa-assignments.js';
import * as E from './assets/pa-edit-sheet.js';
import * as HV from './assets/pa-hours-view.js';
import { loadProfile, loadProfileSafe, ensureUser } from './assets/pa-store.js';

const $ = id => document.getElementById(id);

const ctx = { user: null, profile: null, subscribed: false, authToken: 0, drawnVersion: -1, redrawTimer: null };
const week = HV.mount($('view'), { getProfile: () => ctx.profile });

function showOnly(id) { ['gate-out', 'gate-retry', 'gate-setup', 'view'].forEach(x => { $(x).hidden = x !== id; }); }

window.addEventListener('pa:auth', e => {
  ctx.user = e.detail.user;
  if (!ctx.user) {
    ctx.authToken++;
    A.detach(); ctx.profile = null;
    showOnly('gate-out'); $('hd-ctx').textContent = ''; renderSyncLine();
    return;
  }
  start();
});
$('gate-retry-btn').addEventListener('click', () => start());

async function start() {
  const token = ++ctx.authToken;
  ensureUser(ctx.user.uid);
  // Same rule as My run: a slow or failed read uses this device's copy and
  // is never mistaken for an account without a depot.
  const res = await loadProfileSafe();
  if (token !== ctx.authToken) return;
  ctx.profile = res.profile;
  if (!ctx.profile) {
    if (res.source === 'server') { showOnly('gate-setup'); return; }
    $('gate-retry-text').textContent = 'Can’t load your account right now (' + res.error + ').';
    showOnly('gate-retry');
    return;
  }
  if (!ctx.profile.depotKey) { showOnly('gate-setup'); return; }
  await boot();
  if (res.source === 'device') {
    loadProfile().then(p => { if (p && token === ctx.authToken) { ctx.profile = p; E.configure({ profile: p }); renderWeek(); } }).catch(() => {});
  }
}

function renderSyncLine() { E.renderSync($('sync-line'), A.getState(), () => A.retryNow()); }

async function boot() {
  $('hd-ctx').textContent = ' · ' + (ctx.profile.depotLabel || ctx.profile.depotKey);
  E.configure({ profile: ctx.profile, onSaved: () => renderWeek() });
  // Holidays arrive in the background; the week renders from the
  // operator's own schedule without waiting for them.
  S.loadCalendarOverrides().then(ov => week.setOverrides(ov)).catch(() => {});
  if (!ctx.subscribed) {
    ctx.subscribed = true;
    A.onChange(() => {
      renderSyncLine();
      if (A.getState().version === ctx.drawnVersion) return;   // connection-only update
      clearTimeout(ctx.redrawTimer);
      ctx.redrawTimer = setTimeout(() => { ctx.drawnVersion = A.getState().version; renderWeek(); }, 150);
    });
  }
  showOnly('view');
  await A.attach(ctx.user.uid);
  renderSyncLine();
  ctx.drawnVersion = A.getState().version;
  renderWeek();
}

function renderWeek() { return week.render(); }

window.PA_HOURS = { S, A, E, ctx, week, renderWeek };
// Modules linked fine: allow a future update to trigger one reload again.
try { sessionStorage.removeItem('pa_update_reload'); } catch (_) {}
</script>
</body>
</html>
