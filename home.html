<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Run</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --ink:#0a0b0d; --ink2:#13151a; --ink3:#1d2028;
  --line:rgba(255,255,255,0.07); --line2:rgba(255,255,255,0.13); --line3:rgba(255,255,255,0.22);
  --dim:#4a4f5e; --mid:#8a909f; --text:#c8cdd8; --bright:#e8ecf4;
  --amber:#f5a623; --amber-dim:rgba(245,166,35,0.12);
  --green:#3dd68c; --green-dim:rgba(61,214,140,0.1);
  --blue:#4d9fff; --blue-dim:rgba(77,159,255,0.1);
  --red:#ff6b6b; --red-dim:rgba(255,107,107,0.1);
  --violet:#a78bfa; --violet-dim:rgba(167,139,250,0.1);
  --sans:'IBM Plex Sans Condensed',sans-serif; --mono:'IBM Plex Mono',monospace;
}
html{font-size:16px}
body{background:var(--ink);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:1000}

header{background:var(--ink2);border-bottom:1px solid var(--line2);padding:12px 16px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:200;justify-content:space-between}
.hd-left{display:flex;align-items:center;gap:12px;min-width:0}
.hd-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);opacity:.7;animation:pulse 2.5s ease-in-out infinite;flex:0 0 8px}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.3}}
.hd-title{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--bright)}
.hd-sub{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-sub a{color:var(--dim);text-decoration:none}.hd-sub a:hover{color:var(--amber)}

.tabs{display:flex;gap:6px;padding:12px 16px 0;max-width:860px;margin:0 auto}
.tab{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;padding:9px 16px;background:none;border:1px solid var(--line);border-radius:4px;color:var(--dim);cursor:pointer}
.tab:hover{color:var(--mid)}.tab.on{color:var(--amber);border-color:rgba(245,166,35,.35);background:var(--amber-dim)}

.wrap{max-width:860px;margin:0 auto;padding:16px}
[hidden]{display:none!important}

.gate{border:1px solid var(--line);border-radius:4px;background:var(--ink2);padding:22px 18px;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--mid);line-height:1.7}
.gate .pa-submit,.gate .pa-select,.gate .pa-seg{margin-top:12px;text-align:left}

.card{border:1px solid var(--line);border-radius:4px;background:var(--ink2);padding:16px;margin-bottom:12px}
.k{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.cd-phase{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.cd-digits{font-family:var(--mono);font-size:56px;font-weight:600;letter-spacing:.02em;color:var(--bright);line-height:1.1;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.cd-digits.soon{color:var(--amber)}
.cd-digits.now{color:var(--red)}
.cd-at{font-family:var(--mono);font-size:13px;color:var(--text);letter-spacing:.02em}
.cd-place{font-family:var(--sans);font-size:14px;color:var(--mid);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;padding:6px 10px;border-radius:3px;border:1px solid var(--line2);color:var(--mid);background:var(--ink3)}
.chip.amber{color:var(--amber);border-color:rgba(245,166,35,.35);background:var(--amber-dim)}
.chip.blue{color:var(--blue);border-color:rgba(77,159,255,.35);background:var(--blue-dim)}
.chip.violet{color:var(--violet);border-color:rgba(167,139,250,.35);background:var(--violet-dim)}
.chip.red{color:var(--red);border-color:rgba(255,107,107,.35);background:var(--red-dim)}
.chip.green{color:var(--green);border-color:rgba(61,214,140,.35);background:var(--green-dim)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:12px}
.stat{background:var(--ink);padding:10px 12px}
.stat .v{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text);margin-top:3px}
.stat .v.pay{color:var(--amber)}
.pieces{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.piece{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--ink)}
.piece.cur{border-color:rgba(245,166,35,.35);background:var(--amber-dim)}
.piece .r{color:var(--amber);font-weight:600}.piece .b{color:var(--mid)}.piece .t{color:var(--text);white-space:nowrap}
.piece .t .ty{color:var(--dim);font-size:10px;margin:0 3px}

.leader{border-color:var(--line);opacity:.92}
.leader .k{color:var(--dim)}
.leader-line{font-family:var(--mono);font-size:12px;color:var(--text);margin-top:8px;line-height:1.6}
.leader-note{font-family:var(--sans);font-size:11px;color:var(--dim);margin-top:6px}

.meta{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--dim);text-align:center;margin-top:8px;line-height:1.8}

.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.form-row > *{flex:1 1 160px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.dchip{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;padding:9px 0;flex:1 1 0;min-width:40px;text-align:center;background:var(--ink);border:1px solid var(--line2);border-radius:4px;color:var(--dim);cursor:pointer}
.dchip.on{color:var(--amber);border-color:rgba(245,166,35,.35);background:var(--amber-dim)}
.lookup{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:5px;line-height:1.5;min-height:16px}
.lookup.ok{color:var(--green)}.lookup.warn{color:var(--amber)}
.preview{margin-top:12px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.row{display:grid;grid-template-columns:92px 1fr auto auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;background:var(--ink)}
.row:last-child{border-bottom:none}
.row.today{background:var(--amber-dim)}
.row .d{color:var(--bright);font-weight:600}.row .d small{display:block;color:var(--dim);font-weight:400;font-size:10px}
.row .run{color:var(--text)}.row .run.off{color:var(--dim)}
.row .t{color:var(--mid);white-space:nowrap}
.badge{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid var(--line2);color:var(--dim)}
.badge.pattern{color:var(--blue);border-color:rgba(77,159,255,.35)}
.badge.manual{color:var(--green);border-color:rgba(61,214,140,.35)}
.badge.edit{color:var(--violet);border-color:rgba(167,139,250,.35)}
.badge.holiday{color:var(--amber);border-color:rgba(245,166,35,.35)}
.rowbtn{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:6px 10px;background:none;border:1px solid var(--line2);border-radius:3px;color:var(--mid);cursor:pointer}
.rowbtn:hover{color:var(--amber);border-color:var(--line3)}
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.wk-label{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--bright)}
.wk-row{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.wk-row:last-child{border-bottom:none}
.wk-row .d{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--bright);padding-top:11px}
.wk-row .d small{display:block;color:var(--dim);font-weight:400;font-size:10px}
.wk-row.hol .d{color:var(--amber)}
.check{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--mid);margin:12px 0;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--amber)}
.msgline{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:8px;min-height:16px}
.msgline.ok{color:var(--green)}.msgline.err{color:var(--red)}
.hint{font-family:var(--sans);font-size:12px;color:var(--dim);line-height:1.5;margin-top:6px}
.pay{font-family:var(--mono);font-size:12px;color:var(--mid);margin:10px 0}
.pay b{color:var(--amber)}
.sect{margin-bottom:12px}
h2.k{margin-bottom:10px}

@media (max-width:640px){
  .cd-digits{font-size:44px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:78px 1fr auto;grid-template-areas:"d run b" "d t b"}
  .row .d{grid-area:d}.row .run{grid-area:run}.row .t{grid-area:t}.row .acts{grid-area:b}
}
</style>
</head>
<body>

<header>
  <div class="hd-left">
    <div class="hd-dot"></div>
    <div>
      <div class="hd-title">MY RUN</div>
      <div class="hd-sub"><a href="./">&larr; Paddle App</a> <span id="hd-ctx"></span></div>
    </div>
  </div>
  <div id="pa-slot"></div>
</header>

<nav class="tabs" id="tabs" hidden>
  <button class="tab on" data-view="today" type="button">TODAY</button>
  <button class="tab" data-view="schedule" type="button">SCHEDULE</button>
  <button class="tab" data-view="alerts" type="button">ALERTS</button>
</nav>

<div class="wrap">
  <div class="gate" id="gate-out">Sign in to see your next run.<br>Your schedule follows you to every device.</div>

  <div class="gate" id="gate-setup" hidden>
    Tell the app where you work and what kind of driver you are.
    <div style="text-align:left;margin-top:14px">
      <label class="pa-label">Home depot</label>
      <select class="pa-select" id="setup-depot"></select>
      <label class="pa-label" style="margin-top:12px">Driver type</label>
      <div class="pa-seg" id="setup-type"></div>
      <button class="pa-submit" id="setup-save" type="button">Save</button>
      <div class="msgline" id="setup-msg"></div>
    </div>
  </div>

  <section id="view-today" hidden>
    <div id="today-body"></div>
    <div class="meta" id="meta"></div>
  </section>

  <section id="view-schedule" hidden>
    <div class="card sect" id="sch-form"></div>
    <div class="card sect">
      <h2 class="k">Next 4 weeks</h2>
      <div class="preview" id="sch-list"></div>
      <div class="hint">Tap EDIT on any day to change the run, mark it off, or record a holiday or overtime. Past days are editable too.</div>
    </div>
  </section>

  <section id="view-alerts" hidden>
    <div class="card sect" id="alerts-body"></div>
  </section>
</div>

<script type="module" src="assets/pa-account-ui.js"></script>
<script type="module">
import * as S from './assets/pa-schedule.js';
import * as A from './assets/pa-assignments.js';
import { computeState, phaseLabel } from './assets/pa-countdown.js';
import * as L from './assets/pa-live.js';
import { loadProfile, saveProfile, ensureUser } from './assets/pa-store.js';
import * as N from './assets/pa-notify.js';
import * as E from './assets/pa-edit-sheet.js';

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const DRIVER_TYPES = [['regular','REGULAR'],['relief','RELIEF'],['slate','SLATE']];

const ctx = {
  user: null, profile: null, overrides: {}, gtfs: {}, view: 'today',
  current: null,                 // { mode:'live'|'next'|'none', date, r, run, st, nowMin }
  trips: new Map(),              // date -> Map(block -> trips[])
  tickTimer: null, leaderTimer: null, wakeLock: null,
  runCache: new Map(), weekCursor: null, districts: [], seasonLabel: ''
};

// ---- helpers --------------------------------------------------------------

async function slugForDate(depotKey, iso) { return E.slugForDate(depotKey, iso); }

/** Normalised run for a resolved day (shared with hours.html). */
async function runFor(r, iso) { return E.runFor(r, iso, ctx.profile && ctx.profile.depotKey); }

function fmtCountdown(ms) {
  const neg = ms < 0; let s = Math.floor(Math.abs(ms) / 1000);
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  const core = (d ? d + 'd ' : '') + (d || h ? S.pad2(h) + ':' : '') + S.pad2(m) + ':' + S.pad2(s);
  return (neg ? '-' : '') + core;
}

function findNext(fromIso, days) {
  for (let i = 0; i <= days; i++) {
    const d = S.addDays(fromIso, i);
    const r = A.resolve(d, ctx.overrides);
    if (!r.off && r.runNo) return { date: d, r };
  }
  return null;
}

// ---- boot / auth ----------------------------------------------------------

function showOnly(id) {
  ['gate-out', 'gate-setup', 'view-today', 'view-schedule', 'view-alerts'].forEach(x => { $(x).hidden = x !== id; });
  $('tabs').hidden = !(id === 'view-today' || id === 'view-schedule' || id === 'view-alerts');
}
function setView(v) {
  ctx.view = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === v));
  showOnly(v === 'today' ? 'view-today' : v === 'alerts' ? 'view-alerts' : 'view-schedule');
  if (v === 'schedule') renderSchedule();
  if (v === 'alerts') renderAlerts();
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setView(t.dataset.view)));

window.addEventListener('pa:auth', async e => {
  ctx.user = e.detail.user;
  stopTimers();
  if (!ctx.user) { A.detach(); N.detach(); ctx.profile = null; showOnly('gate-out'); $('hd-ctx').textContent = ''; return; }
  ensureUser(ctx.user.uid);
  try { ctx.profile = await loadProfile(); } catch (err) { ctx.profile = null; }
  if (!ctx.profile || !ctx.profile.depotKey || !ctx.profile.driverType) { await renderSetup(); showOnly('gate-setup'); return; }
  await boot();
});

async function boot() {
  const today = S.todayIso();
  const [ov, gtfs, seasonInfo] = await Promise.all([
    S.loadCalendarOverrides(), S.loadGtfsManifest(), slugForDate(ctx.profile.depotKey, today)
  ]);
  ctx.overrides = ov || {}; ctx.gtfs = gtfs || {};
  ctx.seasonLabel = seasonInfo.season ? seasonInfo.season.label : 'no season';
  $('hd-ctx').textContent = ' · ' + (ctx.profile.depotLabel || ctx.profile.depotKey) + ' · ' + ctx.seasonLabel;
  await A.attach(ctx.user.uid);
  if (!ctx.subscribed) {
    ctx.subscribed = true;
    A.onChange(() => { refreshToday(); if (ctx.view === 'schedule') renderSchedule(); });
  }
  N.attach(ctx.user.uid).catch(() => {});
  N.registerSW();
  setView('today');
  await refreshToday();
}

// ---- setup (no depot / driver type yet) -----------------------------------

async function renderSetup() {
  const sel = $('setup-depot'); sel.textContent = '';
  let districts = [];
  try {
    const seasons = await S.loadSeasons(); const season = S.seasonFor(seasons, S.todayIso());
    districts = season ? await S.loadManifest(season) : [];
  } catch (_) {}
  const seen = new Map();
  districts.forEach(d => { const k = S.depotKeyOf(d.name); if (!seen.has(k)) seen.set(k, d.label || d.name); });
  if (!seen.size) [['callowhillb','Callowhill Bus'],['allegheny','Allegheny'],['victory','Victory Bus'],['frontier','Frontier'],['southern','Southern'],['elmwood','Elmwood'],['comly','Comly'],['frankfordb','Frankford Bus'],['frankford-rail','Frankford Rail'],['midvale','Midvale']].forEach(([k,l]) => seen.set(k,l));
  for (const [k, l] of seen) { const o = el('option', null, l); o.value = k; if (ctx.profile && ctx.profile.depotKey === k) o.selected = true; sel.appendChild(o); }
  const seg = $('setup-type'); seg.textContent = '';
  let dt = (ctx.profile && ctx.profile.driverType) || 'regular';
  DRIVER_TYPES.forEach(([id, label]) => {
    const b = el('button', 'pa-seg-btn' + (id === dt ? ' pa-on' : ''), label); b.type = 'button';
    b.addEventListener('click', () => { dt = id; [...seg.children].forEach(c => c.classList.remove('pa-on')); b.classList.add('pa-on'); });
    seg.appendChild(b);
  });
  $('setup-save').onclick = async () => {
    const btn = $('setup-save'); btn.disabled = true; $('setup-msg').textContent = 'Saving…'; $('setup-msg').className = 'msgline';
    try {
      const opt = sel.selectedOptions[0];
      await saveProfile({ ...(ctx.profile || {}), email: ctx.user.email || '',
        displayName: (ctx.profile && ctx.profile.displayName) || ctx.user.displayName || '',
        badgeNumber: (ctx.profile && ctx.profile.badgeNumber) || '',
        driverType: dt, depotKey: sel.value, depotLabel: opt ? opt.textContent : '',
        createdAt: ctx.profile && ctx.profile.createdAt });
      ctx.profile = await loadProfile();
      await boot();
    } catch (err) { $('setup-msg').textContent = 'Could not save: ' + (err.code || err.message); $('setup-msg').className = 'msgline err'; }
    btn.disabled = false;
  };
}

// ---- TODAY ----------------------------------------------------------------

function tripsFor(iso) { return ctx.trips.get(iso) || new Map(); }

async function refreshToday() {
  if (!ctx.user || !A.isAttached()) return;
  const today = S.todayIso(), yday = S.addDays(today, -1);
  const nowM = S.nowMinutes();
  const SKIP = ['done', 'before_report', 'before_pullout', 'unknown', 'none'];
  let chosen = null;

  // 1. Yesterday's run, if it is still going past midnight (owl / late runs).
  const ry = A.resolve(yday, ctx.overrides);
  if (!ry.off && ry.runNo) {
    const run = await runFor(ry, yday);
    if (run) {
      const nowMin = nowM + 1440;
      const st = computeState({ run, nowMin, tripsByBlock: tripsFor(yday) });
      if (!SKIP.includes(st.phase)) chosen = { mode: 'live', date: yday, r: ry, run, st, nowMin };
    }
  }
  // 2. Today's run.
  if (!chosen) {
    const rt = A.resolve(today, ctx.overrides);
    if (!rt.off && rt.runNo) {
      const run = await runFor(rt, today);
      if (!run) chosen = { mode: 'unknown', date: today, r: rt };
      else chosen = { mode: 'live', date: today, r: rt, run, st: computeState({ run, nowMin: nowM, tripsByBlock: tripsFor(today) }), nowMin: nowM };
    }
  }
  // 3. Nothing today, or done for today -> the next registered day.
  if (!chosen || (chosen.mode === 'live' && chosen.st.phase === 'done')) {
    const doneToday = chosen;
    const nx = findNext(S.addDays(today, 1), 21);
    chosen = nx
      ? { mode: 'next', date: nx.date, r: nx.r, run: await runFor(nx.r, nx.date), doneToday }
      : { mode: 'none', date: today, r: A.resolve(today, ctx.overrides), doneToday };
  }

  ctx.current = chosen;
  renderToday();
  startTicker();
  planAlerts();
  if (chosen.mode === 'live') { ensureTrips(chosen); refreshLeader(); }
}

async function ensureTrips(c) {
  if (!c.run || c.run.synthetic || ctx.trips.has(c.date)) return;
  const m = new Map();
  ctx.trips.set(c.date, m);                    // reserve so we don't double-load
  await Promise.all(c.run.pieces.map(async p => {
    try { m.set(p.block, await S.blockTrips(p.block, p.routes, c.run.dayType)); }
    catch (_) { m.set(p.block, []); }
  }));
  recompute();
}

function recompute() {
  const c = ctx.current;
  if (!c || c.mode !== 'live' || !c.run) return;
  const offset = c.date === S.todayIso() ? 0 : 1440;
  c.nowMin = S.nowMinutes() + offset;
  const st = computeState({ run: c.run, nowMin: c.nowMin, tripsByBlock: tripsFor(c.date) });
  const changed = !c.st || st.phase !== c.st.phase || st.targetMin !== c.st.targetMin;
  c.st = st;
  if (st.phase === 'done') { refreshToday(); return; }
  if (changed) { renderToday(); refreshLeader(); }
  planAlerts();
}

function stopTimers() {
  clearInterval(ctx.tickTimer); ctx.tickTimer = null;
  clearInterval(ctx.leaderTimer); ctx.leaderTimer = null;
  if (ctx.wakeLock) { try { ctx.wakeLock.release(); } catch (_) {} ctx.wakeLock = null; }
}
function startTicker() {
  clearInterval(ctx.tickTimer);
  let n = 0;
  ctx.tickTimer = setInterval(() => { tick(); if (++n % 20 === 0) recompute(); }, 1000);
  tick();
}

function targetMs() {
  const c = ctx.current;
  if (!c) return null;
  if (c.mode === 'live' && c.st && c.st.targetMin != null) return S.minToMs(c.date, c.st.targetMin);
  if (c.mode === 'next' && c.run && c.run.reportMin != null) return S.minToMs(c.date, c.run.reportMin);
  return null;
}

function tick() {
  const d = $('cd-digits'); if (!d) return;
  const t = targetMs(); if (t == null) { d.textContent = '—'; return; }
  const ms = t - Date.now();
  d.textContent = fmtCountdown(ms);
  d.classList.toggle('soon', ms > 0 && ms <= 5 * 60000);
  d.classList.toggle('now', ms <= 0);
  if (ms < -1500 && !ctx.refreshing) {
    ctx.refreshing = true;
    const p = ctx.current && ctx.current.mode === 'live' ? Promise.resolve(recompute()) : refreshToday();
    Promise.resolve(p).finally(() => { ctx.refreshing = false; });
  }
}

// Keep the screen on during a layover countdown (Safari 18.4+ / Chrome).
async function wakeLock(on) {
  try {
    if (on && !ctx.wakeLock && navigator.wakeLock && document.visibilityState === 'visible') {
      ctx.wakeLock = await navigator.wakeLock.request('screen');
      ctx.wakeLock.addEventListener('release', () => { ctx.wakeLock = null; });
    } else if (!on && ctx.wakeLock) { await ctx.wakeLock.release(); ctx.wakeLock = null; }
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { recompute(); refreshToday(); refreshLeader(); }
});

        const t = el('span', 't'); t.innerHTML = '<span class="ty">' + esc(p.startType) + '</span>' + esc(S.fmtClock(p.startMin)) + ' → <span class="ty">' + esc(p.endType) + '</span>' + esc(S.fmtClock(p.endMin));

function metaLine() {
  const gv = ctx.gtfs && ctx.gtfs.gtfs_version ? 'GTFS ' + ctx.gtfs.gtfs_version : 'GTFS unavailable';
  const stale = ctx.gtfs && ctx.gtfs.feed_end && ctx.gtfs.feed_end < S.todayIso().replace(/-/g, '') ? ' · FEED EXPIRED' : '';
  return ctx.seasonLabel + ' · ' + (ctx.profile ? (ctx.profile.depotLabel || ctx.profile.depotKey) : '') + ' · ' + gv + stale;
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---- leader (informational) ----------------------------------------------

async function refreshLeader() {
  const c = ctx.current, line = $('leader-line');
  if (!line || !c || c.mode !== 'live' || !c.st || !c.st.piece) return;
  const p = c.st.piece;
  const mine = tripsFor(c.date).get(p.block);
  if (!mine) { line.textContent = 'Loading your block’s trips…'; return; }
  if (!mine.length) { line.textContent = 'No GTFS trips found for block ' + p.block + ' on ' + p.routeLabel + ' — leader unknown.'; return; }
  try {
    const all = await S.routeTrips(p.routes, c.run.dayType);
    const lb = S.leaderBlock(all, p.block, c.nowMin);
    if (!lb) { line.textContent = 'No bus is scheduled ahead of you in this direction.'; return; }
    line.textContent = 'Block ' + lb.block + ' · scheduled out ' + S.fmtClock(lb.trip.s) + ' · checking live…';
    const v = await L.vehicleForBlock(p.routes, lb.block);
    line.textContent = (v ? '' : 'Leader block ' + lb.block + ': ') + L.describe(v);
  } catch (_) { line.textContent = 'Live lookup failed — no leader data right now.'; }
  clearInterval(ctx.leaderTimer);
  ctx.leaderTimer = setInterval(() => { if (document.visibilityState === 'visible') refreshLeader(); }, 30000);
}

  const body = $('alerts-body'); body.textContent = '';

  const permTxt = sup.permission === 'granted' ? 'allowed'

  test.addEventListener('click', async () => {
    const ok = await N.show('Paddle App', 'Alerts are working. A departure alert looks like this.', 'pa-test');
    test.textContent = ok ? 'Sent ✓' : 'Could not send — allow notifications first';
    setTimeout(() => { test.textContent = 'Send a test alert'; }, 2500);
  });

  body.appendChild(el('div', 'hint', 'Alerts fire while this page is open or in the background. If the app is fully closed nothing fires — that needs push notifications, which come later. The alert time is the scheduled time; it never moves with the bus ahead of you.'));
}

  renderUpcoming();

function lookupLine(node, dayType, runNo, iso) {

}

function renderRegularForm(form) {
  const st = A.getState();
  const today = S.todayIso();
  const cur = A.activePattern(st.patterns, today);
  form.appendChild(el('h2', 'k', 'My pick'));
  if (cur) {
    const days = Object.keys(cur.days || {}).map(Number).sort();
    const desc = days.map(i => S.DAY_SHORT[i] + ' ' + ((cur.days[String(i)] && cur.days[String(i)].runNo) || (cur.runByDayType && cur.runByDayType[i === 0 ? 'sunday' : i === 6 ? 'saturday' : 'weekday']) || '?')).join(' \u00b7 ');
    form.appendChild(el('div', 'hint', 'Current: ' + (cur.preset || 'custom') + ' \u00b7 ' + desc + ' \u00b7 since ' + S.fmtDate(cur.effectiveFrom)));
  } else {
    form.appendChild(el('div', 'hint', 'Enter your pick once. Every day from the pick start date fills in by itself, and the app already knows each run\u2019s hours.'));
  }

  let preset = (cur && cur.preset && A.PRESETS[cur.preset]) ? cur.preset : '5-day';
  let days = new Set(cur && cur.days ? Object.keys(cur.days).map(Number) : A.PRESETS[preset].days);
  const runs = {};                         // day index -> run number
  if (cur && cur.days) Object.keys(cur.days).forEach(i => { const slot = cur.days[i] || {}; runs[i] = slot.runNo || (cur.runByDayType && cur.runByDayType[+i === 0 ? 'sunday' : +i === 6 ? 'saturday' : 'weekday']) || ''; });
  let sameWeekday = true;
  {
    const wk = [1, 2, 3, 4, 5].filter(i => days.has(i)).map(i => runs[i] || '');
    sameWeekday = wk.every(v => v === wk[0]);
  }

  const presetWrap = el('div', 'pa-field'); presetWrap.style.marginTop = '12px';
  presetWrap.appendChild(el('label', 'pa-label', 'Pattern'));
  const seg = el('div', 'pa-seg');
  Object.entries(A.PRESETS).forEach(([id, p]) => {
    const b = el('button', 'pa-seg-btn' + (id === preset ? ' pa-on' : ''), p.label); b.type = 'button';
    b.addEventListener('click', () => { preset = id; days = new Set(p.days); [...seg.children].forEach(c => c.classList.remove('pa-on')); b.classList.add('pa-on'); drawDays(); drawRuns(); });
    seg.appendChild(b);
  });
  presetWrap.appendChild(seg); form.appendChild(presetWrap);

  const dWrap = el('div', 'pa-field'); dWrap.appendChild(el('label', 'pa-label', 'Work days (tap to change)'));
  const dRow = el('div', 'days'); dWrap.appendChild(dRow); form.appendChild(dWrap);
  function drawDays() {
    dRow.textContent = '';
    for (let i = 0; i < 7; i++) {
      const b = el('button', 'dchip' + (days.has(i) ? ' on' : ''), S.DAY_SHORT[i].toUpperCase()); b.type = 'button';
      b.addEventListener('click', () => { days.has(i) ? days.delete(i) : days.add(i); drawDays(); drawRuns(); });
      dRow.appendChild(b);
    }
  }

  const sameWrap = el('label', 'check');
  const sameCb = el('input'); sameCb.type = 'checkbox'; sameCb.checked = sameWeekday;
  sameCb.addEventListener('change', () => { sameWeekday = sameCb.checked; drawRuns(); });
  sameWrap.append(sameCb, document.createTextNode('Same run every weekday'));
  form.appendChild(sameWrap);

  const rWrap = el('div'); form.appendChild(rWrap);
  const dayTypeOf = i => (i === 0 ? 'sunday' : i === 6 ? 'saturday' : 'weekday');
  function runField(label, dt, get, set) {
    const f = el('div', 'pa-field');
    f.appendChild(el('label', 'pa-label', label));
    const i = el('input', 'pa-input'); i.type = 'text'; i.inputMode = 'numeric'; i.maxLength = 4; i.placeholder = 'e.g. 209'; i.value = get() || '';
    const lk = el('div', 'lookup');

    f.appendChild(i); f.appendChild(lk);
    if (get()) lookupLine(lk, dt, get());
    return f;
  }
  function drawRuns() {
    rWrap.textContent = '';
    const wk = [1, 2, 3, 4, 5].filter(i => days.has(i));
    if (sameWeekday && wk.length) {
      rWrap.appendChild(runField('Weekday run # (' + wk.map(i => S.DAY_SHORT[i]).join(', ') + ')', 'weekday',
        () => runs[wk[0]] || '', v => wk.forEach(i => { runs[i] = v; })));
    } else {
      wk.forEach(i => rWrap.appendChild(runField(S.DAY_NAMES[i] + ' run #', 'weekday', () => runs[i] || '', v => { runs[i] = v; })));
    }

function renderWeekForm(form) {

  const nav = el('div', 'week-nav'); nav.style.marginTop = '12px';

  slugForDate(ctx.profile.depotKey, ws).then(({ slug }) => slug ? S.loadReliefPackages(slug) : new Map()).then(pk => {
    if (!pk || !pk.size || !isRelief) return;
    pkgWrap.appendChild(el('label', 'pa-label', 'Fill from relief package'));
    const sel = el('select', 'pa-select'); const o0 = el('option', null, 'Choose a package…'); o0.value = ''; sel.appendChild(o0);
    for (const [id, days] of pk) { const o = el('option', null, 'Relief ' + id + ' · ' + S.DAY_NAMES.map(n => days[n.toLowerCase()] || 'off').join(' ')); o.value = id; sel.appendChild(o); }
    sel.addEventListener('change', () => {
      const days = pk.get(sel.value); if (!days) return;
      inputs.forEach(({ inp, r }, i) => { inp.value = days[S.DAY_NAMES[i].toLowerCase()] || ''; inp.dispatchEvent(new Event('input')); });
    });
    pkgWrap.appendChild(sel);
  }).catch(() => {});

  const rep = el('label', 'check');
  const cb = el('input'); cb.type = 'checkbox'; cb.checked = isRelief;
  rep.append(cb, document.createTextNode('Repeat this week every week until I change it'));
  form.appendChild(rep);
  form.appendChild(el('div', 'hint', isRelief
    ? 'Cycles usually run about four weeks but dispatch decides when they end — when your week changes, just enter the new one; earlier weeks stay as they were.'
    : 'Leave unchecked to save only the days you entered.'));

  const save = el('button', 'pa-submit', 'Save week'); save.type = 'button';
  const msg = el('div', 'msgline');
  save.addEventListener('click', async () => {
    save.disabled = true; msg.textContent = 'Saving…'; msg.className = 'msgline';
    try {
      const entries = inputs.map(({ date, inp, r }) => ({ date, runNo: inp.value.trim(), r }));
      if (cb.checked) {
        const d = {}; entries.forEach((e, i) => { if (e.runNo) d[String(i)] = { runNo: e.runNo }; });
        if (!Object.keys(d).length) throw new Error('Enter at least one run.');
        await A.savePattern({ periodDays: 7, days: d, runByDayType: {}, depotKey: ctx.profile.depotKey,
                              effectiveFrom: ws, preset: isRelief ? 'relief-week' : 'slate-week', label: 'week of ' + ws });
        // Explicit days in this week that disagree with the new pattern would
        // shadow it; clear them so the pattern is what shows.
        const clears = entries.filter(e => e.r.source === 'assignment').map(e => ({ date: e.date, remove: true }));
        if (clears.length) await A.saveDays(clears);
      } else {
        const ops = [];
        entries.forEach(e => {
          if (e.runNo) ops.push({ date: e.date, runNo: e.runNo, status: 'scheduled', source: 'manual',
                                  depotKey: ctx.profile.depotKey, dayType: e.r.dayType });
          else if (e.r.source === 'assignment') ops.push({ date: e.date, remove: true });
        });
        if (!ops.length) throw new Error('Nothing to save.');
        await A.saveDays(ops);
      }
      msg.textContent = 'Saved.'; msg.className = 'msgline ok';
    } catch (err) { msg.textContent = 'Could not save: ' + (err.code || err.message); msg.className = 'msgline err'; }
    save.disabled = false;
  });
  form.appendChild(save); form.appendChild(msg);
}

async function renderUpcoming() {
  const list = $('sch-list'); list.textContent = '';
  const today = S.todayIso();
  const rows = A.resolveRange(today, S.addDays(today, 27), ctx.overrides);
  for (const r of rows) {
    const row = el('div', 'row' + (r.date === today ? ' today' : ''));
    const d = el('div', 'd', S.DAY_SHORT[S.dowOf(r.date)].toUpperCase()); d.appendChild(el('small', null, S.fmtDate(r.date).slice(4)));
    const runCell = el('div', 'run' + (r.off ? ' off' : ''));
    const t = el('div', 't', '');
    const acts = el('div', 'acts');
    const badge = el('span', 'badge ' + (r.holiday && r.holiday.isHoliday ? 'holiday' : r.source === 'assignment' ? (r.assignment && r.assignment.source === 'edit' ? 'edit' : 'manual') : r.source === 'pattern' ? 'pattern' : ''),
      r.holiday && r.holiday.isHoliday ? 'holiday' : r.source === 'assignment' ? (r.assignment && r.assignment.source === 'edit' ? 'edited' : 'manual') : r.source === 'pattern' ? 'pattern' : 'none');
    const btn = el('button', 'rowbtn', 'EDIT'); btn.type = 'button';
    btn.addEventListener('click', () => openEdit(r));
    acts.append(badge, btn);
    if (r.off) {
      runCell.textContent = r.unregistered ? '—' : (r.status === 'holiday' ? 'OFF · holiday' : r.status.toUpperCase());
    } else {
      runCell.textContent = 'RUN ' + r.runNo + (r.flags && r.flags.overtime ? ' · OT' : '');
      runFor(r, r.date).then(run => {
        if (run) { t.textContent = S.fmtClock(run.reportMin) + ' – ' + S.fmtClock(run.finishMin) + (A.extrasMin(r.extras) ? ' +' + A.fmtHours(A.extrasMin(r.extras)) : ''); if (run.pieces[0]) runCell.textContent += ' · ' + run.pieces.map(p => p.routeLabel).join(' / '); }
        else t.textContent = 'not in paddle';
      }).catch(() => {});
    }
    row.append(d, runCell, t, acts);
    list.appendChild(row);
  }
}

// ---- edit sheet (shared module) ------------------------------------------

function openEdit(r) {
  E.configure({ profile: ctx.profile, onSaved: () => { refreshToday(); if (ctx.view === 'schedule') renderSchedule(); } });
  E.openEdit(r);
}

// Expose the pure pieces for in-browser checks (no side effects).
window.PA_HOME = { S, A, N, E, computeState, ctx, renderSchedule, renderToday, renderAlerts, openEdit, refreshToday };
</script>
