  This is an unofficial tool: always check the list posted at your depot.</div>

<script type="module">
// ==========================================================================
// Holiday Overtime: the runs posted for overtime sign-up on a holiday, from
// a Google Sheet the app owner fills in. ONE TAB PER DEPOT, named like the
// app's depot ("Callowhill Bus", "Allegheny"):
//
//   Run Number | Pick Date by | Holiday Date | Day
//   201        | 12/18/2026   | 12/25/2026   | Sunday
//   209        |              |              |          <- blank = same as above
//
// Pick Date by = when the sign-up ends. Day = the schedule worked that day
// (a Friday holiday on the Sunday schedule says "Sunday"): its paddles are
// shown. Blank Day = the schedule SEPTA's calendar says (PaHoliday).
// Pick Date / Holiday Date / Day only need to be typed on the first row:
// blank cells take the row above's. "Run Number" may hold several runs
// ("52, 53, 60"). Dates as Google Sheets shows them (12/25/2026,
// 2026-12-25, Dec 25 2026; no year = the next one).
//
// Google answers a tab name it doesn't have with the FIRST tab, so the tab
// list is read first (the sheet's htmlview page) and each tab is fetched by
// its gid. Each run is drawn as the Paddles scorecard; the pick is the one
// in force on the holiday. Scheduled times only.
// ==========================================================================
import {
  loadSeasons, seasonFor, loadManifest, loadPaddle, normalizeRun, loadPaddleLinks, parseCSV, dayLabel, fmtClock
} from './assets/pa-schedule.js';
import { modelFromRun, card, stack } from './assets/pa-run-card.js';

const SHEET_ID = '1C8fuIoS_YOIRdtxBQgQ2o-BbyE1x_wF6DKppZKHEIPQ';
const SHEET_BASE = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID;
const H = window.PaHoliday;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
const DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const DOWL = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const pad = n => String(n).padStart(2, '0');

// ---- the sheet ----------------------------------------------------------------

/** A date cell -> { iso, min } (min = time of day when the cell has one, else null). */
function parseDate(s, today) {
  s = String(s || '').trim();
  if (!s) return null;
  let y, m, d, x;
  if ((x = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) { y = +x[1]; m = +x[2]; d = +x[3]; }
  else if ((x = s.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?/))) { m = +x[1]; d = +x[2]; y = x[3] ? +x[3] : null; }
  else if ((x = s.match(/([A-Za-z]{3,})\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?/))) {
    const mi = MONTHS.findIndex(n => n.startsWith(x[1].toLowerCase().slice(0, 3)));
    if (mi < 0) return null;
    m = mi + 1; d = +x[2]; y = x[3] ? +x[3] : null;
  } else return null;
  if (y != null && y < 100) y += 2000;
  if (y == null) {
    // No year: this year's, unless that was more than two months ago.
    y = +today.slice(0, 4);
    if (y + '-' + pad(m) + '-' + pad(d) < H.addDays(today, -60)) y++;
  }
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
  const iso = y + '-' + pad(m) + '-' + pad(d);
  let min = null;
  const t = s.slice(x.index + x[0].length).match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AP]M)?/i) || s.slice(x.index + x[0].length).match(/\b(\d{1,2})\s*([AP]M)\b/i);
  if (t) {
    const ap = (t[3] || (t.length === 3 ? t[2] : '') || '').toUpperCase();
    let h = +t[1]; const mm = t.length === 4 ? +t[2] : 0;
    if (ap === 'PM' && h !== 12) h += 12;
    if (ap === 'AM' && h === 12) h = 0;
    min = h * 60 + mm;
    if (min === 0 && !ap) min = null;          // "12/18/2026 0:00:00" = no time given
  }
  return { iso, min };
}

/** "Sunday" / "SUN" / "Sat" / "Weekday" -> 'sunday' | 'saturday' | 'weekday', else ''. */
function parseDay(s) {
  const l = String(s || '').trim().toLowerCase();
  if (!l) return '';
  if (l.startsWith('sun')) return 'sunday';
  if (l.startsWith('sat')) return 'saturday';
  if (/^(wk|week|mon|tue|wed|thu|fri)/.test(l)) return 'weekday';
  return '';
}

// Header names, loosely ("Run #", "Holiday", "Pick by"...).
// The first name that matches wins ("Holiday Date" before "Pick Date by" for 'date').
function col(row, ...names) {
  const keys = Object.keys(row);
  for (const n of names) {
    const k = keys.find(k => k.replace(/[^a-z]/g, '').includes(n));
    if (k) return row[k];
  }
  return '';
}

/** One tab's rows -> [{ iso, runNo, pickIso, pickMin, day, depot }]. Blank
 *  Pick Date / Holiday Date / Day cells take the row above's. */
function entriesOf(text, depotName, today) {
  const out = [];
  let hol = null, pick = null, day = '';
  parseCSV(text).forEach((r, i) => {
    const h = parseDate(col(r, 'holiday', 'workdate'), today);
    const p = parseDate(col(r, 'pick', 'signup', 'deadline'), today);
    // "Day" but not "Holiday Date".
    const dk = Object.keys(r).find(k => /^(day|schedule|scheduleday|dayschedule|servingday)$/.test(k.replace(/[^a-z]/g, '')));
    const dy = parseDay(dk ? r[dk] : '');
    if (h) hol = h;
    if (p) pick = p;
    if (dy) day = dy;
    if (!hol) return;
    const depot = (col(r, 'depot', 'district', 'garage') || '').trim() || depotName;   // a Depot column (test list) wins
    const runs = String(col(r, 'run') || '').match(/\d{1,4}/g) || [];
    runs.forEach(n => out.push({ iso: hol.iso, runNo: String(+n), pickIso: pick ? pick.iso : '', pickMin: pick ? pick.min : null, day, depot, row: i + 2 }));
  });
  // The same run twice on one date (listed again): once.
  const seen = new Set();
  return out.filter(e => { const k = e.iso + '|' + e.runNo + '|' + e.depot.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
}

// The sheet's tabs [{ name, gid }], from its htmlview page.
async function sheetTabs() {
  const r = await fetch(SHEET_BASE + '/htmlview?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  const html = await r.text();
  const unq = s => s.replace(/\\x([0-9a-f]{2})/gi, (_, h) => String.fromCharCode(parseInt(h, 16)))
                    .replace(/\\u([0-9a-f]{4})/gi, (_, h) => String.fromCharCode(parseInt(h, 16))).replace(/\\(.)/g, '$1');
  const tabs = [], re = /items\.push\(\{name: "((?:[^"\\]|\\.)*)",[^}]*?gid: "(\d+)"/g;
  let m;
  while ((m = re.exec(html))) tabs.push({ name: unq(m[1]).trim(), gid: m[2] });
  if (!tabs.length) throw new Error('no tabs');
  return tabs;
}

// Every tab: [{ name, text }]. Saved for no connection.
let sheetSavedAt = 0, sheetStale = false;
async function loadSheet() {
  const test = new URLSearchParams(location.search).get('sheet');           // staging test: a CSV next to the page
  if (test && /^[\w\/.-]+\.csv$/.test(test)) {
    const r = await fetch(test, { cache: 'no-store' });
    sheetSavedAt = Date.now(); sheetStale = false;
    return [{ name: '', text: await r.text() }];
  }
  try {
    const tabs = await sheetTabs();
    const out = await Promise.all(tabs.map(async t => {
      const r = await fetch(SHEET_BASE + '/gviz/tq?tqx=out:csv&gid=' + t.gid + '&t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      return { name: t.name, text: await r.text() };
    }));
    lsSet('ot_sheet2', JSON.stringify(out)); lsSet('ot_sheet_at', String(Date.now()));
    sheetSavedAt = Date.now(); sheetStale = false;
    return out;
  } catch (e) {
    let saved = null;
    try { saved = JSON.parse(lsGet('ot_sheet2') || 'null'); } catch (_) {}
    if (!saved) throw e;
    sheetSavedAt = +lsGet('ot_sheet_at') || 0; sheetStale = true;
    return saved;
  }
}
const entriesOfAll = (tabs, today) => tabs.flatMap(t => entriesOf(t.text, t.name, today));

// ---- depots ---------------------------------------------------------------------
const letters = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
const normDepot = s => String(s || '').toLowerCase().replace(/\b(bus|depot|district|garage)\b/g, '').replace(/[^a-z]/g, '');
/** Does a tab / Depot name ("Callowhill Bus", "Callowhill") name the depot `label`?
 *  ("Frankford" = Frankford Bus, never Frankford Rail.) A row with no depot fits any. */
function depotMatches(sheetDepot, label) {
  if (!sheetDepot) return true;
  return letters(sheetDepot) === letters(label) || normDepot(sheetDepot) === normDepot(label);
}

// ---- state ------------------------------------------------------------------------
let seasons = [], curDistricts = [], hdata = { days: {}, ov: {} }, entries = [];
// Route chips: the routes picked (none = all), remembered.
const routeSel = new Set(lsGet('ot_routes').split(',').filter(Boolean));
let openOnly = lsGet('ot_open') === '1';
let showPast = false;
let loadSeq = 0;
let items = [];                        // [{ e, run, row, url, dayType, info }] for the depot
const today = () => H.todayIso();

/** Sign-up closes at the end of the "Pick Date by" day (or at its time). */
function closesMs(e) {
  if (!e.pickIso) return null;
  const d = H.dateOf(e.pickIso);
  if (e.pickMin != null) d.setMinutes(e.pickMin); else d.setHours(23, 59, 59);
  return d.getTime();
}
const isClosed = e => { const c = closesMs(e); return (c != null && c < Date.now()) || e.iso < today(); };
function leftText(e) {
  const c = closesMs(e);
  if (e.iso < today()) return { t: 'Past', cls: 'closed' };
  if (c == null) return { t: 'No pick date', cls: '' };
  if (c < Date.now()) return { t: 'Sign-up closed', cls: 'closed' };
  const days = Math.round((H.dateOf(e.pickIso) - H.dateOf(today())) / 86400000);
  if (days === 0) return { t: e.pickMin != null ? 'Closes today ' + fmtClock(e.pickMin) : 'Closes today', cls: 'soon' };
  if (days === 1) return { t: 'Closes tomorrow', cls: 'soon' };
  return { t: days + ' days left', cls: days <= 3 ? 'soon' : '' };
}
const shortDate = iso => { const d = H.dateOf(iso); return DOWL[d.getDay()] + ' ' + MON[d.getMonth()].charAt(0) + MON[d.getMonth()].slice(1).toLowerCase() + ' ' + d.getDate(); };
const kindOf = info => info.alt && !info.changed ? 'alt' : info.day === 'sunday' ? 'sun' : info.day === 'saturday' ? 'sat' : 'wkd';
function scheduleText(info) {
  if (info.alt && !info.changed) return 'ALTERNATE ' + info.dayLabel.toUpperCase();
  return info.day.toUpperCase() + ' SCHEDULE';
}

// ---- build: the depot's runs for every date on the list ------------------------------
async function build() {
  const my = ++loadSeq;
  const label = $('otDepot').value;
  const mine = entries.filter(e => depotMatches(e.depot, label));
  $('otList').innerHTML = mine.length ? '<div class="ot-msg">Loading ' + esc(label) + ' runs…</div>' : '';
  // One group per date + schedule (the sheet's Day, else SEPTA's calendar).
  const groups = [...new Set(mine.map(e => e.iso + '|' + e.day))];
  const out = [];
  await Promise.all(groups.map(async g => {
    const [iso, sheetDay] = g.split('|');
    const season = seasonFor(seasons, iso);
    const districts = season ? await loadManifest(season).catch(() => []) : [];
    const dist = districts.find(d => (d.label || d.name) === label) || districts.find(d => depotMatches(d.label || d.name, label));
    const base = H.info(iso, null, hdata);
    const dayType = sheetDay || base.day;             // 'sunday' | 'weekday' | 'saturday'
    let rows = new Map(), links = new Map();
    if (dist && (dist.days || []).includes(dayLabel(dayType))) {
      [rows, links] = await Promise.all([
        loadPaddle(dist.name, dayType, iso).catch(() => new Map()),
        loadPaddleLinks(dist.name).catch(() => new Map())]);
    }
    // The depot's routes that day, so an alternate schedule counts only when it covers one.
    const runs = [...rows.values()].map(r => normalizeRun(r, dayType)).filter(Boolean);
    let info = H.info(iso, [...new Set(runs.flatMap(r => r.pieces.map(p => p.routeLabel)))], hdata);
    // The sheet's Day wins. SEPTA's alternate-timetable warning stays only
    // when it is about that same schedule.
    if (sheetDay && sheetDay !== info.day) info = { ...info, day: sheetDay, dayLabel: dayLabel(sheetDay), changed: sheetDay !== info.plain, alt: false, altRoutes: [] };
    else if (sheetDay) info = { ...info, changed: sheetDay !== info.plain };
    mine.filter(e => e.iso === iso && e.day === sheetDay).forEach(e => {
      const row = rows.get(e.runNo) || null;
      const run = row ? normalizeRun(row, dayType) : null;
      const link = links.get(dayLabel(dayType) + '-' + e.runNo);
      const url = link ? ((window.innerWidth <= 768 ? link.moblink || link.pclink : link.pclink || link.moblink) || '') : '';
      out.push({ e, run, row, url, dayType, info, dist, season });
    });
  }));
  if (my !== loadSeq) return;
  items = out;
  render();
}

const routesOf = x => x.run ? [...new Set(x.run.pieces.flatMap(p => PaTags.labelRoutes(p.routeLabel).map(PaTags.shortRoute)))] : [];
// The cards that can show (upcoming, unless past dates are open; open sign-ups only).
const shownItems = () => items.filter(x => (showPast || x.e.iso >= today()) && !(openOnly && isClosed(x.e)));
function fillRoutes() {
  const rank = r => { const n = parseInt(r, 10); return isNaN(n) ? [1, 0, r] : [0, n, r]; };
  const list = shownItems();
  const routes = [...new Set(list.flatMap(routesOf))]
    .sort((a, b) => { const x = rank(a), y = rank(b); return x[0] - y[0] || x[1] - y[1] || String(x[2]).localeCompare(String(y[2])); });
  for (const r of [...routeSel]) if (!routes.includes(r)) routeSel.delete(r);
  const box = $('otRoutes');
  box.hidden = routes.length < 2;
  box.innerHTML = (routeSel.size ? '<button type="button" class="fchip all" data-ot-route="">ALL ROUTES</button>' : '')
    + routes.map(r => {
      const n = list.filter(x => routesOf(x).includes(r)).length;
      return '<button type="button" class="fchip' + (routeSel.has(r) ? ' active' : '') + '" data-ot-route="' + esc(r) + '" aria-pressed="' + routeSel.has(r) + '" title="Route ' + esc(r) + ': ' + n + ' run' + (n === 1 ? '' : 's') + '">'
        + esc(r) + '<span class="cnt">' + n + '</span></button>';
    }).join('');
}

// ---- filters + sort ------------------------------------------------------------------
const swingMin = x => { const s = parseInt(x.row && x.row.swingdursec, 10); return x.run && x.run.swing && s > 0 ? s / 60 : 0; };
function matches(x) {
  if (routeSel.size && !routesOf(x).some(r => routeSel.has(r))) return false;
  if (openOnly && isClosed(x.e)) return false;
  return true;
}
function sorter() {
  const [k, dir] = $('otSort').value.split('-');
  const sgn = dir === 'desc' ? -1 : 1;
  const val = x => {
    if (!x.run) return null;
    if (k === 'start') return x.run.reportMin;
    if (k === 'finish') return x.run.finishMin;
    if (k === 'pay') return x.run.payHours;
    if (k === 'swing') return swingMin(x);
    return null;
  };
  return (a, b) => {
    if (k !== 'run') {
      const va = val(a), vb = val(b);
      if (va == null && vb != null) return 1;             // runs not found last
      if (vb == null && va != null) return -1;
      if (va != null && vb != null && va !== vb) return (va - vb) * sgn;
    }
    return (+a.e.runNo) - (+b.e.runNo);
  };
}

// ---- render -------------------------------------------------------------------------
function dayHeader(iso, list) {
  const i = list[0].info, d = H.dateOf(iso), k = kindOf(i), t = today();
  const n = Math.round((d - H.dateOf(t)) / 86400000);
  const when = n === 0 ? '<span class="ot-when now">TODAY</span>' : n === 1 ? '<span class="ot-when now">TOMORROW</span>'
    : n > 1 ? '<span class="ot-when">IN ' + n + ' DAYS</span>' : '<span class="ot-when">PAST</span>';
  let badges = '<span class="ot-badge ' + k + '">' + esc(scheduleText(i)) + '</span>';
  if (i.alt && i.changed) badges += '<span class="ot-badge alt">' + esc(i.altRoutes.join(', ')) + ' ALTERNATE</span>';
  if (i.alt) badges += '<span class="ot-badge alt">NO PADDLES</span>';
  // Pick-by dates on this holiday (usually one).
  const picks = [...new Set(list.map(x => x.e.pickIso + '|' + (x.e.pickMin == null ? '' : x.e.pickMin)))];
  const pickLine = picks.map(p => {
    const [pi, pm] = p.split('|'), e = list.find(x => x.e.pickIso + '|' + (x.e.pickMin == null ? '' : x.e.pickMin) === p).e, l = leftText(e);
    return pi ? '<span>Sign up by <b>' + esc(shortDate(pi)) + (pm ? ' ' + esc(fmtClock(+pm)) : '') + '</b></span><span class="ot-left ' + l.cls + '">' + esc(l.t) + '</span>'
      : '<span class="ot-left">No pick date given</span>';
  }).join('');
  const name = i.name || (i.changed ? i.dayLabel + ' schedule' : 'Overtime');
  let warn = '';
  if (i.alt) warn = '<div class="ot-warn"><b>Alternate schedule, no paddles:</b> SEPTA runs '
    + (i.changed ? 'a special timetable on ' + esc(i.altRoutes.join(', ')) : 'an alternate ' + esc(i.dayLabel) + ' timetable')
    + '. The times below are from the regular ' + esc(i.dayLabel) + ' paddles and may not match.</div>';
  else if (i.changed) warn = '<div class="ot-n">Worked on the <b>' + esc(i.dayLabel) + ' schedule</b>: these are the ' + esc(i.dayLabel) + ' paddles.</div>';
  return '<div class="ot-dh ' + k + '"><div class="ot-cal" aria-label="' + esc(shortDate(iso)) + '"><div class="dw">' + DOW[d.getDay()] + '</div><div class="dn">' + d.getDate() + '</div><div class="mo">' + MON[d.getMonth()] + '</div></div>'
    + '<div class="ot-dh-body"><div class="ot-dh-top"><span class="ot-name">' + esc(name) + '</span>' + when + '</div>'
    + '<div class="ot-badges">' + badges + '</div><div class="ot-pick">' + pickLine + '</div>' + warn + '</div></div>';
}

function runCard(x) {
  const wrap = document.createElement('div');
  const k = kindOf(x.info), l = leftText(x.e);
  wrap.className = 'ot-card ' + k + (isClosed(x.e) ? ' closed' : '');
  if (!x.run) {
    const depot = x.dist ? (x.dist.label || x.dist.name) : $('otDepot').value;
    wrap.innerHTML = '<div class="ot-miss">' + PaTags.runTag(x.e.runNo, dayLabel(x.dayType), '') + '<div style="margin-top:6px">Run <b>' + esc(x.e.runNo)
      + '</b> is not on the <b>' + esc(dayLabel(x.dayType)) + '</b> paddles at ' + esc(depot) + (x.season ? ' (' + esc(x.season.label) + ' pick)' : '') + '.'
      + (x.e.depot ? '' : ' Check the depot.') + '</div></div>';
    return wrap;
  }
  const top = document.createElement('div');
  top.className = 'ot-strip';
  top.innerHTML = '<span class="ot-s-date">' + esc(shortDate(x.e.iso).toUpperCase()) + '</span>'
    + '<span class="ot-s-sch">' + esc(scheduleText(x.info)) + '</span>'
    + '<span class="ot-s-left">' + esc(x.e.pickIso && !isClosed(x.e) ? 'BY ' + shortDate(x.e.pickIso).toUpperCase().slice(4) + ' · ' + l.t : l.t) + '</span>';
  const c = card(modelFromRun(x.run), { paddleUrl: x.url });
  wrap.appendChild(stack(top, c, x.run.dayType));
  return wrap;
}

function render() {
  fillRoutes();
  const t = today(), label = $('otDepot').value;
  const note = sheetStale ? '<div class="ot-note">No connection: showing the list saved ' + esc(new Date(sheetSavedAt).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })) + '.</div>' : '';
  $('otNote').innerHTML = note;
  const box = $('otList');
  if (!entries.length) {
    box.innerHTML = '<div class="ot-msg"><b>No holiday overtime runs posted yet.</b><br>When the runs for a holiday are posted, they show up here.</div>';
    $('otCount').textContent = ''; return;
  }
  const base = items.filter(x => showPast || x.e.iso >= t);
  const list = base.filter(matches);
  $('otCount').textContent = list.length + (list.length === 1 ? ' run' : ' runs');
  const past = items.filter(x => x.e.iso < t).length;
  const pastBtn = past && !showPast ? '<button type="button" class="ot-past" id="otPastBtn">Show past dates (' + past + ' runs)</button>' : '';
  if (!items.length) {
    box.innerHTML = '<div class="ot-msg"><b>No overtime runs posted for ' + esc(label) + '.</b><br>Pick another depot above.</div>';
    return;
  }
  if (!list.length) {
    let why = 'No runs match your filters.';
    if (!base.length) why = 'No upcoming holiday overtime for ' + esc(label) + '.';
    else if (openOnly && base.every(x => isClosed(x.e))) why = 'Sign-up is closed for every run shown. Turn off "Open sign-ups only" to see them.';
    box.innerHTML = '<div class="ot-msg">' + why + '</div>' + pastBtn;
    return;
  }
  box.innerHTML = '';
  const byDate = new Map();
  list.forEach(x => { if (!byDate.has(x.e.iso)) byDate.set(x.e.iso, []); byDate.get(x.e.iso).push(x); });
  [...byDate.keys()].sort().forEach(iso => {
    const group = byDate.get(iso).sort(sorter());
    const sec = document.createElement('section');
    sec.className = 'ot-day';
    sec.innerHTML = dayHeader(iso, items.filter(x => x.e.iso === iso));
    const grid = document.createElement('div');
    grid.className = 'ot-grid at-list pa-sc';
    group.forEach(x => grid.appendChild(runCard(x)));
    sec.appendChild(grid);
    box.appendChild(sec);
  });
  if (pastBtn) box.insertAdjacentHTML('beforeend', pastBtn);
  PaTags.resolveBlockTags(box);
}

// ---- controls ---------------------------------------------------------------------------
$('otList').addEventListener('click', e => { if (e.target.id === 'otPastBtn') { showPast = true; render(); } });
$('otRoutes').addEventListener('click', e => {
  const b = e.target.closest('[data-ot-route]');
  if (!b) return;
  const r = b.dataset.otRoute;
  if (!r) routeSel.clear();
  else if (routeSel.has(r)) routeSel.delete(r); else routeSel.add(r);
  lsSet('ot_routes', [...routeSel].join(','));
  render();
});
$('otSort').addEventListener('change', () => { lsSet('ot_sort', $('otSort').value); render(); });
$('otOpen').addEventListener('click', () => {
  openOnly = !openOnly; lsSet('ot_open', openOnly ? '1' : '');
  $('otOpen').classList.toggle('on', openOnly); $('otOpen').setAttribute('aria-pressed', openOnly);
  render();
});
// The depot is app-wide: bt_depot (label), like Paddles / Live / Pull Outs.
$('otDepot').addEventListener('change', () => { lsSet('bt_depot', $('otDepot').value); build(); });
window.addEventListener('storage', e => {
  if (e.key !== 'bt_depot' || !e.newValue || e.newValue === $('otDepot').value) return;
  if ([...$('otDepot').options].some(o => o.value === e.newValue)) { $('otDepot').value = e.newValue; build(); }
});

// A new list on the sheet: every 5 minutes while open, and on coming back to the page.
let lastText = '';
async function refresh() {
  try {
    const tabs = await loadSheet(), text = JSON.stringify(tabs);
    if (text === lastText) { render(); return; }
    lastText = text;
    entries = entriesOfAll(tabs, today());
    fillDepots();
    await build();
  } catch (_) {}
}
setInterval(refresh, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
// "3 days left" / closed: once a minute.
setInterval(() => { if (items.length) render(); }, 60000);

// Depot dropdown: every depot of the pick; the ones with upcoming overtime say how many runs.
function fillDepots() {
  const sel = $('otDepot'), cur = sel.value, t = today();
  sel.innerHTML = curDistricts.map(d => {
    const label = d.label || d.name;
    const n = entries.filter(e => e.iso >= t && depotMatches(e.depot, label)).length;
    return '<option value="' + esc(label) + '">' + esc(label) + (n ? ' · ' + n + (n === 1 ? ' run' : ' runs') : '') + '</option>';
  }).join('');
  if (cur && curDistricts.some(d => (d.label || d.name) === cur)) sel.value = cur;
}

(async function init() {
  const s = lsGet('ot_sort');
  if (s && [...$('otSort').options].some(o => o.value === s)) $('otSort').value = s;
  $('otOpen').classList.toggle('on', openOnly); $('otOpen').setAttribute('aria-pressed', openOnly);
  try {
    let tabs;
    [seasons, hdata, tabs] = await Promise.all([loadSeasons(), H.load(), loadSheet()]);
    lastText = JSON.stringify(tabs);
    entries = entriesOfAll(tabs, today());
    // Depots of today's pick (the list's dates use their own pick's paddles).
    const season = seasonFor(seasons, today());
    curDistricts = season ? await loadManifest(season) : [];
    fillDepots();
    const saved = lsGet('bt_depot');
    if (curDistricts.some(d => (d.label || d.name) === saved)) $('otDepot').value = saved;
    await build();
  } catch (e) {
    $('otList').innerHTML = '<div class="ot-msg">Could not load the overtime list. Check your connection and try again.</div>';
  }
})();
</script>
