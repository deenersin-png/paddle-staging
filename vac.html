<script>
// pa-settings-hook: re-broadcasts this page's own localStorage writes as a
// 'pa:setting' event so the account modules can mirror them to the signed-in
// user's Firestore doc. Deliberately a classic script, not a module: it has to
// run BEFORE the inline script below, and module scripts are always deferred.
// Nothing here changes what the page stores or how it reads it.
(function(){
  var WATCH = /^(paddleSeason|paddleDepot|bt_route|bt_block|vacSickViewMode)/;
  var set = Storage.prototype.setItem;
  Storage.prototype.setItem = function(k, v){
    set.call(this, k, v);
    if (this === localStorage && WATCH.test(k))
      window.dispatchEvent(new CustomEvent('pa:setting', {detail:{key:k, value:v}}));
  };
})();
</script>

<script>
const REPO   = "deenersin-png/septa-scheduler";
const BRANCH = "main";
const BASE   = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/data/callowhillb-summer2026/";

const CSV_URLS = {
  weekday:   BASE + "weekday.csv",
  saturday:  BASE + "saturday.csv",
  sunday:    BASE + "sunday.csv",
  holdowner: BASE + "holdowner.csv",
  pdfs:      BASE + "pdfs.csv",
};

// Vac/Sick runs — live Google Sheet (Callowhill). A2 (online) = master switch.
const SHEET_ID  = "1XY9tVEzQGxCO010RNkCFARXEt_5nqxUm_etTlh7cjZA";
const SHEET_GID = "176321248";
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&gid="+SHEET_GID;

const ROUTE_COLORS = {
  "21-42":"#e63946","43":"#457b9d","52":"#2a9d8f","65":"#e9c46a",
  "44":"#f4a261","30":"#264653","38":"#6a4c93","31":"#1d3557",
  "40":"#a8dadc","46":"#06d6a0","L1 OWL":"#9b5de5","WCS":"#f15bb5",
};
const DAY_ORDER   = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_TO_TYPE = {Mon:"Weekday",Tue:"Weekday",Wed:"Weekday",Thu:"Weekday",Fri:"Weekday",Sat:"Saturday",Sun:"Sunday"};

let runsByDay  = {Weekday:{},Saturday:{},Sunday:{}};
let holdowner  = [];
let allRoutes  = [];
let excludedRoutes = new Set();
let openRelief = null;

// Vac/Sick state
let vacSick       = [];        // parsed packages from the sheet
let vacSickOnline = false;     // A2 master switch
let viewMode      = localStorage.getItem("vacSickViewMode") || "reliefs"; // "reliefs" | "add" | "vsonly"

// pdfLinks[dayType][runno] = moblink URL
// e.g. pdfLinks["Weekday"]["51"] = "https://...#page=1"
let pdfLinks = {Weekday:{}, Saturday:{}, Sunday:{}};

// ── CSV helpers ───────────────────────────────────────────────
function cleanStr(s){ return (s||"").replace(/\r/g,"").trim(); }

function parseCSVRow(row){
  const f=[]; let c="", q=false;
  for(let i=0;i<row.length;i++){
    const ch=row[i];
    if(ch==='"') q=!q;
    else if(ch===','&&!q){ f.push(c.trim()); c=""; }
    else if(ch!=='\r') c+=ch;
  }
  f.push(c.trim()); return f;
}

function parseScheduleCSV(text){
  const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split('\n').filter(l=>l.trim());
  if(lines.length<2) return [];
  const hdr=parseCSVRow(lines[0]).map(h=>cleanStr(h).toLowerCase());
  const col=(name)=>hdr.indexOf(name);
  const runs=[];
  for(let i=1;i<lines.length;i++){
    const v=parseCSVRow(lines[i]);
    const get=(name)=>{ const idx=col(name); return idx>=0?cleanStr(v[idx]||""):""; };
    const runno=get("runno"); if(!runno) continue;
    const routes=[];
    for(let r=1;r<=10;r++){
      const rVal=get("r"+r);
      if(rVal) routes.push({
        r:rVal, b:get("b"+r),
        pot: get("potype"+r)+" "+get("pot"+r),
        pit: get("pitype"+r)+" "+get("pit"+r),
        stime: get("stime"+r),
      });
    }
    const startRaw=get("start"), finishRaw=get("finish");
    const sM=(startRaw.match(/(\d{1,2}:\d{2}\s*[AP]M)/i)||[])[1]||startRaw;
    const fM=(finishRaw.match(/(\d{1,2}:\d{2}\s*[AP]M)/i)||[])[1]||finishRaw;
    const swingdur=get("swingdur");
    runs.push({
      runno, start:sM, finish:fM,
      worktime: get("worktime").replace(/[()]/g, "").trim().replace(/\s+/g, " "),
      swingdur: swingdur,
      isSwing: swingdur&&swingdur.length>0,
      pay: parseFloat(get("pay"))||8.0,
      routes
    });
  }
  return runs;
}

function parsePdfsCSV(text){
  // columns: myid, runno, depot, page_1, page, day, moblink, pclink, triplink
  const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split('\n').filter(l=>l.trim());
  if(lines.length<2) return;
  const hdr=parseCSVRow(lines[0]).map(h=>cleanStr(h).toLowerCase());
  const col=(name)=>hdr.indexOf(name);
  for(let i=1;i<lines.length;i++){
    const v=parseCSVRow(lines[i]);
    const get=(name)=>{ const idx=col(name); return idx>=0?cleanStr(v[idx]||""):""; };
    const runno  = get("runno");   if(!runno) continue;
    const day    = get("day");     // "Weekday", "Saturday", "Sunday"
    const moblink= get("moblink"); if(!moblink) continue;
    // Normalise day value to match our keys
    const key = day.charAt(0).toUpperCase() + day.slice(1).toLowerCase();
    // key will be "Weekday", "Saturday", or "Sunday"
    if(pdfLinks[key]) pdfLinks[key][runno] = moblink;
  }
}

function parseHoldownerCSV(text){
  const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split('\n').filter(l=>l.trim());
  if(lines.length<2) return [];
  const hdr=parseCSVRow(lines[0]).map(h=>cleanStr(h).toLowerCase());
  const pkgs=[];
  for(let i=1;i<lines.length;i++){
    const v=parseCSVRow(lines[i]).map(s=>cleanStr(s));
    const rr=v[0]; if(!rr) continue;
    const findCol=(names)=>{ for(const n of names){ const idx=hdr.indexOf(n); if(idx>=0&&v[idx]) return v[idx]; } return null; };
    const days={
      Mon: findCol(["monday","mon"])||v[1]||"OFF",
      Tue: findCol(["tuesday","tue"])||v[2]||"OFF",
      Wed: findCol(["wednesday","wed"])||v[3]||"OFF",
      Thu: findCol(["thursday","thu"])||v[4]||"OFF",
      Fri: findCol(["friday","fri"])||v[5]||"OFF",
      Sat: findCol(["saturday","sat"])||v[6]||"OFF",
      Sun: findCol(["sunday","sun"])||v[7]||"OFF",
    };
    Object.keys(days).forEach(k=>{ if(days[k].toUpperCase()==="OFF") days[k]="OFF"; });
    pkgs.push({reliefRun:rr, days});
  }
  return pkgs;
}

// ── Vac/Sick sheet parser (position-based) ────────────────────
// Cols: 0 online | 1 Vac/Sick# | 2 Weekday(fills Mon-Fri) | 3-9 Mon..Sun

// A2 master switch. Keep identical to tools/ingest.py's VS_ON/VS_OFF — the app
// and this picker read the same cell, and must never disagree about it.
// Unrecognised values fail closed but warn: the old rule was === "yes", so
// typing "on" hid the feature silently with nothing to explain why.
const VS_ON  = ["yes","y","true","on","1","enabled"];
const VS_OFF = ["no","n","false","off","0","disabled",""];
function readVacSickSwitch(raw){
  const v=String(raw||"").trim().toLowerCase();
  if(VS_ON.includes(v))  return true;
  if(VS_OFF.includes(v)) return false;
  console.warn("Vac/Sick master switch A2 is "+JSON.stringify(raw)+
               " — neither on ("+VS_ON.join("/")+") nor off ("+VS_OFF.filter(Boolean).join("/")+
               "). Treating as OFF.");
  return false;
}

function parseVacSickCSV(text){
  const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split('\n').filter(l=>l.trim());
  if(lines.length<2) return {online:false, pkgs:[]};
  let online=false; const pkgs=[];
  const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  for(let i=1;i<lines.length;i++){
    const v=parseCSVRow(lines[i]).map(s=>cleanStr(s));
    if(i===1) online=readVacSickSwitch(v[0]); // A2 master switch
    const num=v[1]; if(!num) continue;
    const days={Mon:"OFF",Tue:"OFF",Wed:"OFF",Thu:"OFF",Fri:"OFF",Sat:"OFF",Sun:"OFF"};
    const wk=v[2]||"";
    if(wk){ days.Mon=days.Tue=days.Wed=days.Thu=days.Fri=wk; }   // weekday-only shortcut
    const perDay=[v[3],v[4],v[5],v[6],v[7],v[8],v[9]];           // Mon..Sun overrides
    DAYS.forEach((d,idx)=>{ if(perDay[idx]) days[d]=perDay[idx]; });
    pkgs.push({reliefRun:"Vac/Sick "+num, days, isVacSick:true});
  }
  return {online, pkgs};
}

// Safe DOM id from a relief label (handles the space/slash in "Vac/Sick 1")
function safeId(s){ return String(s).replace(/[^a-zA-Z0-9]+/g,"-"); }

// ── Fetch ─────────────────────────────────────────────────────
async function fetchCSV(url){
  try{
    const r=await fetch(url);
    if(!r.ok){ console.warn("HTTP "+r.status+": "+url); return null; }
    const text=await r.text();
    if(text&&text.length>10&&!text.includes("<!DOCTYPE")) return text;
    return null;
  }catch(e){ console.warn("Fetch error:",url,e); return null; }
}

async function loadData(){
  const [wdText,satText,sunText,hoText,pdfText,vsText] = await Promise.all([
    fetchCSV(CSV_URLS.weekday), fetchCSV(CSV_URLS.saturday),
    fetchCSV(CSV_URLS.sunday),  fetchCSV(CSV_URLS.holdowner),
    fetchCSV(CSV_URLS.pdfs),    fetchCSV(SHEET_CSV),
  ]);
  if(wdText){  parseScheduleCSV(wdText).forEach(r=>{runsByDay.Weekday[r.runno]=r;}); }
  if(satText){ parseScheduleCSV(satText).forEach(r=>{runsByDay.Saturday[r.runno]=r;}); }
  if(sunText){ parseScheduleCSV(sunText).forEach(r=>{runsByDay.Sunday[r.runno]=r;}); }
  if(hoText)  holdowner=parseHoldownerCSV(hoText);
  if(pdfText) parsePdfsCSV(pdfText);
  if(vsText){ const vs=parseVacSickCSV(vsText); vacSickOnline=vs.online; vacSick=vs.pkgs; }

  const rs=new Set();
  Object.values(runsByDay).forEach(day=>Object.values(day).forEach(r=>r.routes.forEach(rt=>rs.add(rt.r))));
  allRoutes=[...rs].sort();

  buildRouteFilters();
  applyVacSickUI();
  render();
  document.getElementById("loadingMsg").style.display="none";
}

// Show/hide the two buttons based on the A2 master switch; force reliefs-only when off.
function applyVacSickUI(){
  const box=document.getElementById("vsButtons");
  const available = vacSickOnline && vacSick.length>0;
  if(available){
    box.style.display="flex";
  }else{
    box.style.display="none";
    if(viewMode!=="reliefs"){ viewMode="reliefs"; localStorage.setItem("vacSickViewMode","reliefs"); }
  }
  document.getElementById("vsAddBtn").classList.toggle("active", viewMode==="add");
  document.getElementById("vsOnlyBtn").classList.toggle("active", viewMode==="vsonly");
}

// ── Helpers ───────────────────────────────────────────────────
function getRunInfo(dayAbbr, runno){
  if(runno==="OFF") return null;
  return runsByDay[DAY_TO_TYPE[dayAbbr]]?.[runno] || null;
}

function getMoblink(dayAbbr, runno){
  const type = DAY_TO_TYPE[dayAbbr]; // "Weekday" | "Saturday" | "Sunday"
  return pdfLinks[type]?.[runno] || null;
}

function getPackageDetails(pkg){
  const details=[]; let totalPay=0, workDays=0;
  const routes=new Set(); const offDays=[];
  DAY_ORDER.forEach(day=>{
    const rn=pkg.days[day];
    if(rn==="OFF"){ details.push({day,off:true}); offDays.push(day); }
    else{
      const info=getRunInfo(day,rn);
      if(info){ totalPay+=info.pay; workDays++; info.routes.forEach(rt=>routes.add(rt.r)); details.push({day,off:false,runno:rn,info}); }
      else{ details.push({day,off:false,runno:rn,info:null}); }
    }
  });
  return{ details, totalPay:Math.round(totalPay*100)/100, workDays, routes:[...routes], offDays };
}

function routeTag(route,small){
  const bg=ROUTE_COLORS[route]||"#555";
  return '<span class="route-tag'+(small?' small':'')+'" style="background:'+bg+'">'+route+'</span>';
}

// ── Detail: day rows with swing details ────────────────
function buildDetailHTML(pkg){
  const { details } = getPackageDetails(pkg);
  return details.map(d=>{
    if(d.off){
      return '<div class="day-row off">'+
        '<div class="day-header"><div class="day-header-left">'+
        '<span class="day-off-label">'+d.day+'</span>'+
        '<span class="day-off-text">Day Off</span>'+
        '</div></div></div>';
    }
    if(!d.info){
      return '<div class="day-row missing">'+
        '<div class="day-header"><div class="day-header-left">'+
        '<span class="day-label">'+d.day+'</span>'+
        '<span style="font-size:13px;color:var(--w40)">Run '+d.runno+' — not in schedule</span>'+
        '</div></div></div>';
    }
    const rt      = d.info.routes[0];
    const isSwing = d.info.isSwing;
    const href    = getMoblink(d.day, d.runno);
    const linkHTML = href
      ? '<a href="'+href+'" target="_blank" class="run-link">'+d.runno+' <span class="run-link-icon">↗</span></a>'
      : '<span style="font-size:12px;font-family:var(--mono);color:var(--w30)">'+d.runno+'</span>';

    return '<div class="day-row">'+
      '<div class="day-header">'+
        '<div class="day-header-left">'+
          '<span class="day-label">'+d.day+'</span>'+
          routeTag(rt.r,true)+
          linkHTML+
        '</div>'+
        '<span class="day-pay">'+d.info.pay+' hrs</span>'+
      '</div>'+
      '<div class="day-details">'+
        '<span>'+d.info.start+' → '+d.info.finish+'</span>'+
        '<span>'+d.info.worktime+'</span>'+
      '</div>'+
      (isSwing?'<div style="margin-left:44px;margin-top:6px;font-size:12px;color:#9b5de5;font-weight:600;">Swing: '+d.info.swingdur+'</div>':'')+
      (isSwing?'<div class="swing-details">'+
        d.info.routes.map((rt2)=>'<div class="swing-detail-row">'+routeTag(rt2.r,true)+'<span>'+rt2.pot+' → '+rt2.pit+'</span><span style="color:var(--w30);">('+rt2.stime+')</span></div>').join('')+
      '</div>':'')+
    '</div>';
  }).join('');
}

// ── Main render ───────────────────────────────────────────────
function render(){
  const sortBy = document.getElementById("sortBy").value;
  const minHrs = parseFloat(document.getElementById("minHrs").value)||40;

  // Pick the source list based on the current view mode.
  let source;
  if(viewMode==="vsonly")   source=vacSick;
  else if(viewMode==="add") source=holdowner.concat(vacSick);
  else                      source=holdowner;

  let pkgs=source.map(pkg=>{ const d=getPackageDetails(pkg); return{...pkg,...d}; });
  if(excludedRoutes.size>0) pkgs=pkgs.filter(p=>!p.routes.some(r=>excludedRoutes.has(r)));
  if(minHrs>40) pkgs=pkgs.filter(p=>p.totalPay>=minHrs);
  if(sortBy==="pay-high") pkgs.sort((a,b)=>b.totalPay-a.totalPay);
  else if(sortBy==="pay-low") pkgs.sort((a,b)=>a.totalPay-b.totalPay);
  else pkgs.sort((a,b)=>a.reliefRun.localeCompare(b.reliefRun,undefined,{numeric:true}));

  document.getElementById("count").textContent=pkgs.length;
  document.getElementById("countNoun").textContent =
    viewMode==="vsonly" ? "vac/sick runs" : (viewMode==="add" ? "runs" : "reliefs");
  const list=document.getElementById("listPanel");

  if(pkgs.length===0){
    const what = viewMode==="reliefs" ? "reliefs" : "vac/sick runs";
    list.innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No '+what+' found</div><div class="empty-sub">Try adjusting your filters</div></div>';
    return;
  }

  list.innerHTML=pkgs.map(p=>{
    const offDayText=p.offDays.length>0?'Off: '+p.offDays.join(', '):'No days off';
    const isOpen=openRelief===p.reliefRun;
    const sid=safeId(p.reliefRun);
    const vsTag=p.isVacSick?'<span class="vs-badge">VAC/SICK</span>':'';
    return '<div class="pkg-wrap" id="wrap-'+sid+'">'+
      '<div class="pkg-card'+(isOpen?' open':'')+'" data-relief="'+p.reliefRun+'">'+
        '<div class="pkg-header">'+
          '<span class="pkg-name">'+p.reliefRun+'</span>'+
          '<div class="pkg-right">'+
            vsTag+
            '<span class="pkg-pay">'+p.totalPay.toFixed(1)+' hrs/wk</span>'+
            '<span class="pkg-chevron'+(isOpen?' open':'')+'">&#9660;</span>'+
          '</div>'+
        '</div>'+
        '<div class="pkg-routes">'+p.routes.map(r=>routeTag(r,true)).join('')+'</div>'+
        '<div class="pkg-meta">'+offDayText+'</div>'+
      '</div>'+
      '<div class="pkg-detail'+(isOpen?' open':'')+'" id="detail-'+sid+'">'+
        (isOpen?'<div class="pkg-detail-inner">'+buildDetailHTML(p)+'</div>':'')+
      '</div>'+
    '</div>';
  }).join('');

  list.querySelectorAll('.pkg-card').forEach(card=>{
    card.addEventListener('click',()=>{
      const relief=card.dataset.relief;
      openRelief=(openRelief===relief)?null:relief;
      render();
      if(openRelief){
        setTimeout(()=>{ document.getElementById("wrap-"+safeId(openRelief))?.scrollIntoView({behavior:'smooth',block:'nearest'}); },50);
      }
    });
  });
}

function buildRouteFilters(){
  const el=document.getElementById("routeFilters");
  el.innerHTML=allRoutes.map(r=>'<button class="route-filter-btn" data-route="'+r+'">'+r+'</button>').join('');
  el.querySelectorAll('.route-filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const r=btn.dataset.route;
      if(excludedRoutes.has(r)){ excludedRoutes.delete(r); btn.classList.remove('excluded'); }
      else{ excludedRoutes.add(r); btn.classList.add('excluded'); }
      render();
    });
  });
}

document.getElementById("sortBy").addEventListener("change",render);
document.getElementById("minHrs").addEventListener("input",function(){
  document.getElementById("minHrsLabel").textContent=this.value+" hrs";
  render();
});

// Vac/Sick toggle buttons (mutually exclusive; click active one to return to reliefs).
function setViewMode(mode){
  viewMode = (viewMode===mode) ? "reliefs" : mode;
  localStorage.setItem("vacSickViewMode",viewMode);
  openRelief=null;
  applyVacSickUI();
  render();
}
document.getElementById("vsAddBtn").addEventListener("click",()=>setViewMode("add"));
document.getElementById("vsOnlyBtn").addEventListener("click",()=>setViewMode("vsonly"));

loadData();
</script>
