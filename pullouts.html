/* Depot picker band, like Live / Trip Sheets. */
.po-head{position:sticky;top:60px;z-index:200;background:#0b4ea2;padding:8px 16px 12px;border-bottom:3px solid #c8102e}
.po-title{color:#fff;font-size:19px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;text-align:center;margin:0 0 8px}
.po-select-wrap{position:relative;flex:1 1 0;min-width:0}
.po-selects{display:flex;gap:8px}
.po-selects .po-select{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.po-select{width:100%;appearance:none;-webkit-appearance:none;background:#fff;color:#0b4ea2;border:0;border-bottom:3px solid #c8102e;border-radius:8px;
  font:inherit;font-size:17px;font-weight:700;padding:10px 36px 9px 12px;box-shadow:0 2px 6px rgba(8,18,43,.25)}
.po-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#c8102e;pointer-events:none;font-size:14px}

.po-label{padding:10px 16px 8px;font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;text-align:center;
  border-bottom:1px solid #d5dce8;background:#fff}
.po-sub{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;color:#56627a;margin-top:2px}
.po-msg{text-align:center;padding:48px 16px;color:#56627a;font-size:15px}

/* One event: the time line on top of the Paddle App run card. */
.po-ev{margin-bottom:12px;scroll-margin-top:calc(68px + var(--po-hh,190px))}
/* Search field: Trip Sheets' (white, red bottom line). */
.po-search{display:block;width:100%;margin-top:8px;background:#fff;color:#0b4ea2;border:0;border-bottom:3px solid #c8102e;border-radius:8px;
  font:inherit;font-size:17px;font-weight:700;padding:10px 12px 9px;min-height:46px;box-shadow:0 2px 6px rgba(8,18,43,.25);outline:none}
.po-search::placeholder{color:#56627a;font-weight:600}
.po-search:focus{box-shadow:0 0 0 3px rgba(255,209,0,.55)}
.po-search-wrap{position:relative}
.po-time{display:flex;align-items:center;gap:8px;padding:7px 12px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:#fff;background:#0b4ea2}
.po-time .po-kind{font-size:10px;letter-spacing:.08em;padding:2px 6px;border-radius:3px;background:rgba(255,255,255,.2)}
.po-time .po-clock{font-size:16px}
.po-time .po-where{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.po-time .pa-blk{box-shadow:0 0 0 1px rgba(255,255,255,.55)}

.po-ev.in .po-time{background:#6a3fc1}
.po-ev.in .po-time .po-due{color:#6a3fc1}
.po-ev.next .po-time .po-due{background:#ffd400;color:#2b2200}

/* Pull Outs (left) | Pull Ins (right), always at the bottom. */
.po-bar{position:fixed;left:0;right:0;bottom:0;z-index:300;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid #d5dce8;box-shadow:0 -2px 8px rgba(8,18,43,.08)}
.po-tab{flex:1;padding:12px 8px;border-radius:24px;border:1.5px solid #0b4ea2;background:#fff;color:#0b4ea2;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.po-tab.on{background:#0b4ea2;color:#fff}
.po-tab[data-po="in"]{border-color:#6a3fc1;color:#6a3fc1}

<body>

<div class="po-head">
  <h1 class="po-title">Pull Outs &amp; Pull Ins</h1>
  <!-- Depot, then Route (narrows the list to that route; "All routes" = all). -->
  <div class="po-selects">
    <div class="po-select-wrap">
      <select id="depotSelect" class="po-select" aria-label="Depot" autocomplete="off"><option value="">Loading depots…</option></select>
      <span class="po-arrow">▾</span>
    </div>
    <div class="po-select-wrap">
      <select id="routeSelect" class="po-select" aria-label="Route" autocomplete="off"><option value="">All routes</option></select>
      <span class="po-arrow">▾</span>
    </div>
  </div>
  <!-- Search (run 1-3 digits, block 4), its Run / Block buttons, the day tags.
       No bus: buses aren't assigned until they pull out. -->
  <form id="poForm" class="po-search-wrap" role="search" action="#">
    <input id="poSearch" class="po-search" type="search" inputmode="numeric" enterkeyhint="search" maxlength="4" data-pa-clear
           autocomplete="off" placeholder="Run / Block #" aria-label="Find a run (1-3 digits) or block (4 digits)">
  </form>
  <div id="poTypes" class="pa-types" role="group" aria-label="Result type" hidden></div>
  <div id="poDays" class="pa-days" role="group" aria-label="Day"></div>
</div>

<div id="poLabel" class="po-label">Pull Outs</div>
<div id="poList" class="at-list pa-sc"><div class="po-msg">Loading…</div></div>

<nav class="po-bar" aria-label="Pull outs or pull ins">
  <button type="button" class="po-tab" data-po="out">Pull Outs</button>
  <button type="button" class="po-tab" data-po="in">Pull Ins</button>
</nav>

<script type="module">
// ==========================================================================
// Pull Outs / Pull Ins: every run of the depot pulling out (or in) today,
// earliest to latest, as the Paddles page's scorecards; the list opens at
// the current / next one (the ones already past are above, grayed).
//
// Today = the calendar day (same rule as Live / Trip Sheets): today's pick -
// night liners (a run starting 11 PM-4 AM) included - plus, midnight to 4 AM,
// last night's runs that pull in after midnight; and from 11 PM tomorrow's
// night liners that pull out after midnight. Scheduled times only.
// The depot is the app-wide one (bt_depot, shared with Paddles / Live).
// ==========================================================================
import {
  loadSeasons, seasonFor, loadManifest, loadCalendarOverrides, dayTypeFor, dayLabel,
  loadPaddle, normalizeRun, loadPaddleLinks, todayIso, addDays, fmtClock
} from './assets/pa-schedule.js';
import { modelFromRun, card, stack } from './assets/pa-run-card.js';

const NIGHT_FROM = 23 * 60, OWL_END = 4 * 60;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

let districts = [], overrides = {}, view = lsGet('po_view') === 'in' ? 'in' : 'out';
let events = { out: [], in: [] }, loadSeq = 0, dayKey = '';
// Day tags: today's day (live: next / past, "in 5 min") or another day of the
// depot's schedule (that day's list, plain). Search: run or block number.
let selDay = '';                    // '' = today
let q = '', qFinal = false, typeChoice = '';
// Route dropdown: '' = all routes. An event's route (e.rt) is the one its
// block runs at that pull-out / pull-in (a "21-42" piece: the trip then, else the next).
let routeSel = lsGet('po_route');
const inView = () => events[view].filter(e => !routeSel || e.rt === routeSel);
const todayName = () => dayLabel(dayTypeFor(todayIso(), overrides));
const curDist = () => districts.find(d => (d.label || d.name) === $('depotSelect').value);
const otherDay = () => !!selDay && selDay !== todayName();

// A run's start (report) as clock minutes, for the night-liner rule.
const startClock = row => { const m = String(row.start || '').match(/(\d{1,2}):(\d{2})\s*([AP]M)/i); if (!m) return null; let h = +m[1] % 12; if (/p/i.test(m[3])) h += 12; return h * 60 + +m[2]; };
const isNight = row => { const s = startClock(row); return s != null && (s >= NIGHT_FROM || s < OWL_END); };

// One day's runs of a depot: [{ run, row, day }] with times on that day's clock.
async function runsOf(slug, dayType) {
  const rows = await loadPaddle(slug, dayType);
  return [...rows.values()].map(row => ({ row, run: normalizeRun(row, dayType), dayType }));
}

async function build() {
  const my = ++loadSeq;
  const label = $('depotSelect').value;
  const dist = districts.find(d => (d.label || d.name) === label);
  if (!dist) { $('poList').innerHTML = '<div class="po-msg">No depot</div>'; return; }
  $('poList').innerHTML = '<div class="po-msg">Loading ' + esc(label) + '…</div>';
  renderDays();
  const today = todayIso(), now = nowMin();
  if (otherDay()) {
    // Another day: its runs on its own clock, no "now".
    const dt = PaTags.dayKey(selDay);
    const links = await loadPaddleLinks(dist.name).catch(() => new Map());
    const rows = await loadPaddle(dist.name, encodeURIComponent(selDay.toLowerCase())).catch(() => new Map());
    if (my !== loadSeq) return;
    const out = [], inn = [];
    for (const row of rows.values()) {
      const run = normalizeRun(row, dt);
      if (!run) continue;
      const link = links.get(selDay + '-' + run.runNo) || links.get(dayLabel(dt) + '-' + run.runNo);
      const url = link ? ((window.innerWidth <= 768 ? link.moblink || link.pclink : link.pclink || link.moblink) || '') : '';
      const x = { run, row, dayType: dt };
      run.pieces.forEach((p, i) => {
        const base = { x, url, piece: i, block: p.block, route: p.routeLabel, p };
        if (String(p.startType).toUpperCase() === 'O' && p.startMin != null) out.push({ ...base, min: p.startMin, at: p.startMin });
        if (String(p.endType).toUpperCase() === 'I' && p.endMin != null) inn.push({ ...base, min: p.endMin, at: p.endMin });
      });
    }
    const byTime = (a, b) => a.min - b.min || Number(a.x.run.runNo) - Number(b.x.run.runNo);
    const ev = { out: out.sort(byTime), in: inn.sort(byTime) };
    await addRoutes(ev);
    if (my !== loadSeq) return;
    events = ev;
    fillRoutes();
    dayKey = today + '|' + (now < OWL_END ? 'owl' : now >= NIGHT_FROM ? 'late' : 'day');
    render(true);
    return;
  }
  const tType = dayTypeFor(today, overrides);
  const links = await loadPaddleLinks(dist.name).catch(() => new Map());
  const has = t => (dist.days || []).includes(dayLabel(t));
  const sets = [];
  // Today's runs, on today's clock.
  if (has(tType)) sets.push({ list: await runsOf(dist.name, tType).catch(() => []), shift: 0, keep: () => true });
  // Midnight-4 AM: last night's runs that pull in after midnight.
  if (now < OWL_END) {
    const yType = dayTypeFor(addDays(today, -1), overrides);
    if (has(yType)) sets.push({ list: await runsOf(dist.name, yType).catch(() => []), shift: -1440, keep: x => !isNight(x.row), lastNight: true });
  }
  // From 11 PM: tomorrow's night liners pull out after midnight.
  if (now >= NIGHT_FROM) {
    const nType = dayTypeFor(addDays(today, 1), overrides);
    if (has(nType)) sets.push({ list: await runsOf(dist.name, nType).catch(() => []), shift: 1440, keep: x => isNight(x.row), tonight: true });
  }
  if (my !== loadSeq) return;
  const out = [], inn = [];
  for (const set of sets) {
    for (const x of set.list) {
      if (!x.run || !set.keep(x)) continue;
      const link = links.get(dayLabel(x.dayType) + '-' + x.run.runNo);
      const url = link ? ((window.innerWidth <= 768 ? link.moblink || link.pclink : link.pclink || link.moblink) || '') : '';
      x.run.pieces.forEach((p, i) => {
        const base = { x, url, piece: i, block: p.block, route: p.routeLabel, p, lastNight: !!set.lastNight, tonight: !!set.tonight };
        if (String(p.startType).toUpperCase() === 'O' && p.startMin != null) out.push({ ...base, min: p.startMin + set.shift, at: p.startMin });
        if (String(p.endType).toUpperCase() === 'I' && p.endMin != null) {
          const m = p.endMin + set.shift;
          // Last night's runs: only the pull-ins after midnight.
          if (!set.lastNight || m >= 0) inn.push({ ...base, min: m, at: p.endMin });
        }
      });
    }
  }
  const byTime = (a, b) => a.min - b.min || Number(a.x.run.runNo) - Number(b.x.run.runNo);
  const ev = { out: out.filter(e => !e.lastNight).sort(byTime), in: inn.filter(e => !e.tonight).sort(byTime) };
  await addRoutes(ev);
  if (my !== loadSeq) return;
  events = ev;
  fillRoutes();
  dayKey = today + '|' + (now < OWL_END ? 'owl' : now >= NIGHT_FROM ? 'late' : 'day');
  render(true);
}

// Each event's route at that moment (two-route pieces looked up in the timetable).
async function addRoutes(ev) {
  await Promise.all([...ev.out, ...ev.in].map(async e => {
    e.rt = await PaTags.resolveRoute(e.route, e.block, e.x.dayType, e.at, e.p.startMin, e.p.endMin);
  }));
}
// The Route dropdown: every route with a pull-out or pull-in on the day shown.
function fillRoutes() {
  const rank = r => { const n = parseInt(r, 10); return isNaN(n) ? [1, 0, r] : [0, n, r]; };
  const routes = [...new Set([...events.out, ...events.in].map(e => e.rt).filter(Boolean))]
    .sort((a, b) => { const x = rank(a), y = rank(b); return x[0] - y[0] || x[1] - y[1] || String(x[2]).localeCompare(String(y[2])); });
  if (routeSel && !routes.includes(routeSel)) routeSel = '';
  const sel = $('routeSelect');
  sel.innerHTML = '<option value="">All routes</option>' + routes.map(r => '<option value="' + esc(r) + '">Route ' + esc(r) + '</option>').join('');
  sel.value = routeSel;
}

function dueText(min, now) {
  const d = min - now;
  if (d === 0) return 'now';
  const a = Math.abs(d), h = Math.floor(a / 60), m = a % 60;
  const t = h ? h + 'h ' + (m ? m + 'm' : '') : m + ' min';
  return d > 0 ? 'in ' + t.trim() : t.trim() + ' ago';
}

// ---- search: a run (1-3 digits) or a block (4) --------------------------
// While typing, numbers that start the same match; once final (800 ms, the
// search key, leaving the box, or a 4th digit) only that run / block.
const matchAs = (e, type) => type === 'run'
  ? q.length <= 3 && (qFinal ? e.x.run.runNo === q : e.x.run.runNo.startsWith(q))
  : (qFinal ? q.length === 4 && e.block === q : e.block.startsWith(q));
function searchState() {
  if (!q) return null;
  const n = { run: new Set(), block: new Set() };
  for (const e of inView()) for (const t of ['run', 'block']) if (matchAs(e, t)) n[t].add(e.x.run.runNo);
  const types = ['run', 'block'].map(t => ({ type: t, match: n[t].size > 0, n: n[t].size }));
  return { types, sel: PaTags.pickType(types, typeChoice) };
}
function renderTypes(st) {
  const row = $('poTypes');
  if (!st) { row.hidden = true; row.innerHTML = ''; return; }
  const html = PaTags.typeBar(st.types, st.sel);
  if (row.innerHTML !== html) row.innerHTML = html;
  row.hidden = false;
}
function renderDays() {
  const dist = curDist();
  const days = dist && dist.days && dist.days.length ? dist.days : PaTags.STD_DAYS;
  const html = PaTags.dayTags(days, selDay || todayName(), todayName(), 'data-po-day');
  if ($('poDays').innerHTML !== html) $('poDays').innerHTML = html;
  // The sticky header's height, so a scrolled-to card isn't hidden under it.
  document.documentElement.style.setProperty('--po-hh', document.querySelector('.po-head').offsetHeight + 'px');
}

function render(scroll) {
  const all = inView(), now = nowMin(), other = otherDay();
  const st = searchState();
  renderTypes(st);
  renderDays();
  const list = st ? all.filter(e => st.sel && matchAs(e, st.sel)) : all;
  document.querySelectorAll('.po-tab').forEach(b => b.classList.toggle('on', b.dataset.po === view));
  const label = $('depotSelect').value;
  const word = view === 'out' ? 'Pull Outs' : 'Pull Ins';
  const dayName = other ? selDay : todayName();
  $('poLabel').innerHTML = esc(word) + ' · ' + list.length + '<span class="po-sub">' + esc(label) + (routeSel ? ' · Route ' + esc(routeSel) : '') + ' · ' + esc(dayName) + ' · earliest to latest</span>';
  const box = $('poList');
  if (!list.length) {
    const what = st && qFinal ? (q.length === 4 ? 'Block ' : 'Run ') + q : '';
    box.innerHTML = '<div class="po-msg">No ' + esc(word.toLowerCase()) + (what ? ' for ' + esc(what) : '') + (routeSel ? ' on Route ' + esc(routeSel) : '') + (other ? ' on ' + esc(selDay) : ' today') + '</div>';
    return;
  }
  box.innerHTML = '';
  // Current / next: the first one not more than 2 minutes past (today only).
  const nextIdx = other ? -1 : list.findIndex(e => e.min >= now - 2);
  list.forEach((e, i) => {
    const r = e.x.run;
    const top = document.createElement('div');
    top.className = 'po-time';
    top.innerHTML = '<span class="po-kind">' + (view === 'out' ? 'OUT' : 'IN') + '</span>' +
      '<span class="po-clock">' + esc(fmtClock(e.min)) + '</span>' +
      // Block tag: the route the block runs at that moment ("21/9140").
      '<span class="po-where">' + PaTags.blockTag(e.rt, e.block) +
      (other ? '' : e.lastNight ? ' last night' : e.tonight || e.min >= 1440 ? ' tonight' : '') + '</span>' +
      (other ? '' : '<span class="po-due" data-min="' + e.min + '">' + esc(dueText(e.min, now)) + '</span>');
    const c = card(modelFromRun(r), { paddleUrl: e.url });
    const seg = c.querySelectorAll('.prc-seg')[e.piece];
    if (seg) seg.classList.add('po-hit');
    // All the run's routes stay listed; this piece's is marked (yellow: by the schedule).
    const rts = c.querySelector('.prc-routes');
    if (rts) rts.innerHTML = PaTags.routeList([...new Set(r.pieces.map(p => p.routeLabel))], e.route, false, (a, b) => a === b);
    const wrap = document.createElement('div');
    wrap.className = 'po-ev' + (view === 'in' ? ' in' : '') + (nextIdx >= 0 && i < nextIdx ? ' past' : '') + (i === nextIdx ? ' next' : '');
    wrap.appendChild(stack(top, c, r.dayType));
    box.appendChild(wrap);
  });
  PaTags.resolveBlockTags(box);
  if (scroll && (other || st)) window.scrollTo(0, 0);
  else if (scroll) {
    const target = box.querySelector('.po-ev.next') || box.lastElementChild;
    if (target && nextIdx !== 0) requestAnimationFrame(() => target.scrollIntoView({ block: 'start' }));
    else window.scrollTo(0, 0);
  }
}

// Every 30 s: "in 5 min" / "2 min ago" and which are past; at midnight, 4 AM
// and 11 PM the day's set changes, so build again.
setInterval(() => {
  const now = nowMin(), key = todayIso() + '|' + (now < OWL_END ? 'owl' : now >= NIGHT_FROM ? 'late' : 'day');
  if (key !== dayKey) { build(); return; }
  if (otherDay() || q) return;
  const list = inView();
  const nextIdx = list.findIndex(e => e.min >= now - 2);
  document.querySelectorAll('#poList .po-ev').forEach((el, i) => {
    el.classList.toggle('past', nextIdx >= 0 && i < nextIdx);
    el.classList.toggle('next', i === nextIdx);
    const due = el.querySelector('.po-due');
    if (due) due.textContent = dueText(+due.dataset.min, now);
  });
}, 30000);

document.querySelector('.po-bar').addEventListener('click', e => {
  const b = e.target.closest('[data-po]');
  if (!b || b.dataset.po === view) return;
  view = b.dataset.po; lsSet('po_view', view);
  render(true);
});

// Route dropdown: narrows the list to that route (remembered).
$('routeSelect').addEventListener('change', () => {
  routeSel = $('routeSelect').value; lsSet('po_route', routeSel);
  render(true);
});
// Day tags: today = the live list; another day = that day's schedule.
$('poDays').addEventListener('click', e => {
  const b = e.target.closest('[data-po-day]');
  if (!b) return;
  const d = b.dataset.poDay;
  if ((selDay || todayName()) === d) return;
  selDay = d === todayName() ? '' : d;
  build();
});
// Run / Block buttons.
$('poTypes').addEventListener('click', e => {
  const b = e.target.closest('[data-pa-type]');
  if (!b || b.disabled) return;
  typeChoice = b.dataset.paType;
  render(true);
});
// The search box: same rule as Paddles / Trip Sheets.
(function () {
  const box = $('poSearch');
  let timer = 0;
  const settle = () => {
    clearTimeout(timer); timer = 0;
    const was = qFinal;
    qFinal = !!q;
    if (document.activeElement === box) box.blur();
    if (qFinal !== was) render(true);
  };
  $('poForm').addEventListener('submit', e => { e.preventDefault(); settle(); });
  box.addEventListener('blur', settle);
  box.addEventListener('input', () => {
    const d = box.value.replace(/\D/g, '').slice(0, 4);
    if (d !== box.value) box.value = d;
    clearTimeout(timer); timer = 0;
    q = d; qFinal = false;
    if (!q) typeChoice = '';
    render(!q);
    if (!q) return;
    if (q.length === 4) { settle(); return; }
    timer = setTimeout(settle, 800);
  });
})();

// The depot is app-wide: bt_depot (label), like Paddles / Live / Trip Sheets.
$('depotSelect').addEventListener('change', () => { lsSet('bt_depot', $('depotSelect').value); build(); });
window.addEventListener('storage', e => {
  if (e.key !== 'bt_depot' || !e.newValue || e.newValue === $('depotSelect').value) return;
  if ([...$('depotSelect').options].some(o => o.value === e.newValue)) { $('depotSelect').value = e.newValue; build(); }
});

(async function init() {
  try {
    const [seasons, ov] = await Promise.all([loadSeasons(), loadCalendarOverrides().catch(() => ({}))]);
    overrides = ov || {};
    const season = seasonFor(seasons, todayIso());
    districts = season ? await loadManifest(season) : [];
    const sel = $('depotSelect');
    sel.innerHTML = districts.map(d => '<option value="' + esc(d.label || d.name) + '">' + esc(d.label || d.name) + '</option>').join('');
    const saved = lsGet('bt_depot');
    if (districts.some(d => (d.label || d.name) === saved)) sel.value = saved;
    await build();
  } catch (e) {
    $('poList').innerHTML = '<div class="po-msg">Could not load the schedule. Check your connection and try again.</div>';
  }
})();
</script>
